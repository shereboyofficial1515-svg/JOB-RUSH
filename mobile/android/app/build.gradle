apply plugin: 'com.android.application'

android {
    namespace = "ng.jobrush.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ng.jobrush.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The ONE place the production URL is defined for native code
        // (MainActivity's OAuth hand-off). Must always match
        // capacitor.config.json's server.url above it — see ANDROID.md
        // for how to point a build at a different environment.
        buildConfigField "String", "PRODUCTION_URL", "\"https://job-rush.onrender.com\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Custom Tabs — used only to run the Google/Facebook/Apple OAuth
    // flow outside the app's own WebView (Google blocks OAuth sign-in
    // inside an embedded WebView user-agent). See JobRushWebViewClient.
    implementation "androidx.browser:browser:1.8.0"
    // Firebase Cloud Messaging — background push (new messages,
    // incoming calls while the app isn't foregrounded). Only actually
    // initializes once a real google-services.json replaces the
    // missing one documented in ANDROID.md; the google-services plugin
    // below is applied conditionally for the same reason.
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Applies the Google Services plugin only when google-services.json is
// actually present, so this project still configures/builds even
// before that file is dropped in (see ANDROID.md). `.exists()` never
// throws for a missing file -- unlike the previous version of this
// check, which called `.text` (an actual file read that throws
// FileNotFoundException) inside a bare `catch(Exception e)`, tripping
// Android Studio's Groovy inspections ("Cannot resolve symbol
// 'Exception'" / "Unused catch parameter") for no functional reason.
// No try/catch needed at all once the check itself can't throw.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
