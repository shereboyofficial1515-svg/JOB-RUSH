<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find work — JOB RUSH</title>
  <meta name="description" content="Browse open jobs across Nigeria on JOB RUSH. Search by skill, category, location, employment type and budget." />
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/jobs.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>

  <main id="main" class="container disc-page">
    <header class="disc-head">
      <h1 class="page-title">Find work</h1>
      <nav class="search-tabs" aria-label="What to search">
        <a href="search.html" id="tab-talent">Professionals</a>
        <a href="jobs.html" id="tab-jobs" class="is-active" aria-current="page">Jobs</a>
      </nav>
    </header>

    <form id="jobs-search-form" class="disc-search" role="search" novalidate>
      <div class="disc-searchbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" name="keyword" placeholder="Job title, skill or keyword" aria-label="Search jobs" autocomplete="off" enterkeyhint="search" maxlength="100" />
        <button type="submit" class="btn btn-primary" id="jobs-submit">Search</button>
      </div>
      <div class="disc-controls">
        <button type="button" class="disc-filter-toggle" data-filter-toggle aria-expanded="false" aria-controls="jobs-filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters <span class="disc-filter-count" data-filter-count hidden></span>
        </button>
        <label class="disc-sort"><span>Sort by</span>
          <select name="sort" aria-label="Sort jobs" data-search="false">
            <option value="newest">Newest</option>
            <option value="budget_high">Highest budget</option>
            <option value="deadline">Deadline soonest</option>
          </select>
        </label>
      </div>
      <div class="disc-filters" id="jobs-filters" data-filter-panel>
        <div class="disc-filter-grid">
          <div class="field"><label for="f-category">Category</label><select name="categoryId" id="f-category"><option value="">Any category</option></select></div>
          <div class="field"><label for="f-skill">Skill</label><select name="skillId" id="f-skill"><option value="">Any skill</option></select></div>
          <div class="field"><label for="f-type">Employment type</label>
            <select name="employmentType" id="f-type" data-search="false">
              <option value="">Any type</option>
              <option value="full_time">Full-time</option>
              <option value="part_time">Part-time</option>
              <option value="contract">Contract</option>
              <option value="one_time">One-time</option>
            </select>
          </div>
          <div class="field"><label for="f-level">Experience level</label>
            <select name="experienceLevel" id="f-level" data-search="false">
              <option value="">Any level</option>
              <option value="entry">Entry level</option>
              <option value="intermediate">Intermediate</option>
              <option value="expert">Expert</option>
            </select>
          </div>
          <div class="field"><label for="f-state">State</label><select name="stateId" id="f-state"><option value="">Any state</option></select></div>
          <div class="field"><label for="f-lga">LGA</label><select name="lgaId" id="f-lga" disabled><option value="">Select a state first</option></select></div>
          <div class="field"><label for="f-minbudget">Minimum budget (₦)</label><input type="number" name="minBudget" id="f-minbudget" min="0" step="1000" inputmode="numeric" placeholder="Any" /></div>
        </div>
        <div class="disc-filter-actions">
          <button type="button" class="btn btn-ghost" data-filter-clear>Clear filters</button>
          <button type="submit" class="btn btn-primary">Show jobs</button>
        </div>
      </div>
    </form>

    <p class="disc-summary" id="jobs-summary" aria-live="polite"></p>
    <div id="jobs-list" class="disc-list"></div>
    <div class="disc-more"><button type="button" class="btn btn-secondary" id="load-more" hidden>Load more jobs</button></div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/utils/scrollLock.js"></script>
  <script src="../js/utils/jrSelect.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/icons.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/modules/chrome.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/locationSelect.js"></script>
  <script src="../js/utils/stateViews.js"></script>
  <script src="../js/utils/discovery.js"></script>
  <script>
    const PAGE_SIZE = 20;
    let currentQuery = '';
    let currentPage = 1;
    let loading = false;
    let filterPanel;

    const form = document.getElementById('jobs-search-form');

    function setSummary(text) { document.getElementById('jobs-summary').textContent = text; }

    /** Page 1 replaces the list; later pages append. Shows loading, empty and error states. */
    async function loadJobs(query, page = 1) {
      if (loading) return;
      loading = true;
      currentQuery = query; currentPage = page;
      const list = document.getElementById('jobs-list');
      const moreBtn = document.getElementById('load-more');
      const submit = document.getElementById('jobs-submit');
      submit.disabled = true; moreBtn.disabled = true;
      if (page === 1) {
        list.setAttribute('aria-busy', 'true');
        Discovery.skeletonCards(list, { count: 6, kind: 'job' });
        moreBtn.hidden = true; setSummary('Searching…');
      } else {
        moreBtn.textContent = 'Loading…';
      }
      try {
        const qs = new URLSearchParams(query); qs.set('page', String(page)); qs.set('pageSize', String(PAGE_SIZE));
        const { jobs } = await API.get(`/jobs?${qs.toString()}`);
        if (page === 1 && jobs.length === 0) {
          const q = new URLSearchParams(query);
          q.delete('sort');
          const filtered = [...q.keys()].length > 0;
          StateView.empty(list, {
            icon: 'list',
            title: filtered ? 'No jobs match your search' : 'No open jobs right now',
            message: filtered ? 'Try another keyword, or clear some filters to see more jobs.' : 'New jobs are posted every day. Check back soon.',
            action: filtered ? { label: 'Clear search', onClick: clearAll } : undefined,
          });
          setSummary('');
        } else {
          const html = jobs.map(Discovery.jobCard).join('');
          if (page === 1) { list.innerHTML = html; Animate.stagger(list); } else list.insertAdjacentHTML('beforeend', html);
          const shown = list.querySelectorAll('.job-card').length;
          setSummary(`${shown} job${shown === 1 ? '' : 's'}${jobs.length === PAGE_SIZE ? ' shown' : ''}`);
        }
        moreBtn.hidden = jobs.length < PAGE_SIZE;
      } catch (err) {
        if (page === 1) {
          StateView.error(list, err, { title: 'Jobs couldn’t load', retry: () => loadJobs(query, 1) });
          setSummary('');
        } else {
          Toast.error(StateView.messageFor(err));
        }
      } finally {
        loading = false; submit.disabled = false; moreBtn.disabled = false;
        moreBtn.textContent = 'Load more jobs';
        list.removeAttribute('aria-busy');
      }
    }

    function syncTabs() {
      const k = form.keyword.value.trim();
      document.getElementById('tab-talent').href = `search.html${k ? `?keyword=${encodeURIComponent(k)}` : ''}`;
    }

    function runSearch() {
      const params = Discovery.formToParams(form);
      if (params.get('sort') === 'newest') params.delete('sort');
      window.history.replaceState(null, '', params.toString() ? `?${params.toString()}` : window.location.pathname);
      syncTabs();
      filterPanel.refreshCount();
      loadJobs(params.toString());
    }

    function clearAll() {
      form.keyword.value = '';
      filterPanel.clear(); // clears the filters, then searches again
    }

    (async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      Discovery.restoreForm(form, urlParams, ['stateId', 'lgaId', 'categoryId', 'skillId']);
      form.keyword.addEventListener('input', syncTabs); syncTabs();
      filterPanel = Discovery.initFilterPanel(form, { onChange: runSearch });

      // Results don't wait for the header or the filter lists.
      loadJobs(urlParams.toString());

      Chrome.mountHeader(document.getElementById('header-mount'), { activeLink: 'find-work' });
      Chrome.renderFooter(document.getElementById('footer-mount'));

      // Category/skill/location filters are a progressive enhancement: search works without them.
      API.get('/catalog/categories').then(({ categories }) => {
        form.categoryId.innerHTML = '<option value="">Any category</option>' + categories.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
        if (urlParams.get('categoryId')) form.categoryId.value = urlParams.get('categoryId');
        filterPanel.refreshCount();
      }).catch(() => {});
      API.get('/catalog/skills').then(({ skills }) => {
        form.skillId.innerHTML = '<option value="">Any skill</option>' + skills.map((sk) => `<option value="${esc(sk.id)}">${esc(sk.name)}</option>`).join('');
        if (urlParams.get('skillId')) form.skillId.value = urlParams.get('skillId');
        filterPanel.refreshCount();
      }).catch(() => {});
      Promise.resolve(LocationSelect.init({
        stateSelect: form.stateId,
        lgaSelect: form.lgaId,
        restrictToActive: false,
        statePlaceholder: 'Any state',
        initial: { stateId: urlParams.get('stateId') || undefined, lgaId: urlParams.get('lgaId') || undefined },
      })).then(() => filterPanel.refreshCount()).catch(() => {});

      document.getElementById('load-more').addEventListener('click', () => loadJobs(currentQuery, currentPage + 1));
      form.sort.addEventListener('change', runSearch);
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // closes the phone keyboard
        if (window.matchMedia('(max-width: 1023px)').matches) filterPanel.close();
        runSearch();
      });
    })();
  </script>
</body>

</html>
