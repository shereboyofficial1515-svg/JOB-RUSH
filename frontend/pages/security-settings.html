<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Settings — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard-pages.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard"></nav>
      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">Log out</button>
    </aside>

    <div class="dashboard-main" style="max-width: 640px;">
      <div class="dashboard-topbar">
        <h1 style="font-size: var(--text-2xl); margin-bottom: 0;">Security Settings</h1>
        <div id="notif-bell-mount"></div>
      </div>

      <div class="card" style="margin-bottom: var(--space-5);" id="tfa-card">
        <h3>Two-factor authentication</h3>
        <div id="tfa-body">
          <div class="skeleton" style="height: 16px; width: 60%;"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom: var(--space-5);" id="sessions-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-4);">
          <h3 style="margin-bottom:0;">Active sessions</h3>
          <button class="btn btn-sm btn-danger" id="logout-all-btn">Log out of all devices</button>
        </div>
        <div id="sessions-body">
          <div class="skeleton" style="height: 16px; width: 70%; margin-bottom: 8px;"></div>
          <div class="skeleton" style="height: 16px; width: 50%;"></div>
        </div>
      </div>

      <div class="card" id="devices-card">
        <h3>Recognized devices</h3>
        <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);">We'll email you whenever your account
          signs in from a device we haven't seen before.</p>
        <div id="devices-body">
          <div class="skeleton" style="height: 16px; width: 70%; margin-bottom: 8px;"></div>
          <div class="skeleton" style="height: 16px; width: 50%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/config/assets.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script>
    function disabledStateHtml() {
      return `
      <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);">Two-factor authentication is currently <strong style="color: var(--text-primary);">off</strong>. Add an extra layer of security with an authenticator app (Google Authenticator, Authy, etc).</p>
      <button class="btn btn-primary btn-sm" id="enable-tfa-btn">Enable two-factor authentication</button>
    `;
    }

    function enabledStateHtml() {
      return `
      <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);"><span class="badge badge-verified">Enabled</span> Your account is protected with two-factor authentication.</p>
      <button class="btn btn-danger btn-sm" id="disable-tfa-btn">Disable two-factor authentication</button>
    `;
    }

    async function loadTfaStatus() {
      const body = document.getElementById('tfa-body');
      try {
        const { enabled } = await API.get('/auth/2fa/status');
        body.innerHTML = enabled ? enabledStateHtml() : disabledStateHtml();

        const enableBtn = document.getElementById('enable-tfa-btn');
        if (enableBtn) enableBtn.addEventListener('click', startTfaSetup);

        const disableBtn = document.getElementById('disable-tfa-btn');
        if (disableBtn) disableBtn.addEventListener('click', openDisableModal);
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

    async function startTfaSetup() {
      try {
        const { secret, otpauthUrl } = await API.post('/auth/2fa/setup');
        Modal.open({
          title: 'Set up two-factor authentication',
          bodyHtml: `
          <p class="text-secondary text-sm">Scan this QR code with your authenticator app, or enter the code manually.</p>
          <div id="qr-container" style="display:flex; justify-content:center; margin: var(--space-4) 0; background:#fff; padding: var(--space-4); border-radius: var(--radius-md);"></div>
          <p class="text-xs text-secondary" style="text-align:center; word-break:break-all; margin-bottom: var(--space-4);">${secret}</p>
          <div class="field" id="setup-code-field">
            <label for="setup-code">Enter the 6-digit code from your app</label>
            <input type="text" id="setup-code" inputmode="numeric" maxlength="6" placeholder="123456" />
            <div class="field-error" hidden></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="confirm-setup-btn">Confirm &amp; enable</button>
          </div>
        `,
          onMount: () => {
            try {
              new QRCode(document.getElementById('qr-container'), { text: otpauthUrl, width: 180, height: 180 });
            } catch {
              document.getElementById('qr-container').innerHTML = '<p class="text-xs">QR rendering unavailable — enter the code above manually.</p>';
            }

            document.getElementById('confirm-setup-btn').addEventListener('click', async () => {
              const code = document.getElementById('setup-code').value.trim();
              if (!/^[0-9]{6}$/.test(code)) {
                return FormHelpers.showError(document.getElementById('setup-code-field'), 'Enter the 6-digit code.');
              }
              const btn = document.getElementById('confirm-setup-btn');
              FormHelpers.setLoading(btn, true);
              try {
                const { backupCodes } = await API.post('/auth/2fa/confirm-setup', { code });
                showBackupCodes(backupCodes);
              } catch (err) {
                FormHelpers.showError(document.getElementById('setup-code-field'), err.message);
              } finally {
                FormHelpers.setLoading(btn, false);
              }
            });
          },
        });
      } catch (err) {
        Toast.error(err.message);
      }
    }

    function showBackupCodes(codes) {
      Modal.open({
        title: 'Save your backup codes',
        bodyHtml: `
        <p class="text-secondary text-sm">Store these somewhere safe. Each code works once, and can get you back into your account if you lose access to your authenticator app. <strong style="color: var(--text-primary);">This is the only time they'll be shown.</strong></p>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); font-family: monospace; background: var(--bg-elevated); padding: var(--space-4); border-radius: var(--radius-md); margin: var(--space-4) 0;">
          ${codes.map((c) => `<div>${c}</div>`).join('')}
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" id="done-backup-codes">I've saved these codes</button>
        </div>
      `,
        onMount: () => {
          document.getElementById('done-backup-codes').addEventListener('click', () => {
            Modal.close();
            Toast.success('Two-factor authentication enabled.');
            loadTfaStatus();
          });
        },
      });
    }

    function openDisableModal() {
      Modal.open({
        title: 'Disable two-factor authentication',
        bodyHtml: `
        <p class="text-secondary text-sm">Enter a current code from your authenticator app (or a backup code) to confirm.</p>
        <div class="field" id="disable-code-field">
          <label for="disable-code">Verification code</label>
          <input type="text" id="disable-code" placeholder="123456 or XXXX-XXXX" />
          <div class="field-error" hidden></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-disable-btn">Disable</button>
        </div>
      `,
        onMount: () => {
          document.getElementById('confirm-disable-btn').addEventListener('click', async () => {
            const code = document.getElementById('disable-code').value.trim();
            if (!code) return FormHelpers.showError(document.getElementById('disable-code-field'), 'Enter your code.');
            const btn = document.getElementById('confirm-disable-btn');
            FormHelpers.setLoading(btn, true);
            try {
              await API.post('/auth/2fa/disable', { code });
              Modal.close();
              Toast.success('Two-factor authentication disabled.');
              loadTfaStatus();
            } catch (err) {
              FormHelpers.showError(document.getElementById('disable-code-field'), err.message);
            } finally {
              FormHelpers.setLoading(btn, false);
            }
          });
        },
      });
    }

    function sessionRowHtml(s) {
      return `
      <div class="ledger-row">
        <div>
          <div>${s.user_agent ? esc(s.user_agent.slice(0, 60)) : 'Unknown device'}</div>
          <div class="text-xs text-secondary">${s.ip_address || ''} \u00B7 Last active ${new Date(s.last_seen_at).toLocaleString()}</div>
        </div>
      </div>
    `;
    }

    async function loadSessions() {
      const body = document.getElementById('sessions-body');
      try {
        const { sessions } = await API.get('/auth/sessions');
        body.innerHTML = sessions.length
          ? sessions.map(sessionRowHtml).join('')
          : '<p class="text-secondary text-sm">No active sessions.</p>';
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

    function deviceRowHtml(d) {
      return `
      <div class="ledger-row">
        <div>
          <div>${d.user_agent ? esc(d.user_agent.slice(0, 60)) : 'Unknown device'}</div>
          <div class="text-xs text-secondary">First seen ${new Date(d.first_seen_at).toLocaleDateString()} \u00B7 Last seen ${new Date(d.last_seen_at).toLocaleString()}</div>
        </div>
      </div>
    `;
    }

    async function loadDevices() {
      const body = document.getElementById('devices-body');
      try {
        const { devices } = await API.get('/auth/devices');
        body.innerHTML = devices.length
          ? devices.map(deviceRowHtml).join('')
          : '<p class="text-secondary text-sm">No recognized devices yet.</p>';
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      NotificationBell.render(document.getElementById('notif-bell-mount'));

      SidebarNav.render(user, 'security');
      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      document.getElementById('logout-all-btn').addEventListener('click', () => {
        Modal.open({
          title: 'Log out of all devices?',
          bodyHtml: `
          <p class="text-secondary">You'll need to log in again on every device, including this one.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-logout-all">Log out everywhere</button>
          </div>`,
          onMount: () => {
            document.getElementById('confirm-logout-all').addEventListener('click', async () => {
              try {
                await API.post('/auth/logout-all');
                window.location.href = 'login.html';
              } catch (err) { Toast.error(err.message); }
            });
          },
        });
      });

      loadTfaStatus();
      loadSessions();
      loadDevices();
    })();
  </script>
</body>

</html>
