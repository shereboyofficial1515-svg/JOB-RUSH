<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interviews — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/dashboard-pages.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard"></nav>
      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">Log out</button>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <h1 class="page-title">Interviews</h1>
        <div style="display:flex; align-items:center; gap: var(--space-3);">
          <div id="notif-bell-mount"></div>
          <button class="btn btn-primary" id="schedule-btn" hidden>Schedule interview</button>
        </div>
      </div>

      <div class="wallet-tabs" role="group" aria-label="Interviews">
        <button class="wallet-tab is-active" data-tab="upcoming">Upcoming</button>
        <button class="wallet-tab" data-tab="past">Past</button>
      </div>

      <div id="interviews-list" class="work-list" aria-live="polite">
        <div class="skeleton" style="height:100px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:100px;"></div>
      </div>
    </div>
  </div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/utils/scrollLock.js"></script>
  <script src="../js/utils/jrSelect.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/ringtoneManager.js"></script>
  <script src="../js/modules/incomingCallWatcher.js"></script>
  <script src="../js/modules/pushNotifications.js"></script>
  <script src="../js/utils/stateViews.js"></script>
  <script src="../js/utils/statusLabels.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/utils/icons.js"></script>
  <script src="../js/modules/pullToRefresh.js"></script>
  <script>
    let currentUser = null;
    let interviewsById = new Map();

    const TYPE_LABEL = { video: 'Video interview', audio: 'Audio interview', text: 'Text interview', in_person: 'In-person interview' };
    const TYPE_ICON = { video: 'calendar', audio: 'phone', text: 'message', in_person: 'location' };
    const fmtWhen = (d) => new Date(d).toLocaleString('en-NG', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
    // <input type="datetime-local"> wants local time without a zone.
    const toLocalInput = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };

    // Plain-language state, from whichever side of the interview the viewer is on.
    function interviewNote(iv, isHirer) {
      switch (iv.status) {
        case 'pending': return isHirer ? 'Waiting for the worker to accept or decline.' : 'You’ve been invited to an interview. Accept or decline below.';
        case 'reschedule_requested': return isHirer ? 'A new time was requested. Confirm a time to put it back on the schedule.' : 'A new time was requested. The hirer confirms the final time.';
        case 'in_progress': return 'This interview has started.';
        default: return '';
      }
    }

    function interviewRowHtml(iv) {
      // Which side of THIS interview the current account is on --
      // checked per-record (hirer_user_id/worker_user_id), not by the
      // account's overall role. A single-role account can only ever
      // be on one side anyway, so this changes nothing for them; a
      // 'both'-role account can genuinely be the hirer on one
      // interview and the worker on another, which `currentUser.role
      // === 'hirer'` could never distinguish.
      const isHirer = currentUser.id === iv.hirer_user_id;
      const canRespond = !isHirer && iv.status === 'pending';
      const canJoin = ['scheduled', 'in_progress'].includes(iv.status) && ['video', 'audio'].includes(iv.interview_type);
      const canCancel = ['pending', 'accepted', 'scheduled', 'reschedule_requested'].includes(iv.status);
      const canComplete = isHirer && ['scheduled', 'in_progress'].includes(iv.status);
      // Mirrors the server's rules (interviewService.requestReschedule / confirmReschedule); the server still decides.
      const canRequestNewTime = ['scheduled', 'accepted', 'pending'].includes(iv.status);
      const canConfirmNewTime = isHirer && iv.status === 'reschedule_requested';
      const note = interviewNote(iv, isHirer);
      const icon = Icons[TYPE_ICON[iv.interview_type]] || Icons.calendar;

      return `
      <article class="card work-card" data-interview-id="${esc(iv.id)}">
        <div class="card-head">
          <div class="work-card-head-text">
            <h3 class="work-card-title">${esc(TYPE_LABEL[iv.interview_type] || 'Interview')}</h3>
            <div class="work-card-meta"><span>${isHirer ? 'You’re interviewing' : 'You’re the candidate'}</span><span>${Number(iv.duration_minutes)} min</span></div>
          </div>
          <div class="work-card-pills">${StatusLabels.pill('interview', iv.status)}</div>
        </div>
        <div class="interview-when">${icon}<time datetime="${esc(iv.scheduled_start_at)}">${fmtWhen(iv.scheduled_start_at)}</time></div>
        ${iv.location_address ? `<p class="work-card-note">${esc(iv.location_address)}</p>` : ''}
        ${note ? `<p class="work-card-note">${esc(note)}</p>` : ''}
        ${canRespond || canJoin || canComplete || canConfirmNewTime || canRequestNewTime || canCancel ? `
        <div class="btn-row">
          ${canRespond ? `<button class="btn btn-sm btn-primary" data-action="accept">Accept</button><button class="btn btn-sm btn-ghost" data-action="decline">Decline</button>` : ''}
          ${canJoin ? `<button class="btn btn-sm btn-primary" data-action="join">Join ${iv.interview_type === 'video' ? 'video' : 'audio'} call</button>` : ''}
          ${canConfirmNewTime ? `<button class="btn btn-sm btn-primary" data-action="confirm-time">Confirm new time</button>` : ''}
          ${canComplete ? `<button class="btn btn-sm btn-secondary" data-action="complete">Mark completed</button>` : ''}
          ${canRequestNewTime ? `<button class="btn btn-sm btn-ghost" data-action="request-time">Request new time</button>` : ''}
          ${canCancel ? `<button class="btn btn-sm btn-ghost btn-danger-text" data-action="cancel">Cancel interview</button>` : ''}
        </div>` : ''}
        <div class="call-info interview-call-note" hidden></div>
      </article>
    `;
    }

    async function loadInterviews(tab) {
      const list = document.getElementById('interviews-list');
      try {
        const { interviews } = await API.get(`/interviews/${tab}`);
        interviewsById = new Map(interviews.map((iv) => [iv.id, iv]));
        if (interviews.length === 0) {
          const hirerSide = currentUser.role === 'hirer' || currentUser.role === 'both';
          StateView.empty(list, tab === 'upcoming'
            ? { icon: 'list', title: 'No upcoming interviews', message: hirerSide ? 'Schedule an interview from a job’s applicants list, or with the button above.' : 'When a hirer invites you to an interview, it appears here for you to accept.' }
            : { icon: 'list', title: 'No past interviews', message: 'Completed, cancelled and declined interviews are kept here.' });
          return;
        }
        list.innerHTML = interviews.map(interviewRowHtml).join('');
        Animate.stagger(list, { stepMs: 30 });
        wireActions(tab);
      } catch (err) {
        if (PullToRefresh.isRefreshing()) throw err;
        StateView.error(list, err, { title: 'Unable to load interviews', retry: () => { StateView.skeleton(list, { rows: 2 }); loadInterviews(tab); } });
      }
    }

    // Request (either side) or confirm (hirer) a new time. Same form, different endpoint.
    async function openTimeModal(id, tab, mode) {
      const iv = interviewsById.get(id);
      let initial = iv ? iv.scheduled_start_at : null;
      if (mode === 'confirm') {
        // Prefill with the time that was proposed, read from the interview's own event log.
        try {
          const { events } = await API.get(`/interviews/${id}/events`);
          const req = (events || []).filter((e) => e.event_type === 'reschedule_requested').pop();
          if (req && req.metadata && req.metadata.proposedStartAt) initial = req.metadata.proposedStartAt;
        } catch { /* fall back to the current time */ }
      }
      const confirm = mode === 'confirm';
      Modal.open({
        title: confirm ? 'Confirm the new time' : 'Request a new time',
        dismissOnBackdrop: false,
        bodyHtml: `
        <form id="time-form" novalidate>
          <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);">${confirm
            ? 'This puts the interview back on the schedule at the time below and lets the worker know.'
            : 'Suggest a time that works for you. The interview stays on hold until the hirer confirms.'}</p>
          ${iv ? `<p class="text-sm" style="margin-bottom: var(--space-3);">Currently: <strong>${fmtWhen(iv.scheduled_start_at)}</strong></p>` : ''}
          <div class="field" id="time-field">
            <label for="newTime">${confirm ? 'New date &amp; time' : 'Proposed date &amp; time'}</label>
            <input type="datetime-local" id="newTime" name="newTime" value="${initial ? toLocalInput(initial) : ''}" required />
            <div class="field-error" hidden></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="time-submit">${confirm ? 'Confirm time' : 'Send request'}</button>
          </div>
        </form>`,
        onMount: () => {
          const form = document.getElementById('time-form');
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            FormHelpers.clearErrors(form);
            if (!form.newTime.value) return FormHelpers.showError(document.getElementById('time-field'), 'Choose a date and time.');
            const iso = new Date(form.newTime.value).toISOString();
            const submitBtn = document.getElementById('time-submit');
            FormHelpers.setLoading(submitBtn, true);
            try {
              if (confirm) await API.post(`/interviews/${id}/reschedule/confirm`, { newStartAt: iso });
              else await API.post(`/interviews/${id}/reschedule/request`, { proposedStartAt: iso });
              Toast.success(confirm ? 'New time confirmed.' : 'New time requested.');
              Modal.close();
              loadInterviews(tab);
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(submitBtn, false);
            }
          });
        },
      });
    }

    function wireActions(tab) {
      document.querySelectorAll('[data-action="accept"], [data-action="decline"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.closest('[data-interview-id]').dataset.interviewId;
          try {
            await API.post(`/interviews/${id}/respond`, { accept: btn.dataset.action === 'accept' });
            Toast.success(btn.dataset.action === 'accept' ? 'Interview accepted.' : 'Interview declined.');
            loadInterviews(tab);
          } catch (err) { Toast.error(err.message); }
        });
      });

      document.querySelectorAll('[data-action="cancel"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.closest('[data-interview-id]').dataset.interviewId;
          Modal.open({
            title: 'Cancel this interview?',
            bodyHtml: `
            <p class="text-secondary">The other participant will be notified.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Never mind</button>
              <button type="button" class="btn btn-danger" id="confirm-cancel">Cancel interview</button>
            </div>`,
            onMount: () => {
              document.getElementById('confirm-cancel').addEventListener('click', async () => {
                try {
                  await API.post(`/interviews/${id}/cancel`, {});
                  Toast.success('Interview cancelled.');
                  Modal.close();
                  loadInterviews(tab);
                } catch (err) { Toast.error(err.message); }
              });
            },
          });
        });
      });

      document.querySelectorAll('[data-action="complete"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.closest('[data-interview-id]').dataset.interviewId;
          try {
            await API.post(`/interviews/${id}/complete`);
            Toast.success('Interview marked completed.');
            loadInterviews(tab);
          } catch (err) { Toast.error(err.message); }
        });
      });

      document.querySelectorAll('[data-action="request-time"], [data-action="confirm-time"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.closest('[data-interview-id]').dataset.interviewId;
          openTimeModal(id, tab, btn.dataset.action === 'confirm-time' ? 'confirm' : 'request');
        });
      });

      document.querySelectorAll('[data-action="join"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.closest('[data-interview-id]').dataset.interviewId;
          window.location.href = `call-room.html?type=interview&id=${id}`;
        });
      });
    }

    function scheduleFormHtml() {
      return `
      <form id="schedule-form" novalidate>
        <div class="field" id="type-field">
          <label for="interviewType">Interview type</label>
          <select id="interviewType" name="interviewType">
            <option value="video">Video call</option>
            <option value="audio">Audio call</option>
            <option value="text">Text (messaging)</option>
            <option value="in_person">In person</option>
          </select>
        </div>
        <div class="field" id="start-field">
          <label for="scheduledStartAt">Date &amp; time</label>
          <input type="datetime-local" id="scheduledStartAt" name="scheduledStartAt" required />
          <div class="field-error" hidden></div>
        </div>
        <div class="field">
          <label for="durationMinutes">Duration (minutes)</label>
          <input type="number" id="durationMinutes" name="durationMinutes" value="30" min="10" max="240" />
        </div>
        <div class="field" id="location-field" hidden>
          <label for="locationAddress">Address</label>
          <input type="text" id="locationAddress" name="locationAddress" />
          <div class="field-error" hidden></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="schedule-submit">Schedule</button>
        </div>
      </form>
    `;
    }

    function openScheduleModal(applicationId) {
      Modal.open({
        title: 'Schedule an interview',
        bodyHtml: scheduleFormHtml(),
        onMount: () => {
          const form = document.getElementById('schedule-form');
          const locationField = document.getElementById('location-field');
          form.interviewType.addEventListener('change', () => {
            locationField.hidden = form.interviewType.value !== 'in_person';
          });

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            FormHelpers.clearErrors(form);

            if (!form.scheduledStartAt.value) return FormHelpers.showError(document.getElementById('start-field'), 'Choose a date and time.');
            if (form.interviewType.value === 'in_person' && !form.locationAddress.value.trim()) {
              return FormHelpers.showError(document.getElementById('location-field'), 'An address is required for in-person interviews.');
            }

            const payload = {
              applicationId,
              interviewType: form.interviewType.value,
              scheduledStartAt: new Date(form.scheduledStartAt.value).toISOString(),
              durationMinutes: Number(form.durationMinutes.value) || 30,
              locationAddress: form.locationAddress.value.trim() || undefined,
            };

            const submitBtn = document.getElementById('schedule-submit');
            FormHelpers.setLoading(submitBtn, true);
            try {
              await API.post('/interviews', payload);
              Toast.success('Interview scheduled \u2014 invitation sent.');
              Modal.close();
              loadInterviews('upcoming');
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(submitBtn, false);
            }
          });
        },
      });
    }

    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      NotificationBell.render(document.getElementById('notif-bell-mount'));
      IncomingCallWatcher.start();
      PushNotifications.registerIfAlreadySubscribed();
      currentUser = user;

      SidebarNav.render(user, 'interviews');
      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      if (user.role === 'hirer' || user.role === 'both') {
        const scheduleBtn = document.getElementById('schedule-btn');
        scheduleBtn.hidden = false;
        const applicationId = new URLSearchParams(window.location.search).get('scheduleForApplication');
        scheduleBtn.addEventListener('click', () => openScheduleModal(applicationId || null));
        if (applicationId) openScheduleModal(applicationId);
      }

      document.querySelectorAll('.wallet-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.wallet-tab').forEach((t) => t.classList.remove('is-active'));
          tab.classList.add('is-active');
          loadInterviews(tab.dataset.tab);
        });
      });

      PullToRefresh.init({
        onRefresh: () => loadInterviews(document.querySelector('.wallet-tab.is-active')?.dataset.tab || 'upcoming'),
      });

      loadInterviews('upcoming');
    })();
  </script>
</body>

</html>
