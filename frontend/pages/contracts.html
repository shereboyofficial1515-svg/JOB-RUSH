<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contracts &amp; Payments — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/dashboard-pages.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard"></nav>
      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">Log out</button>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <h1 class="page-title">Contracts &amp; Payments</h1>
        <div id="notif-bell-mount"></div>
      </div>

      <div class="page-notice" id="funding-return-notice" role="status" hidden>
        <strong>Payment submitted.</strong> Escrow shows as funded once Paystack confirms the payment, which can take a moment. Pull down to refresh.
      </div>

      <div id="contracts-list" class="contracts-list" aria-live="polite">
        <div class="skeleton" style="height:100px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:100px;"></div>
      </div>
    </div>
  </div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/utils/scrollLock.js"></script>
  <script src="../js/utils/jrSelect.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/ringtoneManager.js"></script>
  <script src="../js/modules/incomingCallWatcher.js"></script>
  <script src="../js/modules/pushNotifications.js"></script>
  <script src="../js/utils/stateViews.js"></script>
  <script src="../js/utils/statusLabels.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/utils/icons.js"></script>
  <script src="../js/modules/pullToRefresh.js"></script>
  <script>
    let currentUser = null;
    let disputesByContract = new Map();

    // Amounts always carry their currency, straight from the row (NGN by default in the schema).
    function money(n, currency) {
      try {
        return new Intl.NumberFormat('en-NG', { style: 'currency', currency: currency || 'NGN', minimumFractionDigits: 2 }).format(Number(n));
      } catch {
        return `${currency || 'NGN'} ${Number(n).toLocaleString('en-NG', { minimumFractionDigits: 2 })}`;
      }
    }
    const fmtDate = (d) => new Date(d).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });
    const fmtDateTime = (d) => `${fmtDate(d)}, ${new Date(d).toLocaleTimeString('en-NG', { hour: 'numeric', minute: '2-digit', hour12: true })}`;
    const shortRef = (id) => `JR-${String(id).replace(/-/g, '').slice(0, 8).toUpperCase()}`;
    const detailRow = (label, valueHtml) => `<div class="detail-list-row"><dt class="detail-list-label">${esc(label)}</dt><dd class="detail-list-value">${valueHtml}</dd></div>`;

    function contractRowHtml(c, escrowTransactions, escrowFailed) {
      // Which side of THIS contract the viewer is on: a 'both'-role account
      // can be the hirer on one contract and the worker on another.
      const isHirer = currentUser.id === c.hirer_user_id;
      const dispute = disputesByContract.get(c.id);
      return `
      <article class="card contract-card" data-contract-id="${esc(c.id)}">
        <div class="card-head">
          <div class="contract-head-text">
            <h3 class="card-title">${money(c.agreed_amount, c.currency)}</h3>
            <div class="text-secondary text-sm">${isHirer ? 'You hired' : 'You were hired'} · Created ${fmtDate(c.created_at)} · <span class="contract-ref">${shortRef(c.id)}</span></div>
          </div>
          <div class="contract-pills">${StatusLabels.pill('contract', c.status)}${dispute ? StatusLabels.pill('dispute', dispute.status) : ''}</div>
        </div>
        <div class="escrow-section">${escrowFailed ? escrowErrorHtml() : escrowSectionHtml(escrowTransactions, c, isHirer)}</div>
      </article>`;
    }

    function escrowErrorHtml() {
      return `<p class="contract-note" role="status">We couldn’t load the payment status for this contract. Nothing has changed. Pull down or reload to try again.</p>`;
    }

    // Every movement we have a timestamp for, oldest first. Only real columns are used.
    function paymentHistoryHtml(escrowTransactions) {
      const events = [];
      escrowTransactions.forEach((e) => {
        events.push({ at: e.created_at, text: `Payment of ${money(e.amount, e.currency)} started` });
        if (e.funded_at) events.push({ at: e.funded_at, text: `Funded: ${money(e.amount, e.currency)} held in escrow` });
        if (e.released_at) events.push({ at: e.released_at, text: `Released: ${money(e.worker_payout_amount, e.currency)} paid to the worker` });
        if (e.refunded_at) events.push({ at: e.refunded_at, text: `Refunded: ${money(e.amount, e.currency)} returned to the hirer` });
      });
      events.sort((a, b) => new Date(a.at) - new Date(b.at));
      return `
        <details class="contract-history">
          <summary>Payment history (${events.length})</summary>
          <ol class="contract-timeline">
            ${events.map((ev) => `<li><span class="contract-timeline-text">${esc(ev.text)}</span><time datetime="${esc(ev.at)}">${fmtDateTime(ev.at)}</time></li>`).join('')}
          </ol>
        </details>`;
    }

    function escrowSectionHtml(escrowTransactions, c, isHirer) {
      const contractId = c.id;
      if (!escrowTransactions || escrowTransactions.length === 0) {
        return `
        <div class="contract-funding-head"><span class="contract-funding-label">Escrow</span><span class="status-pill status-pill--off">Not funded</span></div>
        <p class="contract-note">${isHirer
          ? `Fund escrow to secure ${money(c.agreed_amount, c.currency)} for this job. You pay through Paystack and the money is held until you release it.`
          : 'The hirer hasn’t funded escrow for this contract yet.'}</p>
        ${isHirer ? `<div class="btn-row"><button class="btn btn-sm btn-primary" data-action="fund" data-contract-id="${esc(contractId)}">Fund escrow</button></div>` : ''}`;
      }
      const escrow = escrowTransactions[0];
      const breakdown = `
        <dl class="detail-list contract-breakdown">
          ${detailRow('Escrow amount', `<strong>${money(escrow.amount, escrow.currency)}</strong>`)}
          ${detailRow(`Platform fee (${Number(escrow.platform_fee_percent)}%)`, money(escrow.platform_fee_amount, escrow.currency))}
          ${detailRow('Worker receives', money(escrow.worker_payout_amount, escrow.currency))}
        </dl>`;
      let actions = '';
      if (isHirer && escrow.status === 'funded') {
        actions = `
        <div class="btn-row">
          <button class="btn btn-sm btn-primary" data-action="release" data-escrow-id="${esc(escrow.id)}">Release to worker</button>
          <button class="btn btn-sm btn-ghost" data-action="dispute" data-contract-id="${esc(contractId)}" data-escrow-id="${esc(escrow.id)}">Open a dispute</button>
        </div>`;
      } else if (isHirer && escrow.status === 'released') {
        actions = `<div class="btn-row"><button class="btn btn-sm btn-secondary" data-action="review" data-contract-id="${esc(contractId)}">Leave a review</button></div>`;
      }
      return `
        <div class="contract-funding-head"><span class="contract-funding-label">Escrow</span>${StatusLabels.pill('escrow', escrow.status)}</div>
        <p class="contract-note">${esc(StatusLabels.note('escrow', escrow.status))}</p>
        ${breakdown}
        ${actions}
        ${paymentHistoryHtml(escrowTransactions)}`;
    }

    async function loadDisputes() {
      // Soft: dispute pills are extra context; the contracts still render without them.
      try {
        const { disputes } = await API.get('/disputes');
        disputesByContract = new Map();
        (disputes || []).forEach((d) => { if (!disputesByContract.has(d.contract_id)) disputesByContract.set(d.contract_id, d); }); // API returns newest first
      } catch {
        disputesByContract = new Map();
      }
    }

    function showFundingReturnNotice() {
      const params = new URLSearchParams(window.location.search);
      if (!params.has('funded')) return;
      // Coming back from Paystack is not proof of payment; only the escrow row is.
      document.getElementById('funding-return-notice').hidden = false;
      ['funded', 'reference', 'trxref'].forEach((k) => params.delete(k));
      const qs = params.toString();
      history.replaceState(null, '', `${window.location.pathname}${qs ? `?${qs}` : ''}`);
    }

    async function loadContracts() {
      const list = document.getElementById('contracts-list');
      try {
        const [{ contracts }] = await Promise.all([API.get('/contracts'), loadDisputes()]);
        if (contracts.length === 0) {
          StateView.empty(list, {
            icon: 'list',
            title: 'No contracts yet',
            message: 'After you hire someone, set up the contract from their card on the job’s Applicants page. It and its escrow payments then appear here.',
          });
          return;
        }
        const escrows = await Promise.all(contracts.map((c) => API.get(`/escrow/contract/${c.id}`)
          .then((r) => ({ rows: r.escrowTransactions }))
          .catch(() => ({ failed: true }))));
        list.innerHTML = contracts.map((c, i) => contractRowHtml(c, escrows[i].rows, escrows[i].failed)).join('');
        Animate.stagger(list, { stepMs: 30 });
        wireActions();
      } catch (err) {
        if (PullToRefresh.isRefreshing()) throw err;
        StateView.error(list, err, { title: 'Unable to load your contracts', retry: () => { StateView.skeleton(list, { rows: 2 }); loadContracts(); } });
      }
    }

    function wireActions() {
      document.querySelectorAll('[data-action="fund"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            const result = await API.post('/escrow/fund', {
              contractId: btn.dataset.contractId,
              callbackUrl: `${window.location.origin}${window.location.pathname}?funded=1`,
            });
            window.location.href = result.authorizationUrl;
          } catch (err) {
            Toast.error(err.message);
          }
        });
      });

      document.querySelectorAll('[data-action="release"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const escrowId = btn.dataset.escrowId;
          Modal.open({
            title: 'Release funds to the worker?',
            bodyHtml: `
            <p class="text-secondary">Only do this once you're satisfied the work is complete. This can't be undone.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <button type="button" class="btn btn-primary" id="confirm-release">Release funds</button>
            </div>`,
            onMount: () => {
              document.getElementById('confirm-release').addEventListener('click', async (e) => {
                const btn = e.currentTarget;
                if (btn.disabled) return;
                if (typeof Connectivity !== 'undefined' && !Connectivity.isOnline()) {
                  Toast.error('You’re offline. Nothing was released. Reconnect and try again.');
                  return;
                }
                btn.disabled = true;
                try {
                  // Releasing escrow can't be undone, so when biometric login is
                  // on in the app, ask the OS to confirm it's really the owner.
                  // The server still decides: it re-checks the session, that this
                  // user is the hirer, and that the escrow is funded.
                  if (typeof BiometricService !== 'undefined') {
                    const check = await BiometricService.confirmSensitive(currentUser.id, 'Confirm releasing funds to the worker');
                    if (!check.ok) {
                      Toast.error(check.outcome === 'cancelled' || check.outcome === 'fallback' ? 'Confirmation cancelled. Funds were not released.' : (check.message || 'We couldn’t confirm it’s you. Funds were not released.'));
                      return;
                    }
                  }
                  await API.post(`/escrow/${escrowId}/release`);
                  if (typeof Native !== 'undefined') Native.haptic('success');
                  Toast.success('Funds released to the worker.');
                  Modal.close();
                  loadContracts();
                } catch (err) {
                  Toast.error(err.status === 0 ? 'We couldn’t reach the server, so we can’t confirm the release. Check this contract before trying again.' : err.message);
                } finally {
                  btn.disabled = false;
                }
              });
            },
          });
        });
      });

      document.querySelectorAll('[data-action="review"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const contractId = btn.dataset.contractId;
          let selectedRating = 5;
          Modal.open({
            title: 'Leave a review',
            bodyHtml: `
            <form id="review-form" novalidate>
              <div class="field">
                <label>Rating</label>
                <div id="star-picker" style="display:flex; gap: var(--space-2); font-size: var(--text-2xl); cursor:pointer;">
                  ${[1, 2, 3, 4, 5].map((n) => `<span data-star="${n}" class="text-gold">\u2605</span>`).join('')}
                </div>
              </div>
              <div class="field" id="reviewText-field">
                <label for="reviewText">Review (optional)</label>
                <textarea id="reviewText" name="reviewText" rows="4" placeholder="How did the work go?"></textarea>
              </div>
              <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="review-submit">Submit review</button>
              </div>
            </form>
          `,
            onMount: () => {
              const stars = document.querySelectorAll('#star-picker [data-star]');
              const paintStars = () => stars.forEach((s) => { s.style.opacity = Number(s.dataset.star) <= selectedRating ? '1' : '0.3'; });
              paintStars();
              stars.forEach((s) => s.addEventListener('click', () => { selectedRating = Number(s.dataset.star); paintStars(); }));

              document.getElementById('review-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitBtn = document.getElementById('review-submit');
                FormHelpers.setLoading(submitBtn, true);
                try {
                  await API.post('/reviews', {
                    contractId,
                    rating: selectedRating,
                    reviewText: document.getElementById('reviewText').value.trim() || undefined,
                  });
                  Toast.success('Review submitted.');
                  Modal.close();
                } catch (err) {
                  Toast.error(err.code === 'REVIEW_EXISTS' ? 'You already reviewed this contract.' : err.message);
                } finally {
                  FormHelpers.setLoading(submitBtn, false);
                }
              });
            },
          });
        });
      });

      document.querySelectorAll('[data-action="dispute"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const contractId = btn.dataset.contractId;
          Modal.open({
            title: 'Open a dispute',
            bodyHtml: `
            <form id="dispute-form" novalidate>
              <div class="field" id="reason-field">
                <label for="reason">Reason</label>
                <input type="text" id="reason" name="reason" placeholder="e.g. Work not delivered as agreed" required />
                <div class="field-error" hidden></div>
              </div>
              <div class="field" id="description-field">
                <label for="description">Details</label>
                <textarea id="description" name="description" rows="4" required placeholder="Explain what happened, with as much detail as you can."></textarea>
                <div class="field-error" hidden></div>
              </div>
              <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
                <button type="submit" class="btn btn-primary" id="dispute-submit">Open dispute</button>
              </div>
            </form>
          `,
            onMount: () => {
              const form = document.getElementById('dispute-form');
              form.addEventListener('submit', async (e) => {
                e.preventDefault();
                FormHelpers.clearErrors(form);
                const reason = form.reason.value.trim();
                const description = form.description.value.trim();
                if (reason.length < 3) return FormHelpers.showError(document.getElementById('reason-field'), 'Enter a reason.');
                if (description.length < 10) return FormHelpers.showError(document.getElementById('description-field'), 'Add a bit more detail (at least 10 characters).');

                const submitBtn = document.getElementById('dispute-submit');
                FormHelpers.setLoading(submitBtn, true);
                try {
                  await API.post('/disputes', { contractId, reason, description });
                  Toast.success('Dispute opened. Escrow is frozen until this is resolved.');
                  Modal.close();
                  loadContracts();
                } catch (err) {
                  Toast.error(err.message);
                } finally {
                  FormHelpers.setLoading(submitBtn, false);
                }
              });
            },
          });
        });
      });
    }

    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      NotificationBell.render(document.getElementById('notif-bell-mount'));
      IncomingCallWatcher.start();
      PushNotifications.registerIfAlreadySubscribed();
      if (user.role === 'worker') { window.location.href = 'dashboard.html'; return; }
      currentUser = user;

      SidebarNav.render(user, 'contracts');
      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      PullToRefresh.init({ onRefresh: () => loadContracts() });

      showFundingReturnNotice();
      loadContracts();
    })();
  </script>
</body>

</html>
