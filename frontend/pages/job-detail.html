<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job details — JOB RUSH</title>
<meta name="description" content="Job details on JOB RUSH: description, requirements, budget and how to apply." />
<link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/animations.css" />
<link rel="stylesheet" href="../css/jobs.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="header-mount"></div>

<main id="main" class="container jd-page">
  <button type="button" class="page-back-btn" id="page-back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Back
  </button>
  <div class="jd-layout" id="jd-layout" aria-busy="true">
    <article class="jd-main" id="job-detail-content">
      <div class="skeleton" style="height: 22px; width: 30%; margin-bottom: 16px;"></div>
      <div class="skeleton" style="height: 32px; width: 75%; margin-bottom: 12px;"></div>
      <div class="skeleton" style="height: 16px; width: 50%; margin-bottom: 24px;"></div>
      <div class="skeleton" style="height: 120px; margin-bottom: 24px;"></div>
      <div class="skeleton" style="height: 200px;"></div>
    </article>
    <aside class="jd-side" id="job-detail-sidebar">
      <div class="skeleton" style="height: 240px; border-radius: var(--radius-lg);"></div>
    </aside>
  </div>
</main>

<div id="footer-mount"></div>

<script src="../js/config/assets.js"></script>
<script src="../js/config/env.js"></script>
<script src="../js/utils/scrollLock.js"></script>
<script src="../js/utils/jrSelect.js"></script>
<script src="../js/config/api.js"></script>
<script src="../js/modules/accessibility.js"></script>
<script src="../js/utils/sanitize.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/animate.js"></script>
<script src="../js/utils/formHelpers.js"></script>
<script src="../js/utils/modal.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/modules/notificationBell.js"></script>
<script src="../js/modules/chrome.js"></script>
<script src="../js/modules/auth.js"></script>
<script src="../js/utils/stateViews.js"></script>
<script src="../js/utils/discovery.js"></script>
<script>
  const STATUS_LABELS = { open: 'Open', closed: 'Closed', filled: 'Filled', cancelled: 'Cancelled', draft: 'Draft', expired: 'Expired' };
  const APPLICATION_LABELS = { applied: 'Applied', invited: 'Invited', accepted: 'Accepted', declined: 'Declined', shortlisted: 'Shortlisted', hired: 'Hired', rejected: 'Not selected' };

  function longDate(d) {
    const t = new Date(d);
    return Number.isFinite(t.getTime()) ? t.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : null;
  }

  function loginHref() {
    return `login.html?returnTo=${encodeURIComponent(window.location.pathname + window.location.search)}`;
  }

  /**
   * The one action this viewer can take on this job. Role rules match the API:
   * applying/saving needs a worker (or 'both') account; the poster manages instead.
   */
  function viewerAction(job, user, application) {
    const canWork = user && (user.role === 'worker' || user.role === 'both');
    if (user && job.hirer_user_id === user.id) return { kind: 'owner' };
    if (job.status !== 'open') return { kind: 'closed' };
    if (!user) return { kind: 'login' };
    if (!canWork) return { kind: 'hirer' };
    if (application && application.status !== 'withdrawn') return { kind: 'applied', status: application.status };
    return { kind: 'apply' };
  }

  function primaryActionHtml(job, action, { compact = false } = {}) {
    switch (action.kind) {
      case 'owner': return '<a href="my-jobs.html" class="btn btn-secondary">Manage this job</a>';
      case 'closed': return `<span class="status-pill status-pill--off">This job is ${esc((STATUS_LABELS[job.status] || job.status).toLowerCase())}</span>`;
      case 'login': return `<a href="${esc(loginHref())}" class="btn btn-primary">Log in to apply</a>`;
      case 'hirer': return compact ? '' : '<p class="jd-note">You’re signed in with a hirer account. Only professional accounts can apply to jobs.</p>';
      case 'applied': return `<a href="applications.html" class="btn btn-secondary">${esc(APPLICATION_LABELS[action.status] || 'Applied')} · View</a>`;
      default: return '<button type="button" class="btn btn-primary" data-apply>Apply now</button>';
    }
  }

  function openApplyModal(jobId) {
    Modal.open({
      title: 'Apply to this job',
      bodyHtml: `
        <form id="apply-form" novalidate>
          <div class="field" id="cover-note-field">
            <label for="coverNote">Cover note</label>
            <textarea id="coverNote" name="coverNote" rows="5" maxlength="2000" placeholder="Tell the hirer why you're a good fit..."></textarea>
            <div class="field-error" hidden></div>
          </div>
          <div class="field" id="rate-field">
            <label for="proposedRate">Your proposed rate (₦, optional)</label>
            <input type="number" id="proposedRate" name="proposedRate" min="0" inputmode="numeric" />
            <div class="field-error" hidden></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="apply-submit">Submit application</button>
          </div>
        </form>
      `,
      onMount: () => {
        const form = document.getElementById('apply-form');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('apply-submit');
          FormHelpers.setLoading(submitBtn, true);
          try {
            await API.post(`/jobs/${jobId}/applications`, {
              coverNote: form.coverNote.value.trim() || undefined,
              proposedRate: form.proposedRate.value ? Number(form.proposedRate.value) : undefined,
            });
            Modal.close();
            Toast.success('Application submitted.');
            document.querySelectorAll('[data-apply]').forEach((btn) => {
              btn.outerHTML = '<a href="applications.html" class="btn btn-secondary">Applied · View</a>';
            });
          } catch (err) {
            Toast.error(StateView.messageFor(err));
          } finally {
            FormHelpers.setLoading(submitBtn, false);
          }
        });
      },
    });
  }

  function sidebarHtml(job, user, action, saved) {
    const amount = Discovery.budgetAmount(job);
    const type = Discovery.budgetTypeLabel(job.budget_type);
    const canSave = user && (user.role === 'worker' || user.role === 'both') && job.hirer_user_id !== user.id;
    const primary = primaryActionHtml(job, action);
    return `
      <div class="card jd-side-card">
        <div class="jd-side-label">Budget</div>
        <p class="jd-side-budget${amount ? '' : ' is-muted'}">${esc(amount || 'Not specified')}</p>
        ${amount && type ? `<div class="jd-side-type">${esc(type)}</div>` : ''}
        <div class="jd-side-poster">
          <div class="jd-side-label">Posted by</div>
          <strong>${esc(job.hirer_display_name || 'JOB RUSH hirer')}</strong>
        </div>
        <div class="jd-actions">
          ${primary}
          ${canSave ? `<button type="button" class="btn btn-ghost" id="save-cta" aria-pressed="${saved}">${saved ? 'Saved ✓' : 'Save job'}</button>` : ''}
          ${user && job.hirer_user_id !== user.id ? '<button type="button" class="jd-report" id="report-job-cta">Report this job</button>' : ''}
        </div>
      </div>`;
  }

  function stickyHtml(job, action) {
    const primary = primaryActionHtml(job, action, { compact: true });
    if (!primary) return '';
    const amount = Discovery.budgetAmount(job);
    const type = Discovery.budgetTypeLabel(job.budget_type);
    return `
      <div class="jd-sticky" id="jd-sticky">
        <div class="jd-sticky-budget">
          <strong>${esc(amount || 'Budget not specified')}</strong>
          ${amount && type ? `<span>${esc(type)}</span>` : ''}
        </div>
        ${primary}
      </div>`;
  }

  function contentHtml(job) {
    const location = Discovery.place(job.area_name, job.lga_name, job.state_name);
    const amount = Discovery.budgetAmount(job);
    const type = Discovery.budgetTypeLabel(job.budget_type);
    const deadline = job.deadline ? longDate(job.deadline) : null;
    const facts = [
      [Icons.wallet, 'Budget', amount ? `${amount}${type ? ` · ${type}` : ''}` : 'Not specified'],
      [Icons.briefcase, 'Employment', Discovery.employmentLabel(job.employment_type)],
      [Icons.user, 'Experience', Discovery.experienceLabel(job.experience_level)],
      [Icons.location, 'Location', location],
      [Icons.calendar, 'Apply by', deadline],
      [Icons.clock, 'Posted', longDate(job.created_at)],
    ].filter((f) => f[2]);
    const tags = [
      job.category_name ? `<span class="badge badge-neutral">${esc(job.category_name)}</span>` : '',
      job.status && job.status !== 'open' ? `<span class="status-pill status-pill--off">${esc(STATUS_LABELS[job.status] || job.status)}</span>` : '<span class="status-pill status-pill--on">Open</span>',
    ].join('');
    return `
      <header>
        <div class="jd-tags">${tags}</div>
        <h1 class="jd-title">${esc(job.title)}</h1>
        <p class="jd-byline">
          <span>${Icons.business}${esc(job.hirer_display_name || 'JOB RUSH hirer')}</span>
          ${location ? `<span>${Icons.location}${esc(location)}</span>` : ''}
          <span>${Icons.clock}Posted ${esc(Discovery.timeAgo(job.created_at))}</span>
        </p>
      </header>

      <dl class="jd-facts" aria-label="Job summary">
        ${facts.map(([icon, label, value]) => `<div class="jd-fact"><dt>${icon}<span>${label}</span></dt><dd>${esc(value)}</dd></div>`).join('')}
      </dl>

      <section class="jd-section" aria-labelledby="jd-desc-h">
        <h2 id="jd-desc-h">Description</h2>
        <p class="jd-text">${esc(job.description)}</p>
      </section>

      ${job.additional_requirements ? `
      <section class="jd-section" aria-labelledby="jd-req-h">
        <h2 id="jd-req-h">Requirements</h2>
        <p class="jd-text">${esc(job.additional_requirements)}</p>
      </section>` : ''}

      ${job.skills && job.skills.length ? `
      <section class="jd-section" aria-labelledby="jd-skills-h">
        <h2 id="jd-skills-h">Skills needed</h2>
        <ul class="jd-chips">${job.skills.map((s) => `<li>${esc(s.name)}</li>`).join('')}</ul>
      </section>` : ''}
    `;
  }

  function wireSave(job, initiallySaved) {
    const saveCta = document.getElementById('save-cta');
    if (!saveCta) return;
    let saved = initiallySaved;
    saveCta.addEventListener('click', async () => {
      saveCta.disabled = true;
      try {
        if (!saved) {
          await API.post(`/jobs/${job.id}/save`);
          Toast.success('Job saved.');
        } else {
          await API.delete(`/jobs/${job.id}/save`);
          Toast.success('Removed from saved jobs.');
        }
        saved = !saved;
        saveCta.textContent = saved ? 'Saved ✓' : 'Save job';
        saveCta.setAttribute('aria-pressed', String(saved));
        Animate.pop(saveCta);
      } catch (err) {
        Toast.error(StateView.messageFor(err));
      } finally {
        saveCta.disabled = false;
      }
    });
  }

  function wireReport(job) {
    const reportCta = document.getElementById('report-job-cta');
    if (!reportCta) return;
    reportCta.addEventListener('click', () => {
      Modal.open({
        title: 'Report this job',
        bodyHtml: `
          <div class="field" id="report-reason-field">
            <label for="report-reason">Why are you reporting this job?</label>
            <textarea id="report-reason" rows="3" placeholder="e.g. This looks fraudulent / spam / inappropriate"></textarea>
            <div class="field-error" hidden></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-report-job">Submit report</button>
          </div>`,
        onMount: () => {
          document.getElementById('confirm-report-job').addEventListener('click', async () => {
            const reason = document.getElementById('report-reason').value.trim();
            if (reason.length < 3) return FormHelpers.showError(document.getElementById('report-reason-field'), 'Tell us a bit more.');
            try {
              await API.post(`/jobs/${job.id}/report`, { reason });
              Toast.success('Report submitted. Thank you.');
              Modal.close();
            } catch (err) {
              Toast.error(StateView.messageFor(err));
            }
          });
        },
      });
    });
  }

  function showNotFound(message) {
    const content = document.getElementById('job-detail-content');
    document.getElementById('job-detail-sidebar').innerHTML = '';
    StateView.empty(content, {
      icon: 'list',
      title: 'Job not found',
      message,
      action: { label: 'Browse jobs', href: 'jobs.html' },
    });
  }

  async function load(jobId, user) {
    const layout = document.getElementById('jd-layout');
    const content = document.getElementById('job-detail-content');
    const sidebar = document.getElementById('job-detail-sidebar');
    layout.setAttribute('aria-busy', 'true');
    try {
      const isWorker = user && (user.role === 'worker' || user.role === 'both');
      // A worker's existing application / saved state comes from their own lists; if those fail the page still works.
      const [{ job }, appsResult, savedResult] = await Promise.all([
        API.get(`/jobs/${encodeURIComponent(jobId)}`),
        isWorker ? API.get('/applications/me').catch(() => null) : null,
        isWorker ? API.get('/saved-jobs').catch(() => null) : null,
      ]);
      const application = appsResult && (appsResult.applications || []).find((a) => a.job_id === job.id);
      const saved = !!(savedResult && (savedResult.jobs || []).some((j) => j.id === job.id));
      const action = viewerAction(job, user, application);

      document.title = `${job.title} — JOB RUSH`;
      content.innerHTML = contentHtml(job);
      sidebar.innerHTML = sidebarHtml(job, user, action, saved);
      document.getElementById('jd-sticky')?.remove();
      const sticky = stickyHtml(job, action);
      if (sticky) {
        document.body.insertAdjacentHTML('beforeend', sticky);
        document.body.classList.add('has-jd-sticky');
      }

      document.querySelectorAll('[data-apply]').forEach((btn) => btn.addEventListener('click', () => openApplyModal(job.id)));
      wireSave(job, saved);
      wireReport(job);
    } catch (err) {
      if (err && err.status === 404) {
        showNotFound('This job may have been removed or the link is incomplete.');
      } else {
        sidebar.innerHTML = '';
        StateView.error(content, err, { title: 'This job couldn’t load', retry: () => load(jobId, user) });
      }
    } finally {
      layout.removeAttribute('aria-busy');
    }
  }

  (async function init() {
    document.getElementById('page-back-btn').addEventListener('click', () => {
      let cameFromThisSite = false;
      try { cameFromThisSite = !!document.referrer && new URL(document.referrer).origin === window.location.origin; } catch { /* treated as direct */ }
      if (cameFromThisSite && window.history.length > 1) window.history.back();
      else window.location.href = 'jobs.html';
    });

    const jobId = new URLSearchParams(window.location.search).get('id');
    const user = await Chrome.mountHeader(document.getElementById('header-mount'), { activeLink: 'find-work' });
    Chrome.renderFooter(document.getElementById('footer-mount'));

    const looksLikeId = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(jobId || '');
    if (!looksLikeId) {
      document.getElementById('jd-layout').removeAttribute('aria-busy');
      showNotFound(jobId ? 'This job link doesn’t look right. It may have been copied incompletely.' : 'Open a job from the list to see its details.');
      return;
    }
    load(jobId, user);
  })();
</script>
</body>
</html>
