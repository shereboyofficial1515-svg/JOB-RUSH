<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard">
        <!-- populated by JS based on role -->
      </nav>

      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">
        Log out
      </button>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <div>
          <h1 id="welcome-heading" style="font-size: var(--text-2xl); margin-bottom: var(--space-1);"></h1>
          <p class="text-secondary text-sm" id="welcome-sub"></p>
        </div>
        <div id="topbar-badges" style="display:flex; gap: var(--space-2); align-items:center;"></div>
        <div id="notif-bell-mount"></div>
      </div>

      <div class="card referral-feedback-banner" id="referral-feedback-banner" hidden>
        <div>
          <strong>You joined Job Rush through a referral</strong>
          <p class="text-secondary text-sm" style="margin-bottom:0;">Share your experience so far — it helps whoever referred you, and takes less than a minute.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="referral-feedback-btn" type="button">Share your experience</button>
      </div>

      <div class="stat-grid" id="stat-grid">
        <!-- populated by JS -->
      </div>

      <section class="card" id="activity-card">
        <h3>Recent activity</h3>
        <div id="activity-body">
          <div class="skeleton" style="height: 16px; width: 80%; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 16px; width: 60%;"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/ringtoneManager.js"></script>
  <script src="../js/modules/incomingCallWatcher.js"></script>
  <script src="../js/modules/pushNotifications.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/modules/onboarding.js"></script>
  <script>
    function statCard(label, value) {
      return `<div class="card stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
    }

    async function loadWorkerDashboard(user) {
      SidebarNav.render(user, 'overview');
      document.getElementById('welcome-heading').textContent = `Welcome back, ${user.fullName.split(' ')[0]}`;
      document.getElementById('welcome-sub').textContent = "Here's what's happening with your profile.";

      const statGrid = document.getElementById('stat-grid');
      statGrid.innerHTML = [statCard('Applications', '—'), statCard('Upcoming interviews', '—'), statCard('Wallet balance', '—'), statCard('Profile completion', '—')].join('');

      try {
        const [applications, interviews, wallet, profile] = await Promise.all([
          API.get('/applications/me').catch(() => ({ applications: [] })),
          API.get('/interviews/upcoming').catch(() => ({ interviews: [] })),
          API.get('/wallet').catch(() => ({ wallet: { available_balance: 0 } })),
          API.get('/profiles/worker/me').catch(() => ({ profile: null })),
        ]);

        statGrid.innerHTML = [
          statCard('Applications', applications.applications.length),
          statCard('Upcoming interviews', interviews.interviews.length),
          statCard('Wallet balance', `₦${Number(wallet.wallet.available_balance).toLocaleString()}`),
          statCard('Profile completion', `${profile.profile?.profile_completion_percent ?? 0}%`),
        ].join('');
        Animate.stagger(statGrid, { stepMs: 30 });

        const badges = document.getElementById('topbar-badges');
        if (profile.profile?.verification_status === 'approved') badges.innerHTML += '<span class="badge badge-verified badge-enter">Verified</span>';
        if (profile.profile?.is_pro) badges.innerHTML += '<span class="badge badge-pro badge-enter">PRO</span>';

        const activityBody = document.getElementById('activity-body');
        if (applications.applications.length === 0) {
          activityBody.innerHTML = `<div class="empty-state fade-in"><img src="${ASSETS.emptyState}" alt="" /><h3>No applications yet</h3><p>Browse open jobs and apply to get started.</p><a href="../pages/jobs.html" class="btn btn-primary btn-sm">Browse jobs</a></div>`;
        } else {
          activityBody.innerHTML = applications.applications.slice(0, 5).map((a) =>
            `<div style="display:flex; justify-content:space-between; padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle);">
             <span>${esc(a.job_title)}</span>
             <span class="badge badge-neutral">${a.status}</span>
           </div>`
          ).join('');
          Animate.stagger(activityBody, { stepMs: 25 });
        }
      } catch (err) {
        Toast.error('Could not load your dashboard right now.');
      }
    }

    async function loadHirerDashboard(user) {
      SidebarNav.render(user, 'overview');
      document.getElementById('welcome-heading').textContent = `Welcome back, ${user.fullName.split(' ')[0]}`;
      document.getElementById('welcome-sub').textContent = "Here's an overview of your hiring activity.";

      const statGrid = document.getElementById('stat-grid');
      statGrid.innerHTML = [statCard('Open jobs', '—'), statCard('Total applicants', '—'), statCard('Upcoming interviews', '—'), statCard('Active contracts', '—')].join('');

      try {
        const [jobs, interviews, contracts] = await Promise.all([
          API.get('/jobs/mine').catch(() => ({ jobs: [] })),
          API.get('/interviews/upcoming').catch(() => ({ interviews: [] })),
          API.get('/contracts').catch(() => ({ contracts: [] })),
        ]);

        const openJobs = jobs.jobs.filter((j) => j.status === 'open');

        statGrid.innerHTML = [
          statCard('Open jobs', openJobs.length),
          statCard('Total postings', jobs.jobs.length),
          statCard('Upcoming interviews', interviews.interviews.length),
          statCard('Active contracts', contracts.contracts.filter((c) => c.status === 'active').length),
        ].join('');
        Animate.stagger(statGrid, { stepMs: 30 });

        const activityBody = document.getElementById('activity-body');
        if (jobs.jobs.length === 0) {
          activityBody.innerHTML = `<div class="empty-state fade-in"><img src="${ASSETS.emptyState}" alt="" /><h3>You haven't posted a job yet</h3><p>Post your first job to start receiving applications.</p><a href="my-jobs.html" class="btn btn-primary btn-sm">Post a job</a></div>`;
        } else {
          activityBody.innerHTML = jobs.jobs.slice(0, 5).map((j) =>
            `<div style="display:flex; justify-content:space-between; padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle);">
             <span>${esc(j.title)}</span>
             <span class="badge badge-neutral">${j.status}</span>
           </div>`
          ).join('');
          Animate.stagger(activityBody, { stepMs: 25 });
        }
      } catch (err) {
        Toast.error('Could not load your dashboard right now.');
      }
    }

    function openReferralFeedbackModal() {
      let selectedRating = 0;
      Modal.open({
        title: 'Share your Job Rush experience',
        bodyHtml: `
          <p class="text-secondary text-sm">This goes to the person who referred you and helps qualify their referral — only you can submit it.</p>
          <div class="field">
            <label>Your rating</label>
            <div class="star-rating-input" id="star-rating-input">
              ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star-btn" data-rating="${n}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}
            </div>
          </div>
          <div class="field">
            <label for="referral-feedback-text">What was your experience using Job Rush?</label>
            <textarea id="referral-feedback-text" rows="4" maxlength="2000"></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="submit-referral-feedback-btn">Submit feedback</button>
          </div>
        `,
        onMount: (modalEl) => {
          const stars = modalEl.querySelectorAll('.star-btn');
          stars.forEach((btn) => {
            btn.addEventListener('click', () => {
              selectedRating = Number(btn.dataset.rating);
              stars.forEach((s) => s.classList.toggle('is-filled', Number(s.dataset.rating) <= selectedRating));
            });
          });
          modalEl.querySelector('#submit-referral-feedback-btn').addEventListener('click', async (e) => {
            const feedbackText = modalEl.querySelector('#referral-feedback-text').value.trim();
            if (selectedRating < 1) return Toast.error('Please select a rating.');
            if (!feedbackText) return Toast.error('Please share a few words about your experience.');
            const btn = e.currentTarget;
            btn.disabled = true;
            try {
              await API.post('/referrals/feedback', { rating: selectedRating, feedbackText });
              Toast.success('Thank you for your feedback!');
              Modal.close();
              document.getElementById('referral-feedback-banner').hidden = true;
            } catch (err) {
              Toast.error(err.message);
            } finally {
              btn.disabled = false;
            }
          });
        },
      });
    }

    async function checkReferralFeedbackPrompt() {
      try {
        const status = await API.get('/referrals/my-status');
        if (status.referred && !status.feedbackSubmitted) {
          document.getElementById('referral-feedback-banner').hidden = false;
        }
      } catch {
        // Not critical — the banner just doesn't show if this fails.
      }
    }

    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      NotificationBell.render(document.getElementById('notif-bell-mount'));
      IncomingCallWatcher.start();
      PushNotifications.registerIfAlreadySubscribed();
      document.getElementById('referral-feedback-btn').addEventListener('click', openReferralFeedbackModal);
      checkReferralFeedbackPrompt();

      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      if (user.role === 'hirer') {
        await loadHirerDashboard(user);
      } else {
        await loadWorkerDashboard(user);
      }

      // Dashboard is the one page every signup path (password+OTP,
      // OAuth) always lands on first — the single correct place to
      // show onboarding exactly once. Fires after the dashboard's own
      // content is in place so it isn't the very first thing painted.
      Onboarding.maybeShow();
    })();
  </script>
</body>

</html>
