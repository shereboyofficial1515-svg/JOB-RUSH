<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/dashboard-pages.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard"></nav>
      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">Log out</button>
    </aside>

    <div class="dashboard-main" style="max-width: 760px;">
      <div class="dashboard-topbar">
        <h1 style="font-size: var(--text-2xl); margin-bottom: 0;">Settings</h1>
        <div id="notif-bell-mount"></div>
      </div>

      <nav class="settings-tabs" id="settings-tabs" aria-label="Settings sections"></nav>

      <div id="settings-content">
        <div class="skeleton" style="height: 300px;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/upload.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/ringtoneManager.js"></script>
  <script src="../js/modules/incomingCallWatcher.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/modules/locationSelect.js"></script>
  <script>
    // ============================================================
    // Shared helpers
    // ============================================================
    let currentUser = null;
    let currentSettings = null;

    function toggleHtml(id, checked, extra = '') {
      return `
      <label class="toggle-switch" ${extra}>
        <input type="checkbox" id="${id}" ${checked ? 'checked' : ''} />
        <span class="toggle-track"></span>
      </label>`;
    }

    function settingsRowHtml(title, desc, controlHtml) {
      return `
      <div class="settings-row">
        <div class="settings-row-text">
          <div class="settings-row-title">${title}</div>
          ${desc ? `<div class="settings-row-desc">${desc}</div>` : ''}
        </div>
        <div class="settings-row-control">${controlHtml}</div>
      </div>`;
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 KB';
      const units = ['bytes', 'KB', 'MB', 'GB'];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function confirmWithPassword({ title, description, confirmLabel, onConfirm }) {
      Modal.open({
        title,
        bodyHtml: `
        <p class="text-secondary">${description}</p>
        <div class="field" id="confirm-password-field">
          <label for="confirm-password">Confirm your password</label>
          <input type="password" id="confirm-password" autocomplete="current-password" />
          <div class="field-error" hidden></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-password-action">${confirmLabel}</button>
        </div>`,
        onMount: (modalEl) => {
          FormHelpers.wirePasswordToggles(modalEl);
          document.getElementById('confirm-password-action').addEventListener('click', async () => {
            const password = document.getElementById('confirm-password').value;
            if (!password) return FormHelpers.showError(document.getElementById('confirm-password-field'), 'Enter your password.');
            const btn = document.getElementById('confirm-password-action');
            FormHelpers.setLoading(btn, true);
            try {
              await onConfirm(password);
            } catch (err) {
              FormHelpers.showError(document.getElementById('confirm-password-field'), err.message);
            } finally {
              FormHelpers.setLoading(btn, false);
            }
          });
        },
      });
    }

    async function patchSettings(partial, successMessage) {
      try {
        const { settings } = await API.patch('/settings', partial);
        currentSettings = settings;
        // Re-applies immediately (and refreshes the localStorage cache
        // accessibility.js reads on next page load) so a change made
        // here -- e.g. chat theme/wallpaper -- doesn't wait for the
        // next page's own GET /settings round trip to take effect.
        if (typeof Accessibility !== 'undefined') Accessibility.applyFromSettings(settings);
        if (successMessage) Toast.success(successMessage);
        return settings;
      } catch (err) {
        Toast.error(err.message);
        throw err;
      }
    }

    // ============================================================
    // Tab scaffolding
    // ============================================================
    const TABS = [
      { key: 'profile', label: 'Profile' },
      { key: 'account', label: 'Account & Security' },
      { key: 'sessions', label: 'Sessions & Devices' },
      { key: 'chat', label: 'Chat' },
      { key: 'storage', label: 'Data & Storage' },
      { key: 'support', label: 'Support' },
      { key: 'help', label: 'Help & Feedback' },
      { key: 'accessibility', label: 'Accessibility' },
    ];

    function renderTabsNav(activeKey) {
      const nav = document.getElementById('settings-tabs');
      nav.innerHTML = TABS.map(
        (t) => `<button type="button" class="settings-tab ${t.key === activeKey ? 'is-active' : ''}" data-tab-key="${t.key}">${t.label}</button>`
      ).join('');
      nav.querySelectorAll('[data-tab-key]').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tabKey));
      });
    }

    function switchTab(key) {
      const url = new URL(window.location.href);
      url.searchParams.set('tab', key);
      history.replaceState(null, '', url);
      renderTabsNav(key);
      loadTab(key);
    }

    const TAB_LOADERS = {};

    function loadTab(key) {
      const content = document.getElementById('settings-content');
      content.innerHTML = `<div class="skeleton" style="height: 300px;"></div>`;
      const loader = TAB_LOADERS[key] || TAB_LOADERS.profile;
      loader(content).catch((err) => {
        content.innerHTML = `<p class="text-secondary">${err.message}</p>`;
      });
    }

    async function ensureSettingsLoaded() {
      if (!currentSettings) {
        const { settings } = await API.get('/settings');
        currentSettings = settings;
      }
      return currentSettings;
    }

    // ============================================================
    // TAB: Profile (professional/company details + verification)
    // ============================================================
    function workerFormHtml(profile) {
      const canSubmit = ['not_submitted', 'rejected', 'resubmission_required'].includes(profile.verification_status);
      return `
      <form id="profile-form" novalidate>
        <div class="card" style="margin-bottom: var(--space-5);">
          <h3>Verification status</h3>
          ${profile.verification_status === 'approved'
          ? `<span class="badge badge-verified">Verified professional</span>`
          : `<p class="text-secondary text-sm">Status: <strong style="text-transform:capitalize;">${profile.verification_status.replace('_', ' ')}</strong></p>`
        }
          ${canSubmit ? `
            <div id="verification-uploads" style="margin-top: var(--space-4);">
              <div class="text-sm text-secondary" style="margin-bottom: var(--space-3);">Upload at least one document (e.g. government ID) to request the free Verified badge.</div>
              <div id="uploaded-docs-list" style="margin-bottom: var(--space-3);"></div>
              <button type="button" class="btn btn-sm btn-secondary" id="add-doc-btn">Upload document</button>
              <button type="button" class="btn btn-sm btn-primary" id="submit-verification-btn" style="margin-left: var(--space-2);" disabled>Submit for review</button>
            </div>
          ` : profile.verification_status === 'submitted' || profile.verification_status === 'under_review'
          ? `<p class="text-secondary text-sm" style="margin-top: var(--space-3);">Your documents are being reviewed. We'll notify you once a decision is made.</p>`
          : ''}
        </div>

        <div class="field">
          <label>Profile picture</label>
          <div style="display:flex; align-items:center; gap: var(--space-4);">
            <img id="profile-picture-preview" src="${profile.profile_picture_url || ASSETS.defaultAvatar}" alt="" width="72" height="72" style="border-radius:50%; object-fit:cover; border: 2px solid var(--border-gold);" />
            <button type="button" class="btn btn-sm btn-secondary" id="change-picture-btn">Change photo</button>
          </div>
        </div>
        <div class="field" id="title-field">
          <label for="professionalTitle">Professional title</label>
          <input type="text" id="professionalTitle" name="professionalTitle" value="${esc(profile.professional_title || '')}" placeholder="e.g. Electrician" />
          <div class="field-error" hidden></div>
        </div>
        <div class="field" id="bio-field">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" rows="4">${esc(profile.bio || '')}</textarea>
          <div class="field-hint">A longer, complete bio improves your profile completion score.</div>
          <div class="field-error" hidden></div>
        </div>
        <div class="field">
          <label for="experienceYears">Years of experience</label>
          <input type="number" id="experienceYears" name="experienceYears" min="0" max="80" value="${profile.experience_years ?? ''}" />
        </div>
        <div class="field">
          <label for="availabilityStatus">Availability</label>
          <select id="availabilityStatus" name="availabilityStatus">
            <option value="available" ${profile.availability_status === 'available' ? 'selected' : ''}>Available</option>
            <option value="busy" ${profile.availability_status === 'busy' ? 'selected' : ''}>Busy</option>
            <option value="unavailable" ${profile.availability_status === 'unavailable' ? 'selected' : ''}>Unavailable</option>
          </select>
        </div>
        <div class="settings-field-grid cols-2">
          <div class="field">
            <label for="workingDays">Working days</label>
            <input type="text" id="workingDays" name="workingDays" value="${esc(profile.working_days || '')}" placeholder="e.g. Mon–Fri" />
          </div>
          <div class="field">
            <label for="workingHours">Working hours</label>
            <input type="text" id="workingHours" name="workingHours" value="${esc(profile.working_hours || '')}" placeholder="e.g. 8am–6pm" />
          </div>
        </div>
        <div class="settings-field-grid cols-2">
          <div class="field">
            <label for="startingPrice">Starting price</label>
            <input type="number" id="startingPrice" name="startingPrice" min="0" step="1" value="${profile.starting_price ?? ''}" placeholder="e.g. 15000" />
          </div>
          <div class="field">
            <label for="priceCurrency">Currency</label>
            <select id="priceCurrency" name="priceCurrency">
              <option value="NGN" ${profile.price_currency !== 'USD' ? 'selected' : ''}>NGN (₦)</option>
              <option value="USD" ${profile.price_currency === 'USD' ? 'selected' : ''}>USD ($)</option>
            </select>
          </div>
        </div>

        <h3 style="margin-top: var(--space-6);">Location</h3>
        <div class="field-note" id="location-message" hidden style="color: var(--color-warning, #92400e); background: var(--color-warning-bg, #fef3c7); padding: var(--space-3); border-radius: var(--radius-md, 6px); margin-bottom: var(--space-3);"></div>
        <div class="settings-field-grid cols-3">
          <div class="field">
            <label for="stateId">State</label>
            <select id="stateId" name="stateId"><option value="">Loading…</option></select>
          </div>
          <div class="field">
            <label for="lgaId">LGA</label>
            <select id="lgaId" name="lgaId" disabled><option value="">Select a state first</option></select>
          </div>
          <div class="field">
            <label for="areaId">Area</label>
            <select id="areaId" name="areaId" disabled><option value="">Select an LGA first</option></select>
          </div>
        </div>

        <h3 style="margin-top: var(--space-6);">Skills</h3>
        <div class="field">
          <div id="skills-picker" class="text-secondary text-sm">Loading skills…</div>
        </div>

        <button type="submit" class="btn btn-primary" id="profile-submit">Save changes</button>
      </form>
    `;
    }

    function populateLocationSelects(form, profile) {
      return LocationSelect.init({
        stateSelect: form.stateId,
        lgaSelect: form.lgaId,
        areaSelect: form.areaId,
        messageEl: form.querySelector('#location-message'),
        initial: { stateId: profile.state_id, lgaId: profile.lga_id, areaId: profile.area_id },
      });
    }

    async function populateSkillsPicker(profile) {
      const mount = document.getElementById('skills-picker');
      try {
        const { skills } = await API.get('/catalog/skills');
        const selectedIds = new Set((profile.skills || []).map((s) => s.id));
        mount.innerHTML = `
          <div style="display:flex; flex-wrap:wrap; gap: var(--space-2); max-height: 220px; overflow-y:auto; padding: var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);">
            ${skills.map((s) => `
              <label style="display:flex; align-items:center; gap: var(--space-2); font-size: var(--text-sm); background: rgba(240,240,240,0.05); padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill);">
                <input type="checkbox" name="skillIds" value="${s.id}" style="width:auto;" ${selectedIds.has(s.id) ? 'checked' : ''} />
                ${esc(s.name)}
              </label>
            `).join('')}
          </div>
        `;
      } catch (err) {
        mount.innerHTML = `<span class="text-secondary">Couldn't load skills.</span>`;
      }
    }

    function wireProfilePictureUpload() {
      const btn = document.getElementById('change-picture-btn');
      const preview = document.getElementById('profile-picture-preview');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const file = await Upload.pickFile({ accept: 'image/jpeg,image/png,image/webp,image/gif' });
        if (!file) return;
        const originalLabel = btn.textContent;
        btn.disabled = true;
        try {
          const uploaded = await Upload.uploadProfilePicture(file, (percent) => {
            btn.textContent = `Uploading… ${percent}%`;
          });
          btn.textContent = originalLabel;
          await API.patch(currentUser.role === 'hirer' ? '/profiles/hirer/me' : '/profiles/worker/me', {
            profilePictureUrl: uploaded.publicUrl,
          });
          preview.src = uploaded.publicUrl;
          preview.classList.add('icon-pop');
          Toast.success('Profile picture updated.');
        } catch (err) {
          Toast.error(err.message);
        } finally {
          btn.textContent = originalLabel;
          btn.disabled = false;
        }
      });
    }

    const DOCUMENT_TYPES = [
      { value: 'government_id', label: 'Government ID' },
      { value: 'proof_of_address', label: 'Proof of address' },
      { value: 'certification', label: 'Professional certification' },
    ];

    let pendingDocuments = [];

    function renderUploadedDocs() {
      const list = document.getElementById('uploaded-docs-list');
      if (!list) return;
      list.innerHTML = pendingDocuments.length
        ? pendingDocuments.map((d, i) => `<div class="text-sm" style="display:flex; justify-content:space-between; padding: var(--space-2) 0;"><span>${d.label}</span><button type="button" class="btn btn-sm btn-ghost" data-remove-doc="${i}">Remove</button></div>`).join('')
        : `<div class="text-sm text-secondary">No documents added yet.</div>`;

      list.querySelectorAll('[data-remove-doc]').forEach((btn) => {
        btn.addEventListener('click', () => {
          pendingDocuments.splice(Number(btn.dataset.removeDoc), 1);
          renderUploadedDocs();
          document.getElementById('submit-verification-btn').disabled = pendingDocuments.length === 0;
        });
      });
    }

    function wireVerificationUpload() {
      const addBtn = document.getElementById('add-doc-btn');
      const submitBtn = document.getElementById('submit-verification-btn');
      if (!addBtn) return;

      addBtn.addEventListener('click', () => {
        Modal.open({
          title: 'Upload a document',
          bodyHtml: `
          <div class="field">
            <label for="docType">Document type</label>
            <select id="docType">${DOCUMENT_TYPES.map((t) => `<option value="${t.value}">${t.label}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label for="docFile">File</label>
            <input type="file" id="docFile" accept="image/jpeg,image/png,application/pdf" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="confirm-doc-upload">Upload</button>
          </div>
        `,
          onMount: () => {
            document.getElementById('confirm-doc-upload').addEventListener('click', async () => {
              const fileInput = document.getElementById('docFile');
              const docType = document.getElementById('docType');
              const file = fileInput.files[0];
              if (!file) { Toast.error('Choose a file first.'); return; }

              const confirmBtn = document.getElementById('confirm-doc-upload');
              FormHelpers.setLoading(confirmBtn, true);
              try {
                const result = await Upload.uploadVerificationDocument(file, docType.value);
                pendingDocuments.push({
                  documentType: docType.value,
                  storagePath: result.storagePath,
                  fileSize: result.sizeBytes,
                  label: DOCUMENT_TYPES.find((t) => t.value === docType.value).label,
                });
                renderUploadedDocs();
                submitBtn.disabled = false;
                Modal.close();
                Toast.success('Document uploaded.');
              } catch (err) {
                Toast.error(err.message);
              } finally {
                FormHelpers.setLoading(confirmBtn, false);
              }
            });
          },
        });
      });

      submitBtn.addEventListener('click', async () => {
        FormHelpers.setLoading(submitBtn, true);
        try {
          await API.post('/verification/submit', {
            documents: pendingDocuments.map(({ documentType, storagePath, fileSize }) => ({ documentType, storagePath, fileSize })),
          });
          Toast.success('Submitted for review.');
          pendingDocuments = [];
          loadTab('profile');
        } catch (err) {
          Toast.error(err.message);
        } finally {
          FormHelpers.setLoading(submitBtn, false);
        }
      });

      renderUploadedDocs();
    }

    function hirerFormHtml(profile) {
      return `
      <form id="profile-form" novalidate>
        <div class="field" id="displayName-field">
          <label for="displayName">Display name</label>
          <input type="text" id="displayName" name="displayName" value="${esc(profile.display_name || '')}" placeholder="Your name or company name" />
          <div class="field-error" hidden></div>
        </div>
        <div class="field" id="bio-field">
          <label for="bio">About</label>
          <textarea id="bio" name="bio" rows="4">${esc(profile.bio || '')}</textarea>
        </div>
        <div class="field">
          <label style="display:flex; align-items:center; gap: var(--space-2);">
            <input type="checkbox" id="isCompany" name="isCompany" style="width:auto;" ${profile.is_company ? 'checked' : ''} />
            This is a company account
          </label>
        </div>

        <h3 style="margin-top: var(--space-6);">Location</h3>
        <div class="field-note" id="location-message" hidden style="color: var(--color-warning, #92400e); background: var(--color-warning-bg, #fef3c7); padding: var(--space-3); border-radius: var(--radius-md, 6px); margin-bottom: var(--space-3);"></div>
        <div class="settings-field-grid cols-3">
          <div class="field">
            <label for="stateId">State</label>
            <select id="stateId" name="stateId"><option value="">Loading…</option></select>
          </div>
          <div class="field">
            <label for="lgaId">LGA</label>
            <select id="lgaId" name="lgaId" disabled><option value="">Select a state first</option></select>
          </div>
          <div class="field">
            <label for="areaId">Area</label>
            <select id="areaId" name="areaId" disabled><option value="">Select an LGA first</option></select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="profile-submit">Save changes</button>
      </form>
    `;
    }

    function wireWorkerForm(profile) {
      const form = document.getElementById('profile-form');
      wireProfilePictureUpload();
      populateLocationSelects(form, profile);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        FormHelpers.clearErrors(form);
        const submitBtn = document.getElementById('profile-submit');
        FormHelpers.setLoading(submitBtn, true);
        try {
          const skillIds = Array.from(form.querySelectorAll('input[name="skillIds"]:checked')).map((el) => el.value);
          await API.patch('/profiles/worker/me', {
            professionalTitle: form.professionalTitle.value.trim() || undefined,
            bio: form.bio.value.trim() || undefined,
            experienceYears: form.experienceYears.value ? Number(form.experienceYears.value) : undefined,
            availabilityStatus: form.availabilityStatus.value,
            workingDays: form.workingDays.value.trim() || undefined,
            workingHours: form.workingHours.value.trim() || undefined,
            startingPrice: form.startingPrice.value ? Number(form.startingPrice.value) : undefined,
            priceCurrency: form.priceCurrency.value,
            stateId: form.stateId.value || undefined,
            lgaId: form.lgaId.value || undefined,
            areaId: form.areaId.value || undefined,
            skillIds,
          });
          Toast.success('Profile updated.');
        } catch (err) {
          if (err.details) FormHelpers.applyApiValidationErrors(form, err.details);
          Toast.error(err.message);
        } finally {
          FormHelpers.setLoading(submitBtn, false);
        }
      });
    }

    function wireHirerForm(profile) {
      const form = document.getElementById('profile-form');
      populateLocationSelects(form, profile);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        FormHelpers.clearErrors(form);
        const submitBtn = document.getElementById('profile-submit');
        FormHelpers.setLoading(submitBtn, true);
        try {
          await API.patch('/profiles/hirer/me', {
            displayName: form.displayName.value.trim() || undefined,
            bio: form.bio.value.trim() || undefined,
            isCompany: form.isCompany.checked,
            stateId: form.stateId.value || undefined,
            lgaId: form.lgaId.value || undefined,
            areaId: form.areaId.value || undefined,
          });
          Toast.success('Profile updated.');
        } catch (err) {
          if (err.details) FormHelpers.applyApiValidationErrors(form, err.details);
          Toast.error(err.message);
        } finally {
          FormHelpers.setLoading(submitBtn, false);
        }
      });
    }

    TAB_LOADERS.profile = async function loadProfileTab(content) {
      if (currentUser.role === 'hirer') {
        const { profile } = await API.get('/profiles/hirer/me');
        const safeHirerProfile = profile || {};
        content.innerHTML = hirerFormHtml(safeHirerProfile);
        wireHirerForm(safeHirerProfile);
      } else {
        const { profile } = await API.get('/profiles/worker/me');
        const safeProfile = profile || { verification_status: 'not_submitted' };
        content.innerHTML = workerFormHtml(safeProfile);
        wireWorkerForm(safeProfile);
        populateSkillsPicker(safeProfile);
        pendingDocuments = [];
        wireVerificationUpload();
      }
    };

    // ============================================================
    // TAB: Account & Security
    // ============================================================
    function accountTabHtml(user, settings) {
      const isHirer = user.role === 'hirer' || user.role === 'both';
      const isWorker = user.role === 'worker' || user.role === 'both';
      return `
      <div class="card" style="margin-bottom: var(--space-5);">
        <h3>Account information</h3>
        ${settingsRowHtml(
        'Email address',
        user.email ? `${esc(user.email)} ${user.emailVerified ? '<span class="badge badge-verified" style="margin-left:6px;">Verified</span>' : ''}` : 'Not set',
        `<button type="button" class="btn btn-sm btn-secondary" id="change-email-btn">${user.email ? 'Change' : 'Add'}</button>`
      )}
        ${settingsRowHtml(
        'Phone number',

    function disabledTfaHtml() {
      return `
      <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);">Two-factor authentication is currently <strong style="color: var(--text-primary);">off</strong>. Add an extra layer of security with an authenticator app (Google Authenticator, Authy, etc).</p>
      <button class="btn btn-primary btn-sm" id="enable-tfa-btn">Enable two-factor authentication</button>
    `;
    }
    function enabledTfaHtml() {
      return `
      <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);"><span class="badge badge-verified">Enabled</span> Your account is protected with two-factor authentication.</p>
      <button class="btn btn-danger btn-sm" id="disable-tfa-btn">Disable two-factor authentication</button>
    `;
    }

    async function loadTfaStatus() {
      const body = document.getElementById('tfa-body');
      try {
        const { enabled } = await API.get('/auth/2fa/status');
        body.innerHTML = enabled ? enabledTfaHtml() : disabledTfaHtml();
        const enableBtn = document.getElementById('enable-tfa-btn');
        if (enableBtn) enableBtn.addEventListener('click', startTfaSetup);
        const disableBtn = document.getElementById('disable-tfa-btn');
        if (disableBtn) disableBtn.addEventListener('click', openDisableTfaModal);
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

    async function startTfaSetup() {
      try {
        const { secret, otpauthUrl } = await API.post('/auth/2fa/setup');
        Modal.open({
          title: 'Set up two-factor authentication',
          bodyHtml: `
          <p class="text-secondary text-sm">Scan this QR code with your authenticator app, or enter the code manually.</p>
          <div id="qr-container" style="display:flex; justify-content:center; margin: var(--space-4) 0; background:#fff; padding: var(--space-4); border-radius: var(--radius-md);"></div>
          <p class="text-xs text-secondary" style="text-align:center; word-break:break-all; margin-bottom: var(--space-4);">${secret}</p>
          <div class="field" id="setup-code-field">
            <label for="setup-code">Enter the 6-digit code from your app</label>
            <input type="text" id="setup-code" inputmode="numeric" maxlength="6" placeholder="123456" />
            <div class="field-error" hidden></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="confirm-setup-btn">Confirm &amp; enable</button>
          </div>
        `,
          onMount: () => {
            try {
              new QRCode(document.getElementById('qr-container'), { text: otpauthUrl, width: 180, height: 180 });
            } catch {
              document.getElementById('qr-container').innerHTML = '<p class="text-xs">QR rendering unavailable — enter the code above manually.</p>';
            }
            document.getElementById('confirm-setup-btn').addEventListener('click', async () => {
              const code = document.getElementById('setup-code').value.trim();
              if (!/^[0-9]{6}$/.test(code)) return FormHelpers.showError(document.getElementById('setup-code-field'), 'Enter the 6-digit code.');
              const btn = document.getElementById('confirm-setup-btn');
              FormHelpers.setLoading(btn, true);
              try {
                const { backupCodes } = await API.post('/auth/2fa/confirm-setup', { code });
                showBackupCodes(backupCodes);
              } catch (err) {
                FormHelpers.showError(document.getElementById('setup-code-field'), err.message);
              } finally {
                FormHelpers.setLoading(btn, false);
              }
            });
          },
        });
      } catch (err) {
        Toast.error(err.message);
      }
    }

    function showBackupCodes(codes) {
      Modal.open({
        title: 'Save your backup codes',
        bodyHtml: `
        <p class="text-secondary text-sm">Store these somewhere safe. Each code works once. <strong style="color: var(--text-primary);">This is the only time they'll be shown.</strong></p>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); font-family: monospace; background: var(--bg-elevated); padding: var(--space-4); border-radius: var(--radius-md); margin: var(--space-4) 0;">
          ${codes.map((c) => `<div>${c}</div>`).join('')}
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" id="done-backup-codes">I've saved these codes</button>
        </div>
      `,
        onMount: () => {
          document.getElementById('done-backup-codes').addEventListener('click', () => {
            Modal.close();
            Toast.success('Two-factor authentication enabled.');
            loadTfaStatus();
          });
        },
      });
    }

        <div class="field" id="disable-code-field">

    };

    function sessionRowHtml(s) {
      const label = `${s.browser} on ${s.os}${s.deviceType && s.deviceType !== 'desktop' ? ` (${s.deviceType})` : ''}`;
      return `
      <div class="ledger-row">
        <div>
          <div>${esc(label)} ${s.is_current ? '<span class="badge badge-verified">This device</span>' : ''}</div>
          <div class="text-xs text-secondary">${s.ip_address || ''} · Signed in ${new Date(s.created_at).toLocaleDateString()} · Last active ${new Date(s.last_seen_at).toLocaleString()}</div>
        </div>
        ${!s.is_current ? `<button type="button" class="btn btn-sm btn-ghost" data-revoke-session="${s.id}">Log out</button>` : ''}
      </div>
    `;
    }

    async function loadSessionsList() {
      const body = document.getElementById('sessions-body');
      try {
        const { sessions } = await API.get('/auth/sessions');
        body.innerHTML = sessions.length ? sessions.map(sessionRowHtml).join('') : '<p class="text-secondary text-sm">No active sessions.</p>';
        body.querySelectorAll('[data-revoke-session]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            FormHelpers.setLoading(btn, true);
            try {
              await API.post(`/auth/sessions/${btn.dataset.revokeSession}/revoke`);
              Toast.success('Device logged out.');
              loadSessionsList();
            } catch (err) {
              Toast.error(err.message);
              FormHelpers.setLoading(btn, false);
            }
          });
        });
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

            <option value="never" ${settings.media_auto_download === 'never' ? 'selected' : ''}>Never</option>
            <option value="wifi_only" ${settings.media_auto_download === 'wifi_only' ? 'selected' : ''}>Wi-Fi only</option>
            <option value="always" ${settings.media_auto_download === 'always' ? 'selected' : ''}>Always</option>
          </select>`)}
        ${settingsRowHtml('Call ringtone', 'Play a ringtone for incoming calls. Turning this off only silences call audio -- other notifications are unaffected.', toggleHtml('call-ringtone-toggle', settings.call_ringtone_enabled))}
      </div>

      <div class="card" style="margin-bottom: var(--space-5);">
        <h3>Blocked users</h3>
        <div id="blocked-users-body"><div class="skeleton" style="height: 16px; width: 50%;"></div></div>
      </div>

      <div class="card" style="margin-bottom: var(--space-5);">
        <h3>Archived chats</h3>
        <div id="archived-chats-body"><div class="skeleton" style="height: 16px; width: 50%;"></div></div>
      </div>

      <div class="card">
        <h3>Export your data</h3>
        <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);">Download a copy of your conversations and messages as a JSON file.</p>
        <button type="button" class="btn btn-sm btn-secondary" id="export-chats-btn">Export chat data</button>
      </div>
    `;

      document.getElementById('chat-theme-select').addEventListener('change', (e) => patchSettings({ chatTheme: e.target.value }, 'Chat theme updated.'));
      document.getElementById('chat-wallpaper-select').addEventListener('change', (e) => patchSettings({ chatWallpaper: e.target.value }, 'Wallpaper updated.'));
      document.getElementById('chat-font-size-select').addEventListener('change', (e) => patchSettings({ chatFontSize: e.target.value }, 'Message text size updated.'));
      document.getElementById('chat-previews-toggle').addEventListener('change', (e) => patchSettings({ chatMessagePreviews: e.target.checked }, 'Preference updated.'));
      document.getElementById('media-auto-download-select').addEventListener('change', (e) => patchSettings({ mediaAutoDownload: e.target.value }, 'Preference updated.'));
      document.getElementById('call-ringtone-toggle').addEventListener('change', (e) => patchSettings({ callRingtoneEnabled: e.target.checked }, 'Preference updated.'));

      loadBlockedUsers();
      loadArchivedChats();

      document.getElementById('export-chats-btn').addEventListener('click', exportChatData);
    };

    async function loadBlockedUsers() {
      const body = document.getElementById('blocked-users-body');
      try {
        const { blocked } = await API.get('/messaging/block');
        body.innerHTML = blocked && blocked.length ? blocked.map(blockedUserRowHtml).join('') : '<p class="text-secondary text-sm">You haven\'t blocked anyone.</p>';
        body.querySelectorAll('[data-unblock]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            FormHelpers.setLoading(btn, true);
            try {
              await API.delete(`/messaging/block/${btn.dataset.unblock}`);
              Toast.success('User unblocked.');
              loadBlockedUsers();
            } catch (err) {
              Toast.error(err.message);
              FormHelpers.setLoading(btn, false);
            }
          });
        });
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

    async function loadArchivedChats() {
      const body = document.getElementById('archived-chats-body');
      try {
        const { conversations } = await API.get('/messaging/conversations?archived=true');
        body.innerHTML = conversations.length ? conversations.map(archivedChatRowHtml).join('') : '<p class="text-secondary text-sm">No archived chats.</p>';
        body.querySelectorAll('[data-unarchive]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            FormHelpers.setLoading(btn, true);
            try {
              await API.post(`/messaging/conversations/${btn.dataset.unarchive}/unarchive`);
              Toast.success('Chat unarchived.');
              loadArchivedChats();
            } catch (err) {
              Toast.error(err.message);
              FormHelpers.setLoading(btn, false);
            }
          });
        });
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

    async function exportChatData() {
      const btn = document.getElementById('export-chats-btn');
      FormHelpers.setLoading(btn, true);
      try {
        const { conversations } = await API.get('/messaging/conversations');
        const exportData = [];
        for (const c of conversations) {
          const { messages } = await API.get(`/messaging/conversations/${c.id}/messages`);
          exportData.push({ conversationId: c.id, messages });
        }
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jobrush-chat-export-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        Toast.success('Export downloaded.');
      } catch (err) {
        Toast.error(err.message);
      } finally {
        FormHelpers.setLoading(btn, false);
      }
    }

    // ============================================================
    // TAB: Data & Storage
    // ============================================================
    function storageRowHtml(label, entry) {
      return `
      <div class="ledger-row">
        <div>${label}</div>
        <div class="text-secondary text-sm">${formatBytes(entry.bytes)} · ${entry.count} file${entry.count === 1 ? '' : 's'}</div>
      </div>`;
    }

    TAB_LOADERS.storage = async function loadStorageTab(content) {
      content.innerHTML = `
      <div class="card" style="margin-bottom: var(--space-5);">
        <h3>Storage usage</h3>
        <div id="storage-usage-body"><div class="skeleton" style="height: 80px;"></div></div>
      </div>
      <div class="card">
        <h3>Free up space</h3>
        <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);">Clearing a chat removes its history from your view only — the other person's copy is unaffected.</p>
        <div style="display:flex; gap: var(--space-3); flex-wrap:wrap;">
          <a href="portfolio.html" class="btn btn-sm btn-secondary">Manage portfolio media</a>
          <button type="button" class="btn btn-sm btn-secondary" id="clear-chat-btn">Clear a chat's history</button>
        </div>
      </div>
    `;

      try {
        const { usage } = await API.get('/settings/storage-usage');
        document.getElementById('storage-usage-body').innerHTML = `
        <div class="text-lg" style="font-weight:700; margin-bottom: var(--space-4);">${formatBytes(usage.totalBytes)} total</div>
        ${storageRowHtml('Photos', usage.photos)}
        ${storageRowHtml('Videos', usage.videos)}
        ${storageRowHtml('Documents (portfolio & verification)', usage.documents)}
        ${storageRowHtml('Audio (voice notes)', usage.audio)}
      `;
      } catch (err) {
        document.getElementById('storage-usage-body').innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }

      document.getElementById('clear-chat-btn').addEventListener('click', openClearChatModal);
    };

    async function openClearChatModal() {
      let conversations = [];
      try {
        ({ conversations } = await API.get('/messaging/conversations'));
      } catch (err) {
        Toast.error(err.message);
        return;
      }
      if (conversations.length === 0) {
        Toast.error('You have no chats to clear.');
        return;
      }
      Modal.open({
        title: "Clear a chat's history",
        bodyHtml: `
        <div class="field">
          <label for="clear-chat-select">Choose a conversation</label>
          <select id="clear-chat-select">
            ${conversations.map((c) => `<option value="${c.id}">${esc((c.last_message_preview || 'Conversation').slice(0, 60))}</option>`).join('')}
          </select>
        </div>
        <p class="text-secondary text-sm">This only clears your own view of the conversation — it can't be undone, and the other participant's history is unaffected.</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-clear-chat-btn">Clear history</button>
        </div>`,
        onMount: () => {
          document.getElementById('confirm-clear-chat-btn').addEventListener('click', async () => {
            const id = document.getElementById('clear-chat-select').value;
            const btn = document.getElementById('confirm-clear-chat-btn');
            FormHelpers.setLoading(btn, true);
            try {
              await API.post(`/messaging/conversations/${id}/clear`);
              Modal.close();
              Toast.success('Chat history cleared.');
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(btn, false);
            }
          });
        },
      });
    }

    // ============================================================
    // TAB: Support
    // ============================================================
    const TICKET_STATUS_LABELS = {
      open: 'Open',
      in_progress: 'In Progress',
      awaiting_response: 'Awaiting Response',
      resolved: 'Resolved',
      closed: 'Closed',
    };

    function ticketRowHtml(t) {
      return `
      <div class="ledger-row" data-view-ticket="${t.id}" style="cursor:pointer;">
        <div>
          <div>${esc(t.subject)}</div>
          <div class="text-xs text-secondary">Opened ${new Date(t.created_at).toLocaleDateString()} · Updated ${new Date(t.updated_at).toLocaleDateString()}</div>
        </div>
        <span class="badge badge-neutral">${TICKET_STATUS_LABELS[t.status] || t.status}</span>
      </div>`;
    }

    function viewTicketModal(ticket) {
      Modal.open({
        title: ticket.subject,
        bodyHtml: `
        <p class="text-xs text-secondary" style="margin-bottom: var(--space-3);">
          Status: <strong style="color:var(--text-primary);">${TICKET_STATUS_LABELS[ticket.status] || ticket.status}</strong>
          · Category: ${esc(ticket.category || 'other')}
          · Opened ${new Date(ticket.created_at).toLocaleString()}
        </p>
        <p style="white-space:pre-wrap;">${esc(ticket.description)}</p>
        ${ticket.admin_response ? `
          <div class="card" style="margin-top: var(--space-4);">
            <div class="text-xs text-secondary" style="margin-bottom: var(--space-2);">Support team response</div>
            <p style="white-space:pre-wrap; margin-bottom:0;">${esc(ticket.admin_response)}</p>
          </div>` : ''}
      `,
      });
    }

    TAB_LOADERS.support = async function loadSupportTab(content) {
      content.innerHTML = `
      <div class="card" style="margin-bottom: var(--space-5);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-4);">
          <h3 style="margin-bottom:0;">Your support tickets</h3>
          <button type="button" class="btn btn-sm btn-primary" id="new-ticket-btn">New ticket</button>
        </div>
        <div id="tickets-body"><div class="skeleton" style="height: 16px; width: 70%;"></div></div>
      </div>
      <div class="card">
        <h3>Quick actions</h3>
        <div style="display:flex; gap: var(--space-3); flex-wrap:wrap;">
          <button type="button" class="btn btn-sm btn-secondary" id="report-suspicious-btn">Report suspicious activity</button>
          <button type="button" class="btn btn-sm btn-secondary" id="report-user-btn">Report another user</button>
        </div>
      </div>
    `;
      loadTickets();
      document.getElementById('new-ticket-btn').addEventListener('click', () => openTicketModal());
      document.getElementById('report-suspicious-btn').addEventListener('click', () => openTicketModal('suspicious_activity'));
      document.getElementById('report-user-btn').addEventListener('click', () => openTicketModal('report_user'));
    };

    async function loadTickets() {
      const body = document.getElementById('tickets-body');
      try {
        const { tickets } = await API.get('/support/tickets');
        body.innerHTML = tickets.length ? tickets.map(ticketRowHtml).join('') : '<p class="text-secondary text-sm">No support tickets yet.</p>';
        body.querySelectorAll('[data-view-ticket]').forEach((row) => {
          row.addEventListener('click', async () => {
            try {
              const { ticket } = await API.get(`/support/tickets/${row.dataset.viewTicket}`);
              viewTicketModal(ticket);
            } catch (err) {
              Toast.error(err.message);
            }
          });
        });
      } catch (err) {
        body.innerHTML = `<p class="text-secondary text-sm">${err.message}</p>`;
      }
    }

    const TICKET_CATEGORY_LABELS = {
      account: 'Account',
      payment: 'Payment',
      technical: 'Technical problem',
      suspicious_activity: 'Suspicious activity',
      report_user: 'Report a user',
      other: 'Other',
    };

    function openTicketModal(presetCategory) {
      const isReportUser = presetCategory === 'report_user';
      Modal.open({
        title: isReportUser ? 'Report another user' : 'Contact support',
        bodyHtml: `
        <div class="field" id="ticket-subject-field">
          <label for="ticket-subject">Subject</label>
          <input type="text" id="ticket-subject" />
          <div class="field-error" hidden></div>
        </div>
        <div class="field">
          <label for="ticket-category">Category</label>
          <select id="ticket-category" ${presetCategory ? 'disabled' : ''}>
            ${Object.entries(TICKET_CATEGORY_LABELS).map(([v, l]) => `<option value="${v}" ${v === (presetCategory || 'other') ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        ${isReportUser ? `
        <div class="field" id="reported-user-field">
          <label for="reported-user">Who are you reporting? (name or email)</label>
          <input type="text" id="reported-user" />
          <div class="field-error" hidden></div>
        </div>` : ''}
        <div class="field" id="ticket-description-field">
          <label for="ticket-description">${isReportUser ? 'What happened?' : 'Description'}</label>
          <textarea id="ticket-description" rows="5"></textarea>
          <div class="field-hint">Attachments aren't supported yet — describe the issue in as much detail as you can.</div>
          <div class="field-error" hidden></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="submit-ticket-btn">Submit</button>
        </div>`,
        onMount: () => {
          document.getElementById('submit-ticket-btn').addEventListener('click', async () => {
            const subject = document.getElementById('ticket-subject').value.trim();
            let description = document.getElementById('ticket-description').value.trim();
            const category = document.getElementById('ticket-category').value;
            if (subject.length < 3) return FormHelpers.showError(document.getElementById('ticket-subject-field'), 'Enter a subject.');
            if (isReportUser) {
              const reportedWho = document.getElementById('reported-user').value.trim();
              if (!reportedWho) return FormHelpers.showError(document.getElementById('reported-user-field'), 'Enter who you\'re reporting.');
              description = `Reported user: ${reportedWho}\n\n${description}`;
            }
            if (description.length < 10) return FormHelpers.showError(document.getElementById('ticket-description-field'), 'Please add a bit more detail (at least 10 characters).');

            const btn = document.getElementById('submit-ticket-btn');
            FormHelpers.setLoading(btn, true);
            try {
              await API.post('/support/tickets', { subject, description, category });
              Modal.close();
              Toast.success('Support ticket submitted.');
              loadTickets();
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(btn, false);
            }
          });
        },
      });
    }

    // ============================================================
    // TAB: Help & Feedback
    // ============================================================
    const FAQS = [
      { q: 'Getting started', a: 'Create a profile, choose whether you’re finding work or hiring, and complete your profile — verified, complete profiles get discovered faster.' },
      { q: 'Account help', a: 'Update your email, phone, or password from the Account & Security tab. Two-factor authentication adds an extra layer of protection to your login.' },
      { q: 'Profile help', a: 'Workers: add a professional title, bio, skills, and get verified for a trust badge. Hirers: add your display name and a short description of what you’re looking for.' },
      { q: 'Jobs & hiring', a: 'Workers browse and apply to open jobs from Find Work. Hirers post jobs from My Jobs and review applicants from the Applicants tab.' },
      { q: 'Chat help', a: 'Message another user once you have an open conversation. Your messaging permission (Account & Security) controls who can start a new conversation with you.' },
      { q: 'Calls help', a: 'Audio/video interviews are scheduled from the Interviews page and joined from a link on the interview’s detail view.' },
      { q: 'Payments help', a: 'Hirers fund a contract’s escrow after hiring; funds release to the worker’s wallet on completion. See the Wallet page for balance and withdrawals.' },
      { q: 'Privacy & security', a: 'Control who can see your profile and message you from Account & Security. Report suspicious activity or another user from the Support tab.' },
      { q: 'Location & map help', a: 'JOB RUSH currently covers Delta State — set your state/LGA/area on your profile so nearby hirers and workers can find each other.' },
    ];

    function faqItemHtml(item, index) {
      return `
      <div class="card" style="margin-bottom: var(--space-3);">
        <button type="button" class="faq-toggle" data-faq="${index}" style="all:unset; cursor:pointer; display:flex; justify-content:space-between; align-items:center; width:100%; font-weight:600;">
          <span>${item.q}</span>
          <span aria-hidden="true">+</span>
        </button>
        <div class="text-secondary text-sm" id="faq-answer-${index}" hidden style="margin-top: var(--space-3);">${item.a}</div>
      </div>`;
    }

    TAB_LOADERS.help = async function loadHelpTab(content) {
      content.innerHTML = `
      <div class="card" style="margin-bottom: var(--space-5);">
        <h3>Frequently asked questions</h3>
        <div style="margin-top: var(--space-4);">${FAQS.map(faqItemHtml).join('')}</div>
      </div>
      <div class="card">
        <h3>Send feedback</h3>
        <p class="text-secondary text-sm" style="margin-bottom: var(--space-4);">Feature requests, bugs, complaints, or anything else — we read all of it.</p>
        <div class="field">
          <label for="feedback-type">Type</label>
          <select id="feedback-type">
            <option value="feature_request">Feature request</option>
            <option value="bug_report">Bug report</option>
            <option value="complaint">Complaint</option>
            <option value="general">General feedback</option>
          </select>
        </div>
        <div class="field" id="feedback-message-field">
          <label for="feedback-message">Message</label>
          <textarea id="feedback-message" rows="4"></textarea>
          <div class="field-error" hidden></div>
        </div>
        <button type="button" class="btn btn-sm btn-primary" id="submit-feedback-btn">Send feedback</button>
      </div>
    `;

      content.querySelectorAll('[data-faq]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const answer = document.getElementById(`faq-answer-${btn.dataset.faq}`);
          answer.hidden = !answer.hidden;
        });
      });

      document.getElementById('submit-feedback-btn').addEventListener('click', async () => {
        const message = document.getElementById('feedback-message').value.trim();
        if (message.length < 5) return FormHelpers.showError(document.getElementById('feedback-message-field'), 'Tell us a bit more.');
        const btn = document.getElementById('submit-feedback-btn');
        FormHelpers.setLoading(btn, true);
        try {
          await API.post('/feedback', { type: document.getElementById('feedback-type').value, message });
          document.getElementById('feedback-message').value = '';
          Toast.success('Thanks — feedback sent.');
        } catch (err) {
          FormHelpers.showError(document.getElementById('feedback-message-field'), err.message);
        } finally {
          FormHelpers.setLoading(btn, false);
        }
      });
    };

    // ============================================================
    // TAB: Accessibility
    // ============================================================
    TAB_LOADERS.accessibility = async function loadAccessibilityTab(content) {
      const settings = await ensureSettingsLoaded();
      content.innerHTML = `
      <div class="card">
        <h3>Display & motion</h3>
        ${settingsRowHtml('Text size', 'Scales text across the entire app.', `
          <select id="text-size-select">
            <option value="small" ${settings.text_size === 'small' ? 'selected' : ''}>Small</option>
            <option value="default" ${settings.text_size === 'default' ? 'selected' : ''}>Default</option>
            <option value="large" ${settings.text_size === 'large' ? 'selected' : ''}>Large</option>
            <option value="extra_large" ${settings.text_size === 'extra_large' ? 'selected' : ''}>Extra large</option>
          </select>`)}
        ${settingsRowHtml('High contrast', 'Increases contrast between text, borders, and backgrounds.', toggleHtml('high-contrast-toggle', settings.high_contrast))}
        ${settingsRowHtml('Reduced motion', 'Turns off animations and transitions throughout the app.', toggleHtml('reduced-motion-toggle', settings.reduced_motion))}
      </div>
      <div class="card" style="margin-top: var(--space-5);">
        <h3>Built for accessibility</h3>
        <ul class="text-secondary text-sm" style="margin: 0; padding-left: 20px;">
          <li>Every interactive control has a visible keyboard focus outline.</li>
          <li>Forms report errors as text next to the field, not by color alone.</li>
          <li>Touch targets (buttons, links, form controls) meet a minimum comfortable tap size.</li>
          <li>All images used for decoration are hidden from screen readers; meaningful images have alt text.</li>
        </ul>
      </div>
    `;

      document.getElementById('text-size-select').addEventListener('change', async (e) => {
        Accessibility.apply({ textSize: e.target.value, highContrast: currentSettings.high_contrast, reducedMotion: currentSettings.reduced_motion });
        const settings = await patchSettings({ textSize: e.target.value }, 'Text size updated.');
        Accessibility.writeCache({ textSize: settings.text_size, highContrast: settings.high_contrast, reducedMotion: settings.reduced_motion });
      });
      document.getElementById('high-contrast-toggle').addEventListener('change', async (e) => {
        Accessibility.apply({ textSize: currentSettings.text_size, highContrast: e.target.checked, reducedMotion: currentSettings.reduced_motion });
        const settings = await patchSettings({ highContrast: e.target.checked }, 'High contrast updated.');
        Accessibility.writeCache({ textSize: settings.text_size, highContrast: settings.high_contrast, reducedMotion: settings.reduced_motion });
      });
      document.getElementById('reduced-motion-toggle').addEventListener('change', async (e) => {
        Accessibility.apply({ textSize: currentSettings.text_size, highContrast: currentSettings.high_contrast, reducedMotion: e.target.checked });
        const settings = await patchSettings({ reducedMotion: e.target.checked }, 'Reduced motion updated.');
        Accessibility.writeCache({ textSize: settings.text_size, highContrast: settings.high_contrast, reducedMotion: settings.reduced_motion });
      });
    };

    // ============================================================
    // Init
    // ============================================================
    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      currentUser = user;

      NotificationBell.render(document.getElementById('notif-bell-mount'));
      IncomingCallWatcher.start();
      SidebarNav.render(user, 'settings');
      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      const params = new URLSearchParams(window.location.search);
      const initialTab = TABS.some((t) => t.key === params.get('tab')) ? params.get('tab') : 'profile';
      renderTabsNav(initialTab);
      loadTab(initialTab);
    })();
  </script>
</body>

</html>
