<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — JOB RUSH</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual" aria-hidden="true">
    <img src="../assets/images/logo-256.png" alt="" width="140" height="140" style="margin-bottom: 32px;" />
    <h2 style="max-width: 12ch;">We'll get you back in.</h2>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>

      <div id="request-step">
        <h1 style="font-size: var(--text-2xl);">Reset your password</h1>
        <p class="text-secondary" style="margin-bottom: var(--space-6);">Enter the email on your account and we'll send a reset link.</p>

        <form id="forgot-form" novalidate>
          <div class="field" id="email-field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <div class="field-error" hidden></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="forgot-submit">Send reset link</button>
        </form>
      </div>

      <div id="confirm-step" hidden>
        <h1 style="font-size: var(--text-2xl);">Choose a new password</h1>
        <p class="text-secondary" style="margin-bottom: var(--space-6);">Enter a new password for your JOB RUSH account.</p>

        <form id="reset-form" novalidate>
          <div class="field" id="new-password-field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" autocomplete="new-password" required />
            <div class="field-hint">At least 8 characters, with a letter and a number.</div>
            <div class="field-error" hidden></div>
          </div>
          <div class="field" id="confirm-password-field">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" required />
            <div class="field-error" hidden></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset password</button>
        </form>
      </div>

      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>
</div>

<script src="../js/config/assets.js"></script>
<script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/formHelpers.js"></script>
<script src="../js/modules/auth.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');

  if (token) {
    document.getElementById('request-step').hidden = true;
    document.getElementById('confirm-step').hidden = false;

    const resetForm = document.getElementById('reset-form');
    const resetSubmitBtn = document.getElementById('reset-submit');

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      FormHelpers.clearErrors(resetForm);
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 8) {
        return FormHelpers.showError(document.getElementById('new-password-field'), 'Password must be at least 8 characters.');
      }
      if (newPassword !== confirmPassword) {
        return FormHelpers.showError(document.getElementById('confirm-password-field'), 'Passwords do not match.');
      }

      FormHelpers.setLoading(resetSubmitBtn, true);
      try {
        await Auth.resetPassword(token, newPassword);
        Toast.success('Password updated. Please sign in with your new password.');
        window.location.href = 'login.html';
      } catch (err) {
        FormHelpers.showError(document.getElementById('new-password-field'), err.message);
      } finally {
        FormHelpers.setLoading(resetSubmitBtn, false);
      }
    });
  } else {
    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('forgot-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      FormHelpers.clearErrors(form);
      const email = form.email.value.trim();
      if (!email) return FormHelpers.showError(document.getElementById('email-field'), 'Enter your email address.');

      FormHelpers.setLoading(submitBtn, true);
      try {
        await Auth.requestPasswordReset(email);
        Toast.success('If an account exists for that email, a reset link has been sent.');
        form.reset();
      } catch (err) {
        Toast.error(err.message);
      } finally {
        FormHelpers.setLoading(submitBtn, false);
      }
    });
  }
</script>
</body>
</html>
