<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/dashboard-pages.css" />
  <link rel="stylesheet" href="../css/worker-profile.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard"></nav>
      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">Log out</button>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <div>
          <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-1);">My Portfolio</h1>
          <p class="text-secondary text-sm">Showcase your best work to hirers browsing your profile.</p>
        </div>
        <div style="display:flex; align-items:center; gap: var(--space-3);">
          <div id="notif-bell-mount"></div>
          <button class="btn btn-primary" id="add-project-btn">Add project</button>
        </div>
      </div>

      <div id="portfolio-grid" class="portfolio-grid" aria-live="polite">
        <div class="skeleton" style="height:220px;"></div>
        <div class="skeleton" style="height:220px;"></div>
        <div class="skeleton" style="height:220px;"></div>
      </div>
    </div>
  </div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/upload.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/modules/videoPlayer.js"></script>
  <script src="../js/utils/moreMenu.js"></script>
  <script>
    function mediaTileHtml(m, i, total) {
      const thumb = m.media_type === 'video'
        ? `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:${m.thumbnailUrl ? `url('${m.thumbnailUrl}') center/cover` : 'var(--color-black)'}; color:var(--text-secondary);">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="white" style="filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));"><path d="M8 5v14l11-7z"/></svg>
           </div>`
        : `<img src="${m.thumbnailUrl || m.url}" alt="" loading="lazy" width="84" height="84" style="width:100%; height:100%; object-fit:cover;" />`;
      const duration = m.duration_seconds ? `<span class="duration-badge" style="position:absolute; bottom:2px; right:2px; font-size:10px;">${VideoPlayer.formatTime(m.duration_seconds)}</span>` : '';
      return `
      <div class="media-tile card-img-zoom card-img-zoom-frame" data-media-id="${m.id}" style="position:relative; width:84px; height:84px; border-radius: var(--radius-sm); overflow:hidden; border: 2px solid ${m.is_primary ? 'var(--accent)' : 'transparent'}; cursor:pointer;">
        ${thumb}
        ${duration}
        ${m.is_primary ? '<span style="position:absolute; top:2px; left:2px; font-size:10px; background:var(--accent); color:var(--text-on-gold); padding:0 4px; border-radius:2px;">Primary</span>' : ''}
        <div style="position:absolute; top:2px; right:2px; display:flex; gap:2px;">
          <button type="button" class="btn btn-sm btn-ghost" data-action="delete-media" title="Delete" style="padding:2px 4px; background:rgba(0,0,0,0.6);">✕</button>
        </div>
        <div style="position:absolute; bottom:2px; left:2px; display:flex; gap:2px;">
          <button type="button" class="btn btn-sm btn-ghost" data-action="move-left" ${i === 0 ? 'disabled' : ''} title="Move earlier" style="padding:2px 4px; background:rgba(0,0,0,0.6);">←</button>
          <button type="button" class="btn btn-sm btn-ghost" data-action="move-right" ${i === total - 1 ? 'disabled' : ''} title="Move later" style="padding:2px 4px; background:rgba(0,0,0,0.6);">→</button>
          ${!m.is_primary ? `<button type="button" class="btn btn-sm btn-ghost" data-action="set-primary" title="Set as primary" style="padding:2px 4px; background:rgba(0,0,0,0.6);">★</button>` : ''}
        </div>
      </div>`;
    }

    function projectCardHtml(p) {
      const media = p.media || [];
      const mediaCount = media.length;
      return `
      <div class="card portfolio-card" data-project-id="${p.id}" style="padding: var(--space-5);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap: var(--space-3);">
          <div style="min-width:0;">
            <h3 style="margin-bottom: var(--space-2); font-size: var(--text-lg);">${esc(p.title)}</h3>
            <div style="display:flex; gap: var(--space-2); flex-wrap:wrap;">
              ${p.is_featured ? '<span class="badge badge-pro">Featured</span>' : ''}
              ${p.category_name ? `<span class="badge badge-neutral">${esc(p.category_name)}</span>` : ''}
            </div>
          </div>
          <div class="more-menu-mount" data-action="more-menu"></div>
        </div>
        <p class="text-secondary text-sm portfolio-desc" style="margin-top: var(--space-3);">${esc((p.description || 'No description yet.').slice(0, 140))}</p>
        <div class="media-strip" style="display:flex; gap: var(--space-2); flex-wrap:wrap; margin: var(--space-4) 0;">
          ${media.map((m, i) => mediaTileHtml(m, i, media.length)).join('')}
          ${mediaCount === 0 ? `<div class="text-xs text-secondary">No media yet.</div>` : ''}
        </div>
        <div class="portfolio-actions" style="gap: var(--space-3);">
          <a class="btn btn-secondary" style="flex:1;" href="portfolio-detail.html?id=${p.id}">View project</a>
          <button type="button" class="icon-btn" data-action="add-media" title="Add photo/video" aria-label="Add photo/video">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>
        </div>
      </div>
    `;
    }

    let cachedCategories = null;
    async function loadCategories() {
      if (cachedCategories) return cachedCategories;
      try {
        const { categories } = await API.get('/catalog/categories');
        cachedCategories = categories;
      } catch {
        cachedCategories = [];
      }
      return cachedCategories;
    }

    function projectFormHtml(project, categories) {
      return `
      <form id="project-form" novalidate>
        <div class="field" id="title-field">
          <label for="title">Project title</label>
          <input type="text" id="title" name="title" value="${esc(project?.title || '')}" required />
          <div class="field-error" hidden></div>
        </div>
        <div class="field" id="description-field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4">${esc(project?.description || '')}</textarea>
          <div class="field-error" hidden></div>
        </div>
        <div class="field" id="category-field">
          <label for="categoryId">Category</label>
          <select id="categoryId" name="categoryId">
            <option value="">No category</option>
            ${categories.map((c) => `<option value="${c.id}" ${project?.category_id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="projectType-field">
          <label for="projectType">Project type</label>
          <input type="text" id="projectType" name="projectType" value="${esc(project?.project_type || '')}" placeholder="e.g. Residential wiring" />
        </div>
        <div class="field" id="externalLink-field">
          <label for="externalLink">External link (optional)</label>
          <input type="url" id="externalLink" name="externalLink" value="${esc(project?.external_link || '')}" placeholder="https://" />
          <div class="field-hint">Must start with http:// or https://</div>
          <div class="field-error" hidden></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="project-submit">${project ? 'Save changes' : 'Add project'}</button>
        </div>
      </form>
    `;
    }

    async function openProjectModal(project, onSaved) {
      const categories = await loadCategories();
      Modal.open({
        title: project ? 'Edit project' : 'Add a portfolio project',
        bodyHtml: projectFormHtml(project, categories),
        onMount: () => {
          const form = document.getElementById('project-form');
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            FormHelpers.clearErrors(form);
            const title = form.title.value.trim();
            if (title.length < 2) return FormHelpers.showError(document.getElementById('title-field'), 'Enter a project title.');

            const externalLink = form.externalLink.value.trim();
            if (externalLink && !/^https?:\/\//i.test(externalLink)) {
              return FormHelpers.showError(document.getElementById('externalLink-field'), 'Link must start with http:// or https://');
            }

            const payload = {
              title,
              description: form.description.value.trim() || undefined,
              categoryId: form.categoryId.value || undefined,
              projectType: form.projectType.value.trim() || undefined,
              externalLink: externalLink || undefined,
            };

            const submitBtn = document.getElementById('project-submit');
            FormHelpers.setLoading(submitBtn, true);
            try {
              if (project) {
                await API.patch(`/portfolio/${project.id}`, payload);
                Toast.success('Project updated.');
              } else {
                await API.post('/portfolio', payload);
                Toast.success('Project added.');
              }
              Modal.close();
              onSaved();
            } catch (err) {
              if (err.details) FormHelpers.applyApiValidationErrors(form, err.details);
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(submitBtn, false);
            }
          });
        },
      });
    }

    async function loadPortfolio() {
      const grid = document.getElementById('portfolio-grid');
      try {
        const { portfolios } = await API.get('/portfolio/me');
        if (portfolios.length === 0) {
          grid.innerHTML = `
          <div class="empty-state fade-in" style="grid-column: 1 / -1;">
            <img src="${ASSETS.emptyState}" alt="" />
            <h3>No projects yet</h3>
            <p>Add your first project so hirers can see your work.</p>
          </div>`;
          return;
        }
        grid.innerHTML = portfolios.map(projectCardHtml).join('');
        Animate.stagger(grid, { stepMs: 40 });
        wireCardActions(portfolios);
      } catch (err) {
        grid.innerHTML = `<p class="text-secondary">${err.message}</p>`;
      }
    }

    function confirmDeleteProject(id, project) {
      Modal.open({
        title: 'Delete this project?',
        bodyHtml: `
          <p class="text-secondary">This removes "${esc(project.title)}" and its media from your portfolio. This can't be undone.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-delete">Delete project</button>
          </div>
        `,
        onMount: () => {
          document.getElementById('confirm-delete').addEventListener('click', async () => {
            try {
              await API.delete(`/portfolio/${id}`);
              Toast.success('Project deleted.');
              Modal.close();
              loadPortfolio();
            } catch (err) {
              Toast.error(err.message);
            }
          });
        },
      });
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 KB';
      const units = ['bytes', 'KB', 'MB', 'GB'];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    /**
     * Video upload gets its own modal-driven flow instead of the
     * simple icon-button spinner images use — server-side compression
     * means a real, possibly multi-stage wait (upload, then transcode)
     * that deserves an actual status readout, a preview before
     * committing, and a way to retry without re-picking the file.
     * Maximum final video size is always shown up front (spec:
     * "clearly display maximum final video size").
     */
    function openVideoUploadModal(file, projectId, project) {
      const objectUrl = URL.createObjectURL(file);
      let xhrRef = null;
      let cancelled = false;

      const bodyHtml = `
        <p class="text-secondary text-sm">${esc(file.name)} — ${formatBytes(file.size)}</p>
        <p class="text-secondary text-xs" style="margin-bottom: var(--space-3);">Maximum final video size: 50MB. Longer or larger videos are automatically optimized to fit.</p>
        <video id="video-preview" src="${objectUrl}" controls style="width:100%; max-height:280px; border-radius: var(--radius-md); background:#000; display:block;"></video>
        <div id="video-upload-status" class="text-secondary text-sm" style="margin-top: var(--space-3);">Ready to upload.</div>
        <div class="upload-progress-track" id="video-upload-track" hidden>
          <div class="upload-progress-bar" id="video-upload-bar" style="width:0%;"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="video-modal-secondary-btn">Cancel</button>
          <button type="button" class="btn btn-primary" id="video-modal-primary-btn">Upload video</button>
        </div>
      `;

      Modal.open({
        title: 'Add work video',
        bodyHtml,
        onClose: () => URL.revokeObjectURL(objectUrl),
        onMount: () => {
          const statusEl = document.getElementById('video-upload-status');
          const track = document.getElementById('video-upload-track');
          const bar = document.getElementById('video-upload-bar');
          const primaryBtn = document.getElementById('video-modal-primary-btn');
          const secondaryBtn = document.getElementById('video-modal-secondary-btn');

          function setDeterminateProgress(percent) {
            track.hidden = false;
            bar.classList.remove('is-indeterminate');
            bar.style.width = `${percent}%`;
          }
          function setIndeterminateProgress() {
            track.hidden = false;
            bar.classList.add('is-indeterminate');
          }

          async function startUpload() {
            cancelled = false;
            primaryBtn.hidden = true;
            secondaryBtn.textContent = 'Cancel upload';
            secondaryBtn.disabled = false;
            statusEl.textContent = 'Preparing your video…';
            setIndeterminateProgress();

            try {
              const uploaded = await Upload.uploadPortfolioMedia(file, (percent) => {
                statusEl.textContent = `Uploading… ${percent}%`;
                setDeterminateProgress(percent);
              }, {
                onXhrReady: (xhr) => { xhrRef = xhr; },
                onUploadComplete: () => {
                  // Every byte has arrived — from here the server is
                  // transcoding, which has no meaningful percentage to
                  // show, and can no longer be cancelled from here.
                  statusEl.textContent = 'Optimizing your video… this can take a moment.';
                  setIndeterminateProgress();
                  secondaryBtn.disabled = true;
                },
              });

              statusEl.textContent = 'Saving to your portfolio…';
              await API.post(`/portfolio/${projectId}/media`, {
                mediaType: 'video',
                storagePath: uploaded.storagePath,
                thumbnailStoragePath: uploaded.thumbnailStoragePath || undefined,
                isPrimary: (project.media || []).length === 0,
                fileSize: uploaded.sizeBytes || undefined,
                durationSeconds: uploaded.durationSeconds || undefined,
                width: uploaded.width || undefined,
                height: uploaded.height || undefined,
              });

              setDeterminateProgress(100);
              statusEl.textContent = uploaded.wasProcessed
                ? `Video uploaded successfully — optimized to ${formatBytes(uploaded.sizeBytes)}.`
                : `Video uploaded successfully — ${formatBytes(uploaded.sizeBytes)}.`;
              Toast.success('Video added.');
              secondaryBtn.textContent = 'Done';
              secondaryBtn.disabled = false;
              secondaryBtn.onclick = () => { Modal.close(); loadPortfolio(); };
              primaryBtn.hidden = true;
            } catch (err) {
              if (cancelled) {
                statusEl.textContent = 'Upload cancelled.';
              } else {
                statusEl.textContent = err.message;
              }
              track.hidden = true;
              primaryBtn.hidden = false;
              primaryBtn.textContent = 'Retry';
              secondaryBtn.textContent = 'Choose different file';
              secondaryBtn.disabled = false;
              secondaryBtn.onclick = async () => {
                const newFile = await Upload.pickFile({
                  accept: 'image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,.mov',
                });
                if (!newFile) return;
                Modal.close();
                openVideoUploadModal(newFile, projectId, project);
              };
            }
          }

          primaryBtn.addEventListener('click', startUpload);
          secondaryBtn.addEventListener('click', () => {
            if (xhrRef && secondaryBtn.textContent === 'Cancel upload') {
              cancelled = true;
              xhrRef.abort();
              return;
            }
            Modal.close();
          });
        },
      });
    }

    function wireCardActions(portfolios) {
      document.querySelectorAll('.portfolio-card').forEach((card) => {
        const id = card.dataset.projectId;
        const project = portfolios.find((p) => p.id === id);

        MoreMenu.attach(card.querySelector('[data-action="more-menu"]'), {
          items: [
            { label: 'Edit project', onClick: () => openProjectModal(project, loadPortfolio) },
            { label: 'Delete project', danger: true, onClick: () => confirmDeleteProject(id, project) },
          ],
        });

        const addMediaBtn = card.querySelector('[data-action="add-media"]');
        addMediaBtn.addEventListener('click', async () => {
          const file = await Upload.pickFile({
            accept: 'image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,.mov',
          });
          if (!file) return;
          const isVideo = file.type.startsWith('video/');

          if (isVideo) {
            openVideoUploadModal(file, id, project);
            return;
          }

          FormHelpers.setLoading(addMediaBtn, true);
          try {
            const uploaded = await Upload.uploadPortfolioMedia(file);
            await API.post(`/portfolio/${id}/media`, {
              mediaType: 'image',
              storagePath: uploaded.storagePath,
              thumbnailStoragePath: uploaded.thumbnailStoragePath || undefined,
              isPrimary: (project.media || []).length === 0,
            });
            Toast.success('Media added.');
            loadPortfolio();
          } catch (err) {
            Toast.error(err.message);
          } finally {
            FormHelpers.setLoading(addMediaBtn, false);
          }
        });

        card.querySelectorAll('[data-action="delete-media"]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const mediaId = btn.closest('.media-tile').dataset.mediaId;
            try {
              await API.delete(`/portfolio/${id}/media/${mediaId}`);
              Toast.success('Media removed.');
              loadPortfolio();
            } catch (err) {
              Toast.error(err.message);
            }
          });
        });

        card.querySelectorAll('[data-action="set-primary"]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const mediaId = btn.closest('.media-tile').dataset.mediaId;
            try {
              await API.patch(`/portfolio/${id}/media/${mediaId}/primary`);
              loadPortfolio();
            } catch (err) {
              Toast.error(err.message);
            }
          });
        });

        card.querySelectorAll('[data-action="move-left"], [data-action="move-right"]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (btn.disabled) return;
            const mediaIds = (project.media || []).map((m) => m.id);
            const tile = btn.closest('.media-tile');
            const currentIndex = mediaIds.indexOf(tile.dataset.mediaId);
            const swapWith = btn.dataset.action === 'move-left' ? currentIndex - 1 : currentIndex + 1;
            [mediaIds[currentIndex], mediaIds[swapWith]] = [mediaIds[swapWith], mediaIds[currentIndex]];
            try {
              await API.patch(`/portfolio/${id}/media/reorder`, { mediaIds });
              loadPortfolio();
            } catch (err) {
              Toast.error(err.message);
            }
          });
        });

        card.querySelectorAll('.media-tile').forEach((tile) => {
          tile.addEventListener('click', () => {
            const m = (project.media || []).find((x) => x.id === tile.dataset.mediaId);
            if (!m || m.media_type !== 'video') return;
            Modal.open({
              title: 'Preview',
              bodyHtml: `<div id="portfolio-video-mount"></div>`,
              onMount: () => VideoPlayer.mount(document.getElementById('portfolio-video-mount'), { url: m.url }),
            });
          });
        });

      });
    }

    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      NotificationBell.render(document.getElementById('notif-bell-mount'));
      if (user.role === 'hirer') {
        window.location.href = 'dashboard.html';
        return;
      }

      SidebarNav.render(user, 'portfolio');

      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      document.getElementById('add-project-btn').addEventListener('click', () => {
        openProjectModal(null, loadPortfolio);
      });

      loadPortfolio();
    })();
  </script>
</body>

</html>
