<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/dashboard-pages.css" />
  <link rel="stylesheet" href="../css/worker-profile.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard"></nav>
      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">Log out</button>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <div>
          <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-1);">My Portfolio</h1>
          <p class="text-secondary text-sm">Showcase your best work to hirers browsing your profile.</p>
        </div>
        <div style="display:flex; align-items:center; gap: var(--space-3);">
          <div id="notif-bell-mount"></div>
          <button class="btn btn-primary" id="add-project-btn">Add project</button>
        </div>
      </div>

      <div id="portfolio-grid" class="portfolio-grid" aria-live="polite">
        <div class="skeleton" style="height:220px;"></div>
        <div class="skeleton" style="height:220px;"></div>
        <div class="skeleton" style="height:220px;"></div>
      </div>
    </div>
  </div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/upload.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/modules/videoPlayer.js"></script>
  <script>
    function mediaTileHtml(m, i, total) {
      const thumb = m.media_type === 'video'
        ? `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--color-black); color:var(--text-secondary);">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
           </div>`
        : `<img src="${m.url}" alt="" style="width:100%; height:100%; object-fit:cover;" />`;
      const duration = m.duration_seconds ? `<span class="duration-badge" style="position:absolute; bottom:2px; right:2px; font-size:10px;">${VideoPlayer.formatTime(m.duration_seconds)}</span>` : '';
      return `
      <div class="media-tile card-img-zoom card-img-zoom-frame" data-media-id="${m.id}" style="position:relative; width:84px; height:84px; border-radius: var(--radius-sm); overflow:hidden; border: 2px solid ${m.is_primary ? 'var(--accent)' : 'transparent'}; cursor:pointer;">
        ${thumb}
        ${duration}
        ${m.is_primary ? '<span style="position:absolute; top:2px; left:2px; font-size:10px; background:var(--accent); color:var(--text-on-gold); padding:0 4px; border-radius:2px;">Primary</span>' : ''}
        <div style="position:absolute; top:2px; right:2px; display:flex; gap:2px;">
          <button type="button" class="btn btn-sm btn-ghost" data-action="delete-media" title="Delete" style="padding:2px 4px; background:rgba(0,0,0,0.6);">✕</button>
        </div>
        <div style="position:absolute; bottom:2px; left:2px; display:flex; gap:2px;">
          <button type="button" class="btn btn-sm btn-ghost" data-action="move-left" ${i === 0 ? 'disabled' : ''} title="Move earlier" style="padding:2px 4px; background:rgba(0,0,0,0.6);">←</button>
          <button type="button" class="btn btn-sm btn-ghost" data-action="move-right" ${i === total - 1 ? 'disabled' : ''} title="Move later" style="padding:2px 4px; background:rgba(0,0,0,0.6);">→</button>
          ${!m.is_primary ? `<button type="button" class="btn btn-sm btn-ghost" data-action="set-primary" title="Set as primary" style="padding:2px 4px; background:rgba(0,0,0,0.6);">★</button>` : ''}
        </div>
      </div>`;
    }

    function projectCardHtml(p) {
      const media = p.media || [];
      const mediaCount = media.length;
      return `
      <div class="card portfolio-card" data-project-id="${p.id}" style="padding: var(--space-4);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <h4 style="margin-bottom: var(--space-1);">${esc(p.title)}</h4>
          ${p.is_featured ? '<span class="badge badge-pro">Featured</span>' : ''}
        </div>
        <p class="text-secondary text-sm portfolio-desc">${esc((p.description || 'No description yet.').slice(0, 100))}</p>
        <div class="media-strip" style="display:flex; gap: var(--space-2); flex-wrap:wrap; margin: var(--space-3) 0;">
          ${media.map((m, i) => mediaTileHtml(m, i, media.length)).join('')}
          ${mediaCount === 0 ? `<div class="text-xs text-secondary">No media yet.</div>` : ''}
        </div>
        <div class="portfolio-actions">
          <button class="btn btn-sm btn-secondary" data-action="add-media">Add photo/video</button>
          <button class="btn btn-sm btn-secondary" data-action="edit">Edit</button>
          <button class="btn btn-sm btn-danger" data-action="delete">Delete</button>
        </div>
      </div>
    `;
    }

    function projectFormHtml(project) {
      return `
      <form id="project-form" novalidate>
        <div class="field" id="title-field">
          <label for="title">Project title</label>
          <input type="text" id="title" name="title" value="${esc(project?.title || '')}" required />
          <div class="field-error" hidden></div>
        </div>
        <div class="field" id="description-field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4">${esc(project?.description || '')}</textarea>
          <div class="field-error" hidden></div>
        </div>
        <div class="field" id="projectType-field">
          <label for="projectType">Project type</label>
          <input type="text" id="projectType" name="projectType" value="${esc(project?.project_type || '')}" placeholder="e.g. Residential wiring" />
        </div>
        <div class="field" id="externalLink-field">
          <label for="externalLink">External link (optional)</label>
          <input type="url" id="externalLink" name="externalLink" value="${esc(project?.external_link || '')}" placeholder="https://" />
          <div class="field-error" hidden></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="project-submit">${project ? 'Save changes' : 'Add project'}</button>
        </div>
      </form>
    `;
    }

    function openProjectModal(project, onSaved) {
      Modal.open({
        title: project ? 'Edit project' : 'Add a portfolio project',
        bodyHtml: projectFormHtml(project),
        onMount: () => {
          const form = document.getElementById('project-form');
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            FormHelpers.clearErrors(form);
            const title = form.title.value.trim();
            if (title.length < 2) return FormHelpers.showError(document.getElementById('title-field'), 'Enter a project title.');

            const payload = {
              title,
              description: form.description.value.trim() || undefined,
              projectType: form.projectType.value.trim() || undefined,
              externalLink: form.externalLink.value.trim() || undefined,
            };

            const submitBtn = document.getElementById('project-submit');
            FormHelpers.setLoading(submitBtn, true);
            try {
              if (project) {
                await API.patch(`/portfolio/${project.id}`, payload);
                Toast.success('Project updated.');
              } else {
                await API.post('/portfolio', payload);
                Toast.success('Project added.');
              }
              Modal.close();
              onSaved();
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(submitBtn, false);
            }
          });
        },
      });
    }

    async function loadPortfolio() {
      const grid = document.getElementById('portfolio-grid');
      try {
        const { portfolios } = await API.get('/portfolio/me');
        if (portfolios.length === 0) {
          grid.innerHTML = `
          <div class="empty-state fade-in" style="grid-column: 1 / -1;">
            <img src="${ASSETS.emptyState}" alt="" />
            <h3>No projects yet</h3>
            <p>Add your first project so hirers can see your work.</p>
          </div>`;
          return;
        }
        grid.innerHTML = portfolios.map(projectCardHtml).join('');
        Animate.stagger(grid, { stepMs: 40 });
        wireCardActions(portfolios);
      } catch (err) {
        grid.innerHTML = `<p class="text-secondary">${err.message}</p>`;
      }
    }

    function wireCardActions(portfolios) {
      document.querySelectorAll('.portfolio-card').forEach((card) => {
        const id = card.dataset.projectId;
        const project = portfolios.find((p) => p.id === id);

        card.querySelector('[data-action="edit"]').addEventListener('click', () => {
          openProjectModal(project, loadPortfolio);
        });

        const addMediaBtn = card.querySelector('[data-action="add-media"]');
        addMediaBtn.addEventListener('click', async () => {
          const file = await Upload.pickFile({ accept: 'image/jpeg,image/png,image/webp,image/gif,video/mp4' });
          if (!file) return;
          const isVideo = file.type.startsWith('video/');
          if (isVideo) {
            Toast.show('Uploading video—work videos must be 2 minutes or shorter.', { duration: 2500 });
          }
          const originalLabel = addMediaBtn.textContent;
          addMediaBtn.disabled = true;
          try {
            const uploaded = await Upload.uploadPortfolioMedia(file, (percent) => {
              addMediaBtn.textContent = `Uploading… ${percent}%`;
            });
            addMediaBtn.textContent = 'Processing…';
            await API.post(`/portfolio/${id}/media`, {
              mediaType: isVideo ? 'video' : 'image',
              storagePath: uploaded.storagePath,
              isPrimary: (project.media || []).length === 0,
              durationSeconds: uploaded.durationSeconds || undefined,
              width: uploaded.width || undefined,
              height: uploaded.height || undefined,
            });
            Toast.success('Media added.');
            loadPortfolio();
          } catch (err) {
            Toast.error(err.message);
            addMediaBtn.textContent = originalLabel;
            addMediaBtn.disabled = false;
          }
        });

        card.querySelectorAll('[data-action="delete-media"]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const mediaId = btn.closest('.media-tile').dataset.mediaId;
            try {
              await API.delete(`/portfolio/${id}/media/${mediaId}`);
              Toast.success('Media removed.');
              loadPortfolio();
            } catch (err) {
              Toast.error(err.message);
            }
          });
        });

        card.querySelectorAll('[data-action="set-primary"]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const mediaId = btn.closest('.media-tile').dataset.mediaId;
            try {
              await API.patch(`/portfolio/${id}/media/${mediaId}/primary`);
              loadPortfolio();
            } catch (err) {
              Toast.error(err.message);
            }
          });
        });

        card.querySelectorAll('[data-action="move-left"], [data-action="move-right"]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (btn.disabled) return;
            const mediaIds = (project.media || []).map((m) => m.id);
            const tile = btn.closest('.media-tile');
            const currentIndex = mediaIds.indexOf(tile.dataset.mediaId);
            const swapWith = btn.dataset.action === 'move-left' ? currentIndex - 1 : currentIndex + 1;
            [mediaIds[currentIndex], mediaIds[swapWith]] = [mediaIds[swapWith], mediaIds[currentIndex]];
            try {
              await API.patch(`/portfolio/${id}/media/reorder`, { mediaIds });
              loadPortfolio();
            } catch (err) {
              Toast.error(err.message);
            }
          });
        });

        card.querySelectorAll('.media-tile').forEach((tile) => {
          tile.addEventListener('click', () => {
            const m = (project.media || []).find((x) => x.id === tile.dataset.mediaId);
            if (!m || m.media_type !== 'video') return;
            Modal.open({
              title: 'Preview',
              bodyHtml: `<div id="portfolio-video-mount"></div>`,
              onMount: () => VideoPlayer.mount(document.getElementById('portfolio-video-mount'), { url: m.url }),
            });
          });
        });

        card.querySelector('[data-action="delete"]').addEventListener('click', () => {
          Modal.open({
            title: 'Delete this project?',
            bodyHtml: `
            <p class="text-secondary">This removes "${esc(project.title)}" and its media from your portfolio. This can't be undone.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <button type="button" class="btn btn-danger" id="confirm-delete">Delete project</button>
            </div>
          `,
            onMount: () => {
              document.getElementById('confirm-delete').addEventListener('click', async () => {
                try {
                  await API.delete(`/portfolio/${id}`);
                  Toast.success('Project deleted.');
                  Modal.close();
                  loadPortfolio();
                } catch (err) {
                  Toast.error(err.message);
                }
              });
            },
          });
        });
      });
    }

    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      NotificationBell.render(document.getElementById('notif-bell-mount'));
      if (user.role === 'hirer') {
        window.location.href = 'dashboard.html';
        return;
      }

      SidebarNav.render(user, 'portfolio');

      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      document.getElementById('add-project-btn').addEventListener('click', () => {
        openProjectModal(null, loadPortfolio);
      });

      loadPortfolio();
    })();
  </script>
</body>

</html>
