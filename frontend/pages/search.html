<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Talent — JOB RUSH</title>
  <meta name="description" content="Find verified professionals across Nigeria on JOB RUSH. Search by skill, service, location, rating and price." />
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/jobs.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>

  <main id="main" class="container disc-page">
    <header class="disc-head">
      <h1 class="page-title">Find talent</h1>
      <nav class="search-tabs" aria-label="What to search">
        <a href="search.html" id="tab-talent" class="is-active" aria-current="page">Professionals</a>
        <a href="jobs.html" id="tab-jobs">Jobs</a>
      </nav>
    </header>

    <form id="search-form" class="disc-search" role="search" novalidate>
      <div class="disc-searchbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" name="keyword" placeholder="Name, profession, skill, service or place" aria-label="Search professionals" autocomplete="off" enterkeyhint="search" maxlength="100" />
        <button type="submit" class="btn btn-primary" id="search-submit">Search</button>
      </div>
      <div class="disc-controls">
        <button type="button" class="disc-filter-toggle" data-filter-toggle aria-expanded="false" aria-controls="talent-filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters <span class="disc-filter-count" data-filter-count hidden></span>
        </button>
      </div>
      <div class="disc-filters" id="talent-filters" data-filter-panel>
        <div class="disc-filter-grid">
          <div class="field"><label for="f-category">Category</label><select name="categoryId" id="f-category"><option value="">Any category</option></select></div>
          <div class="field"><label for="f-skill">Skill</label><select name="skillId" id="f-skill"><option value="">Any skill</option></select></div>
          <div class="field"><label for="f-state">State</label><select name="stateId" id="f-state"><option value="">Any state</option></select></div>
          <div class="field"><label for="f-lga">LGA</label><select name="lgaId" id="f-lga" disabled><option value="">Select a state first</option></select></div>
          <div class="field"><label for="f-availability">Availability</label>
            <select name="availabilityStatus" id="f-availability" data-search="false">
              <option value="">Any availability</option>
              <option value="available">Available now</option>
              <option value="busy">Busy</option>
            </select>
          </div>
          <div class="field"><label for="f-rating">Rating</label>
            <select name="minRating" id="f-rating" data-search="false">
              <option value="">Any rating</option>
              <option value="4">4 stars &amp; up</option>
              <option value="3">3 stars &amp; up</option>
            </select>
          </div>
          <div class="field"><label for="f-maxprice">Max starting price (₦)</label><input type="number" name="maxPrice" id="f-maxprice" min="0" step="1000" inputmode="numeric" placeholder="Any" /></div>
          <div class="field disc-filter-checks">
            <label class="filter-check"><input type="checkbox" name="verifiedOnly" /> Verified only</label>
            <label class="filter-check"><input type="checkbox" name="hasVideo" /> Has work video</label>
          </div>
        </div>
        <div class="disc-filter-actions">
          <button type="button" class="btn btn-ghost" data-filter-clear>Clear filters</button>
          <button type="submit" class="btn btn-primary">Show professionals</button>
        </div>
      </div>
    </form>

    <p class="disc-summary" id="search-summary" aria-live="polite"></p>
    <div id="workers-list" class="disc-list"></div>
    <div class="disc-more"><button type="button" class="btn btn-secondary" id="load-more" hidden>Load more</button></div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/utils/scrollLock.js"></script>
  <script src="../js/utils/jrSelect.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/icons.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/avatarBadge.js"></script>
  <script src="../js/modules/chrome.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/locationSelect.js"></script>
  <script src="../js/utils/stateViews.js"></script>
  <script src="../js/utils/discovery.js"></script>
  <script>
    const PAGE_SIZE = 20;
    let currentQuery = '';
    let currentPage = 1;
    let loading = false;
    let filterPanel;

    const searchForm = document.getElementById('search-form');

    function setSummary(text) { document.getElementById('search-summary').textContent = text; }

    /** Page 1 replaces the list; later pages append. Shows loading, empty and error states. */
    async function loadWorkers(query, page = 1) {
      if (loading) return;
      loading = true;
      currentQuery = query; currentPage = page;
      const list = document.getElementById('workers-list');
      const moreBtn = document.getElementById('load-more');
      const submit = document.getElementById('search-submit');
      submit.disabled = true; moreBtn.disabled = true;
      if (page === 1) {
        list.setAttribute('aria-busy', 'true');
        Discovery.skeletonCards(list, { count: 6, kind: 'pro' });
        moreBtn.hidden = true; setSummary('Searching…');
      } else {
        moreBtn.textContent = 'Loading…';
      }
      try {
        const qs = new URLSearchParams(query); qs.set('page', String(page)); qs.set('pageSize', String(PAGE_SIZE));
        const { profiles } = await API.get(`/profiles/worker/search?${qs.toString()}`);
        if (page === 1 && profiles.length === 0) {
          const filtered = [...new URLSearchParams(query).keys()].length > 0;
          StateView.empty(list, {
            icon: 'inbox',
            title: filtered ? 'No professionals found' : 'No professionals listed yet',
            message: filtered ? 'Try fewer words, a different spelling, or clear a filter.' : 'Check back soon as more professionals join.',
            action: filtered ? { label: 'Clear search', onClick: clearAll } : undefined,
          });
          setSummary('');
        } else {
          const html = profiles.map(Discovery.proCard).join('');
          if (page === 1) { list.innerHTML = html; Animate.stagger(list); } else list.insertAdjacentHTML('beforeend', html);
          const shown = list.querySelectorAll('.pro-card').length;
          setSummary(`${shown} professional${shown === 1 ? '' : 's'}${profiles.length === PAGE_SIZE ? ' shown' : ''}`);
        }
        moreBtn.hidden = profiles.length < PAGE_SIZE;
      } catch (err) {
        if (page === 1) {
          StateView.error(list, err, { title: 'Search couldn’t load', retry: () => loadWorkers(query, 1) });
          setSummary('');
        } else {
          Toast.error(StateView.messageFor(err));
        }
      } finally {
        loading = false; submit.disabled = false; moreBtn.disabled = false;
        moreBtn.textContent = 'Load more';
        list.removeAttribute('aria-busy');
      }
    }

    function syncTabs() {
      const k = searchForm.keyword.value.trim();
      document.getElementById('tab-jobs').href = `jobs.html${k ? `?keyword=${encodeURIComponent(k)}` : ''}`;
    }

    function runSearch() {
      const params = Discovery.formToParams(searchForm);
      window.history.replaceState(null, '', params.toString() ? `?${params.toString()}` : window.location.pathname);
      syncTabs();
      filterPanel.refreshCount();
      loadWorkers(params.toString());
    }

    function clearAll() {
      searchForm.keyword.value = '';
      filterPanel.clear(); // clears the filters, then searches again
    }

    (async function init() {
      // Restore the search from the address (?keyword=… from the homepage, a shared link, Back/Forward).
      const initial = new URLSearchParams(window.location.search);
      Discovery.restoreForm(searchForm, initial, ['stateId', 'lgaId', 'categoryId', 'skillId']);
      searchForm.keyword.addEventListener('input', syncTabs); syncTabs();
      filterPanel = Discovery.initFilterPanel(searchForm, { onChange: runSearch });
      Discovery.wireAvatarFallback(document.getElementById('workers-list'));

      loadWorkers(initial.toString());

      Chrome.mountHeader(document.getElementById('header-mount'), { activeLink: 'find-talent' });
      Chrome.renderFooter(document.getElementById('footer-mount'));

      // Category/skill/location filters are a progressive enhancement: search works without them.
      API.get('/catalog/categories').then(({ categories }) => {
        searchForm.categoryId.innerHTML = '<option value="">Any category</option>' + categories.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
        if (initial.get('categoryId')) searchForm.categoryId.value = initial.get('categoryId');
        filterPanel.refreshCount();
      }).catch(() => {});
      API.get('/catalog/skills').then(({ skills }) => {
        searchForm.skillId.innerHTML = '<option value="">Any skill</option>' + skills.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
        if (initial.get('skillId')) searchForm.skillId.value = initial.get('skillId');
        filterPanel.refreshCount();
      }).catch(() => {});
      Promise.resolve(LocationSelect.init({
        stateSelect: searchForm.stateId,
        lgaSelect: searchForm.lgaId,
        restrictToActive: false,
        statePlaceholder: 'Any state',
        initial: { stateId: initial.get('stateId') || undefined, lgaId: initial.get('lgaId') || undefined },
      })).then(() => filterPanel.refreshCount()).catch(() => {});

      document.getElementById('load-more').addEventListener('click', () => loadWorkers(currentQuery, currentPage + 1));
      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // closes the phone keyboard
        if (window.matchMedia('(max-width: 1023px)').matches) filterPanel.close();
        runSearch();
      });
    })();
  </script>
</body>

</html>
