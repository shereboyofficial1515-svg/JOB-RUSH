<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/dashboard-pages.css" />
</head>

<body>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a href="../index.html" class="brand">
        <img src="../assets/images/logo-48.png" alt="JOB RUSH" width="36" height="36" />
        <span>JOB RUSH</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Dashboard"></nav>
      <button class="btn btn-ghost btn-block" id="logout-btn" style="justify-content: flex-start;">Log out</button>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <h1 class="page-title">My Applications</h1>
        <div id="notif-bell-mount"></div>
      </div>

      <div class="wallet-tabs" role="group" aria-label="Filter applications">
        <button class="wallet-tab is-active" data-filter="all">All</button>
        <button class="wallet-tab" data-filter="invited">Invitations</button>
        <button class="wallet-tab" data-filter="active">Active</button>
        <button class="wallet-tab" data-filter="closed">Closed</button>
      </div>

      <div id="applications-list" class="work-list" aria-live="polite">
        <div class="skeleton" style="height:80px; margin-bottom:12px;"></div>
        <div class="skeleton" style="height:80px;"></div>
      </div>
    </div>
  </div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/utils/scrollLock.js"></script>
  <script src="../js/utils/jrSelect.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/ringtoneManager.js"></script>
  <script src="../js/modules/incomingCallWatcher.js"></script>
  <script src="../js/modules/pushNotifications.js"></script>
  <script src="../js/utils/stateViews.js"></script>
  <script src="../js/utils/statusLabels.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/sidebarNav.js"></script>
  <script src="../js/utils/icons.js"></script>
  <script src="../js/modules/pullToRefresh.js"></script>
  <script>
    const ACTIVE_STATUSES = ['applied', 'invited', 'accepted', 'shortlisted'];
    const CLOSED_STATUSES = ['hired', 'rejected', 'withdrawn', 'declined'];
    const fmtDate = (d) => new Date(d).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });

    // One plain sentence about where things stand, by status. Wording only.
    const STATUS_NOTE = {
      invited: 'You’ve been invited to this job. Accept to let the hirer know you’re interested.',
      applied: 'The hirer hasn’t responded yet.',
      accepted: 'You accepted the invitation. The hirer will be in touch about next steps.',
      shortlisted: 'You’re on the shortlist. Watch Interviews and Messages for the hirer’s next step.',
      hired: 'You were hired for this job.',
    };

    function rowHtml(app) {
      const canWithdraw = ['applied', 'shortlisted', 'accepted'].includes(app.status);
      const canRespond = app.status === 'invited';
      const hirer = esc(app.hirer_display_name) || 'JOB RUSH Hirer';
      const note = STATUS_NOTE[app.status];
      return `
      <article class="card work-card" data-app-id="${esc(app.id)}">
        <div class="card-head">
          <div class="work-card-head-text">
            <h3 class="work-card-title"><a href="job-detail.html?id=${encodeURIComponent(app.job_id)}">${esc(app.job_title)}</a></h3>
            <div class="work-card-meta">
              <span>${hirer}</span>
              <span>${app.source === 'hirer_invited' ? 'Invited' : 'Applied'} ${fmtDate(app.created_at)}</span>
            </div>
          </div>
          <div class="work-card-pills">${StatusLabels.pill('application', app.status)}</div>
        </div>
        ${note ? `<p class="work-card-note">${esc(note)}</p>` : ''}
        ${canRespond || canWithdraw ? `<div class="btn-row">
          ${canRespond ? `
            <button class="btn btn-sm btn-primary" data-action="accept">Accept invitation</button>
            <button class="btn btn-sm btn-ghost" data-action="decline">Decline</button>
          ` : ''}
          ${canWithdraw ? `<button class="btn btn-sm btn-ghost btn-danger-text" data-action="withdraw">Withdraw application</button>` : ''}
        </div>` : ''}
      </article>
    `;
    }

    let allApplications = [];

    const FILTERS = {
      all: { match: () => true, empty: { title: 'No applications yet', message: 'Jobs you apply for and invitations from hirers will appear here.' } },
      invited: { match: (a) => a.status === 'invited', empty: { title: 'No invitations right now', message: 'When a hirer invites you to a job, you can accept or decline it here.' } },
      active: { match: (a) => ACTIVE_STATUSES.includes(a.status) && a.status !== 'invited', empty: { title: 'No active applications', message: 'Applications waiting on a hirer’s decision appear here.' } },
      closed: { match: (a) => CLOSED_STATUSES.includes(a.status), empty: { title: 'Nothing closed yet', message: 'Applications that end (hired, not selected, withdrawn or declined) move here.' } },
    };

    function renderTabCounts() {
      document.querySelectorAll('.wallet-tab').forEach((tab) => {
        const f = FILTERS[tab.dataset.filter];
        const n = allApplications.filter(f.match).length;
        let chip = tab.querySelector('.wallet-tab-count');
        if (!chip) { chip = document.createElement('span'); chip.className = 'wallet-tab-count'; tab.appendChild(chip); }
        chip.textContent = n;
        chip.hidden = n === 0;
      });
    }

    function render(filter) {
      const list = document.getElementById('applications-list');
      const f = FILTERS[filter] || FILTERS.all;
      const filtered = allApplications.filter(f.match);

      if (filtered.length === 0) {
        StateView.empty(list, { icon: 'list', title: f.empty.title, message: f.empty.message, action: { label: 'Browse jobs', href: 'jobs.html' } });
        return;
      }
      list.innerHTML = filtered.map(rowHtml).join('');
      Animate.stagger(list, { stepMs: 30 });
      wireActions();
    }

    function wireActions() {
      document.querySelectorAll('[data-action="withdraw"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const card = btn.closest('[data-app-id]');
          const id = card.dataset.appId;
          Modal.open({
            title: 'Withdraw application?',
            bodyHtml: `
            <p class="text-secondary">You can't undo this. The hirer will be able to see that you withdrew.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <button type="button" class="btn btn-danger" id="confirm-withdraw">Withdraw</button>
            </div>`,
            onMount: () => {
              document.getElementById('confirm-withdraw').addEventListener('click', async () => {
                try {
                  await API.post(`/applications/${id}/withdraw`);
                  Toast.success('Application withdrawn.');
                  Modal.close();
                  loadApplications();
                } catch (err) {
                  Toast.error(err.message);
                }
              });
            },
          });
        });
      });

      document.querySelectorAll('[data-action="accept"], [data-action="decline"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const card = btn.closest('[data-app-id]');
          const id = card.dataset.appId;
          const accept = btn.dataset.action === 'accept';
          try {
            await API.post(`/applications/${id}/respond`, { accept });
            Toast.success(accept ? 'Invitation accepted.' : 'Invitation declined.');
            loadApplications();
          } catch (err) {
            Toast.error(err.message);
          }
        });
      });
    }

    async function loadApplications() {
      try {
        const { applications } = await API.get('/applications/me');
        allApplications = applications;
        renderTabCounts();
        const activeFilter = document.querySelector('.wallet-tab.is-active')?.dataset.filter || 'all';
        render(activeFilter);
      } catch (err) {
        if (PullToRefresh.isRefreshing()) throw err;
        StateView.error(document.getElementById('applications-list'), err, { title: 'Unable to load your applications', retry: loadApplications });
      }
    }

    (async function init() {
      const user = await Auth.requireSession('login.html');
      if (!user) return;
      NotificationBell.render(document.getElementById('notif-bell-mount'));
      IncomingCallWatcher.start();
      PushNotifications.registerIfAlreadySubscribed();
      if (user.role === 'hirer') { window.location.href = 'dashboard.html'; return; }

      SidebarNav.render(user, 'applications');
      document.getElementById('logout-btn').addEventListener('click', () => Auth.confirmLogout('../index.html'));

      document.querySelectorAll('.wallet-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.wallet-tab').forEach((t) => t.classList.remove('is-active'));
          tab.classList.add('is-active');
          render(tab.dataset.filter);
        });
      });

      PullToRefresh.init({ onRefresh: () => loadApplications() });

      loadApplications();
    })();
  </script>
</body>

</html>
