<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Profile — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/jobs.css" />
  <link rel="stylesheet" href="../css/worker-profile.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>

  <main id="main" class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-9); max-width: 900px;">
    <button type="button" class="page-back-btn" id="page-back-btn" style="margin-top: 0;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back
    </button>
    <div id="profile-content">
      <div class="skeleton" style="height: 160px; margin-bottom: var(--space-6);"></div>
      <div class="skeleton" style="height: 120px; margin-bottom: var(--space-6);"></div>
      <div class="skeleton" style="height: 240px;"></div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/utils/avatarBadge.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/chrome.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/utils/icons.js"></script>
  <script src="../js/utils/upload.js"></script>
  <script>
    function ratingStars(avg) {
      const n = Math.round(Number(avg) || 0);
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function formatMoney(amount, currency) {
      if (amount === null || amount === undefined) return null;
      const symbol = currency === 'USD' ? '$' : '₦';
      return `${symbol}${Number(amount).toLocaleString()}`;
    }

    function locationLine(profile) {
      const parts = [profile.area_name, profile.lga_name, profile.state_name].filter(Boolean);
      return parts.length ? parts.join(', ') : null;
    }

    function availabilityLabel(status) {
      return { available: 'Available now', busy: 'Currently busy', unavailable: 'Unavailable' }[status] || status;
    }

    function heroHtml(profile, isOwner) {
      const location = locationLine(profile);
      const price = formatMoney(profile.starting_price, profile.price_currency);
      const coverStyle = profile.cover_photo_url ? ` style="background-image:url('${profile.cover_photo_url}');"` : '';
      return `
      <div class="wp-hero">
        <div class="wp-hero-cover"${coverStyle}>
          ${isOwner ? `<button type="button" class="wp-hero-edit-cover-btn" id="edit-cover-btn">${Icons.camera} Edit cover</button>` : ''}
        </div>
        <div class="wp-hero-body">
          ${AvatarBadge.wrap(
            `<img src="${profile.profile_picture_url || ASSETS.defaultAvatar}" alt="" class="wp-avatar" width="112" height="112" />`,
            { verified: profile.verification_status === 'approved', isPro: !!profile.is_pro, size: 'lg' }
          )}
          <div class="wp-identity">
            <div class="wp-name-row">
              <span class="wp-name">${esc(profile.full_name)}</span>
              ${profile.verification_status === 'approved' ? '<span class="badge badge-verified badge-enter">Verified</span>' : ''}
              ${profile.is_pro ? '<span class="badge badge-pro badge-enter">PRO</span>' : ''}
            </div>
            <div class="wp-title">${esc(profile.professional_title) || 'Professional'}</div>
            <div class="wp-info-row">
              <span class="wp-info-item text-gold">${Icons.star} ${ratingStars(profile.rating_avg)} <span class="text-secondary">(${profile.rating_count} review${profile.rating_count === 1 ? '' : 's'})</span></span>
              ${location ? `<span class="wp-info-item">${Icons.location} ${esc(location)}</span>` : ''}
              <span class="wp-info-item"><span class="wp-availability-dot ${profile.availability_status}"></span> ${availabilityLabel(profile.availability_status)}</span>
              ${profile.completed_jobs_count ? `<span class="wp-info-item">${Icons.briefcase} ${profile.completed_jobs_count} jobs completed</span>` : ''}
            </div>
            ${price ? `<div class="wp-price" style="margin-top: var(--space-3);">${price} <span class="text-secondary text-sm" style="font-weight:400;">starting</span></div>` : ''}
            ${(profile.working_days || profile.working_hours) ? `<div class="wp-info-item text-secondary text-sm" style="margin-top: var(--space-1);">${Icons.clock} ${[profile.working_days, profile.working_hours].filter(Boolean).join(' · ')}</div>` : ''}
            <div class="wp-actions wp-header-actions-desktop-only" id="profile-actions">
              ${isOwner ? `<a href="portfolio.html" class="btn btn-secondary">Manage my profile</a>` : `
                <button class="btn btn-primary" id="contact-btn">${Icons.message} Message</button>
                <button class="btn btn-secondary" id="hire-btn">Hire</button>
                <button class="btn btn-ghost btn-sm" id="report-profile-btn" title="Report this profile">Report</button>
              `}
            </div>
          </div>
        </div>
        ${!isOwner ? `
        <div class="wp-sticky-actions" id="sticky-profile-actions">
          <button class="btn btn-primary" id="contact-btn-sticky">${Icons.message} Message</button>
          <button class="btn btn-secondary" id="hire-btn-sticky">Hire</button>
        </div>` : ''}
      </div>
    `;
    }

    const GENDER_LABELS = { male: 'Male', female: 'Female', non_binary: 'Non-binary', prefer_not_to_say: 'Prefer not to say' };

    // Server already omits gender/gender_custom entirely when it's not
    // public (see profileController.redactGenderForViewer) — this only
    // ever renders when the worker chose to show it. Its own small
    // section rather than squeezed into the header's meta row, which
    // is already dense with rating/location/availability.
    function genderHtml(profile) {
      if (!profile.gender || profile.gender_visibility !== 'public') return '';
      const label = profile.gender === 'custom' ? profile.gender_custom : GENDER_LABELS[profile.gender];
      if (!label) return '';
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.gender}<h2>Personal information</h2></div>
        <div class="wp-info-item text-secondary text-sm">Gender: ${esc(label)}</div>
      </div>`;
    }

    function educationHtml(entries) {
      if (!entries || entries.length === 0) return '';
      const EDUCATION_TYPE_LABELS = {
        university: 'University', college: 'College', polytechnic: 'Polytechnic',
        secondary_school: 'Secondary School', vocational_training: 'Vocational Training',
        professional_training: 'Professional Training', certification: 'Certification', online: 'Online Education',
      };
      const rangeFor = (e) => [
        e.start_date ? new Date(e.start_date).toLocaleDateString(undefined, { year: 'numeric', month: 'short' }) : '',
        e.is_current ? 'Present' : (e.end_date ? new Date(e.end_date).toLocaleDateString(undefined, { year: 'numeric', month: 'short' }) : ''),
      ].filter(Boolean).join(' — ');
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.graduationCap}<h2>Education</h2></div>
        ${entries.map((e) => `
          <div class="wp-education-card">
            <span class="wp-education-icon">${Icons.graduationCap}</span>
            <div>
              <div class="wp-education-institution">${esc(e.institution)}</div>
              <div class="wp-education-degree">${[e.degree, e.field_of_study].filter(Boolean).map(esc).join(', ')}</div>
              <div class="wp-education-meta">${EDUCATION_TYPE_LABELS[e.education_type] || e.education_type}${rangeFor(e) ? ` · ${esc(rangeFor(e))}` : ''}${e.location ? ` · ${esc(e.location)}` : ''}</div>
              ${e.description ? `<p class="wp-education-desc">${esc(e.description)}</p>` : ''}
            </div>
          </div>`).join('')}
      </div>`;
    }

    function formatFileSize(bytes) {
      if (!bytes) return null;
      const mb = bytes / (1024 * 1024);
      return mb >= 0.1 ? `${mb.toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;
    }

    const MIME_LABELS = {
      'application/pdf': 'PDF',
      'application/msword': 'DOC',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'DOCX',
      'image/jpeg': 'JPG', 'image/png': 'PNG', 'image/webp': 'WEBP',
    };

    // The API already returns `cv: null` for a private CV or one that
    // doesn't exist (see cvService.getForViewer) — this section simply
    // doesn't render rather than a visitor ever seeing "CV is private."
    function cvSectionHtml(cv) {
      if (!cv) return '';
      const isFile = cv.cvType === 'uploaded_file' && cv.signedUrl;
      const metaParts = isFile
        ? [MIME_LABELS[cv.mimeType] || null, formatFileSize(cv.fileSize), cv.updatedAt ? `Updated ${new Date(cv.updatedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short' })}` : null].filter(Boolean)
        : [];
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.document}<h2>Resume / CV</h2></div>
        <div class="wp-cv-card">
          <span class="wp-cv-icon">${Icons.document}</span>
          <div>
            <div class="wp-cv-title">${isFile ? 'Professional Resume' : 'Job Rush CV'}</div>
            <div class="wp-cv-meta">${isFile ? metaParts.join(' • ') : 'Profile-based resume'}</div>
          </div>
          <div class="wp-cv-actions">
            ${isFile
              ? `<a class="btn btn-secondary btn-sm" href="${cv.signedUrl}" target="_blank" rel="noopener">View CV</a><a class="btn btn-ghost btn-sm" href="${cv.signedUrl}" download>Download</a>`
              : `<span class="text-secondary text-sm">See Experience, Education &amp; Portfolio above</span>`}
          </div>
        </div>
      </div>`;
    }

    function skillsHtml(skills) {
      if (!skills || skills.length === 0) return '';
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.checkShield}<h2>Skills &amp; Expertise</h2></div>
        <div class="wp-skills">${skills.map((s) => `<span class="wp-skill-chip">${Icons.checkShield}${esc(s.name)}</span>`).join('')}</div>
      </div>`;
    }

    function aboutHtml(profile) {
      const bio = esc(profile.bio) || 'This professional hasn’t written a bio yet.';
      const isLong = bio.length > 320;
      return `
      <div class="wp-section">
        <h2>About</h2>
        <p class="wp-about-text${isLong ? ' is-clamped' : ''}" id="wp-about-text">${bio}</p>
        ${isLong ? `<button type="button" class="wp-read-more-btn" id="wp-about-toggle">Read more</button>` : ''}
      </div>`;
    }

    function wireAboutToggle() {
      const btn = document.getElementById('wp-about-toggle');
      const text = document.getElementById('wp-about-text');
      if (!btn || !text) return;
      btn.addEventListener('click', () => {
        const expanded = !text.classList.contains('is-clamped');
        text.classList.toggle('is-clamped', expanded);
        btn.textContent = expanded ? 'Read more' : 'Show less';
      });
    }

    // One card per portfolio PROJECT (not per media item) — clicking a
    // project takes the visitor to the full Portfolio Project Details
    // page, which is where the rest of what they entered actually
    // lives (description, category, external link, full gallery).
    function projectCardHtml(p) {
      const media = p.media || [];
      const primary = media.find((m) => m.is_primary) || media[0];
      const thumb = primary
        ? primary.media_type === 'video'
          ? primary.thumbnailUrl
            ? `<img src="${primary.thumbnailUrl}" alt="" loading="lazy" /><div class="wp-project-video-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="white" style="filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));"><path d="M8 5v14l11-7z"/></svg></div>`
            : `<div class="wp-project-video-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>`
          : `<img src="${primary.thumbnailUrl || primary.url}" alt="" loading="lazy" />`
        : `<div class="wp-project-video-icon"><span class="text-xs text-secondary">No media</span></div>`;

      return `
      <a class="wp-project-card card-img-zoom" href="portfolio-detail.html?id=${p.id}">
        <div class="wp-project-thumb-frame card-img-zoom-frame">${thumb}</div>
        <div class="wp-project-card-body">
          <h3>${esc(p.title)}</h3>
          ${p.category_name ? `<span class="badge badge-neutral">${esc(p.category_name)}</span>` : ''}
          <div class="wp-project-media-count">${media.length} media item${media.length === 1 ? '' : 's'}</div>
        </div>
      </a>`;
    }

    function portfolioHtml(portfolios) {
      if (portfolios.length === 0) {
        return `
        <div class="wp-section">
          <div class="wp-section-header">${Icons.portfolio}<h2>Portfolio</h2></div>
          <div class="wp-empty-state">
            <h3>No portfolio projects yet.</h3>
            <p>Showcase completed work to help clients understand what you do.</p>
          </div>
        </div>`;
      }
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.portfolio}<h2>Portfolio</h2></div>
        <div class="wp-gallery" id="wp-gallery">${portfolios.map(projectCardHtml).join('')}</div>
      </div>`;
    }

    function experienceHtml(entries) {
      if (!entries || entries.length === 0) return '';
      const rangeFor = (e) => [
        e.start_date ? new Date(e.start_date).toLocaleDateString(undefined, { year: 'numeric', month: 'short' }) : '',
        e.is_current ? 'Present' : (e.end_date ? new Date(e.end_date).toLocaleDateString(undefined, { year: 'numeric', month: 'short' }) : ''),
      ].filter(Boolean).join(' — ');
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.briefcase}<h2>Work Experience</h2></div>
        <div class="wp-timeline">
          ${entries.map((e) => `
            <div class="wp-timeline-item">
              <span class="wp-timeline-dot"></span>
              <div class="wp-timeline-role">${esc(e.job_title)}</div>
              ${e.company_name ? `<div class="wp-timeline-company">${esc(e.company_name)}</div>` : ''}
              <div class="wp-timeline-meta">${esc(rangeFor(e))}${e.location ? ` · ${esc(e.location)}` : ''}</div>
              ${e.description ? `<p class="wp-timeline-desc">${esc(e.description)}</p>` : ''}
            </div>`).join('')}
        </div>
      </div>`;
    }

    function servicesHtml(services) {
      if (!services || services.length === 0) return '';
      const PRICING_LABELS = { hourly: 'Per hour', daily: 'Per day', project: 'Per project', fixed: 'Fixed price', negotiable: 'Negotiable', contact_for_quote: 'Contact for quote' };
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.briefcase}<h2>Services &amp; Talents</h2></div>
        <div style="display:grid; gap: var(--space-3);">
          ${services.map((s) => {
            const money = s.price !== null ? formatMoney(s.price, s.price_currency) : null;
            const unitLabel = PRICING_LABELS[s.pricing_type] || s.pricing_type;
            return `
            <div class="wp-service-card">
              <div class="wp-service-top">
                <span class="wp-service-name">${esc(s.name)}</span>
                <div class="wp-service-price-block">
                  ${money ? `<div class="wp-service-price-label">Starting from</div><div class="wp-service-price">${esc(money)}</div><div class="wp-service-price-unit">${esc(unitLabel)}</div>` : `<div class="wp-service-price" style="font-size: var(--text-base);">${esc(unitLabel)}</div>`}
                </div>
              </div>
              ${s.duration_estimate ? `<div class="wp-service-duration">${Icons.clock} ${esc(s.duration_estimate)}</div>` : ''}
              ${s.description ? `<p class="wp-service-desc">${esc(s.description)}</p>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }

    function businessHtml(business, isOwner) {
      if (!business) {
        // Only the owner ever sees a setup prompt here — a visitor
        // simply never sees this section at all when there's nothing
        // to show (no private "set up" controls leak to other users).
        if (!isOwner) return '';
        return `
        <div class="wp-section">
          <div class="wp-section-header">${Icons.business}<h2>Business</h2></div>
          <div class="wp-empty-state">
            <h3>Business Profile</h3>
            <p>Showcase your business, storefront and services.</p>
            <a href="profile-settings.html?tab=business" class="btn btn-secondary btn-sm">Set up Business Profile</a>
          </div>
        </div>`;
      }
      const location = [business.area_name, business.lga_name, business.state_name, 'Nigeria'].filter(Boolean).join(', ');
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.business}<h2>Business</h2></div>
        <div class="wp-business-card">
          ${business.storefront_photo_url ? `<img src="${business.storefront_photo_url}" alt="${esc(business.business_name)} storefront" loading="lazy" class="wp-business-cover" />` : ''}
          <div class="wp-business-body">
            <div class="wp-business-name">${esc(business.business_name)}</div>
            ${business.description ? `<p class="wp-business-desc">${esc(business.description)}</p>` : ''}
            <div class="wp-business-info">
              ${location ? `<span class="wp-info-item">${Icons.location} ${esc(location)}${business.address ? ` — ${esc(business.address)}` : ''}</span>` : ''}
              ${business.contact_phone ? `<span class="wp-info-item">${Icons.phone} ${esc(business.contact_phone)}</span>` : ''}
              ${business.contact_email ? `<span class="wp-info-item">${Icons.mail} ${esc(business.contact_email)}</span>` : ''}
              ${business.opening_hours ? `<span class="wp-info-item">${Icons.clock} ${esc(business.opening_hours)}</span>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }

    const SOCIAL_ICON_BY_PLATFORM = {
      facebook: { color: '#1877F2', label: 'Facebook', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12Z"/></svg>' },
      instagram: { color: '#E1306C', label: 'Instagram', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="#fff" stroke="none"/></svg>' },
      tiktok: { color: '#000000', label: 'TikTok', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16.6 3c.4 2.1 1.9 3.7 4 4v3c-1.5 0-2.9-.5-4-1.4v6.2a5.6 5.6 0 1 1-5.6-5.6c.2 0 .5 0 .7.05v3.1a2.5 2.5 0 1 0 1.9 2.45V3h3Z"/></svg>' },
      youtube: { color: '#FF0000', label: 'YouTube', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M22 12s0-3.1-.4-4.6a3 3 0 0 0-2.1-2.1C17.9 5 12 5 12 5s-5.9 0-7.5.3a3 3 0 0 0-2.1 2.1C2 8.9 2 12 2 12s0 3.1.4 4.6a3 3 0 0 0 2.1 2.1C6.1 19 12 19 12 19s5.9 0 7.5-.3a3 3 0 0 0 2.1-2.1c.4-1.5.4-4.6.4-4.6ZM10 15V9l5 3-5 3Z"/></svg>' },
      website: { color: '#0F2A4A', label: 'Website', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>' },
    };

    function socialLinksHtml(links) {
      if (!links || links.length === 0) return '';
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.globe}<h2>Social</h2></div>
        <div class="wp-social-row">
          ${links.map((l) => {
        const meta = SOCIAL_ICON_BY_PLATFORM[l.platform];
        if (!meta) return '';
        return `
            <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer nofollow" class="wp-social-card">
              <span class="wp-social-icon" style="background:${meta.color};">${meta.icon}</span>
              ${meta.label}
            </a>`;
      }).join('')}
        </div>
      </div>`;
    }

    function reviewHtml(r) {
      return `
      <div class="wp-review">
        <div class="wp-review-head">
          <strong>${esc(r.reviewer_display_name) || 'Client'}</strong>
          <span class="text-gold text-sm">${ratingStars(r.rating)}</span>
        </div>
        <p class="text-secondary text-sm" style="max-width:none;">${esc(r.review_text) || ''}</p>
        <div class="text-xs text-secondary" style="margin-top: var(--space-1);">${new Date(r.created_at).toLocaleDateString()}</div>
      </div>`;
    }

    function reviewsHtml(reviews) {
      return `
      <div class="wp-section">
        <div class="wp-section-header">${Icons.star}<h2>Reviews</h2></div>
        <div id="wp-reviews-list">
          ${reviews.length === 0
            ? '<p class="text-secondary text-sm">No reviews yet.</p>'
            : reviews.map(reviewHtml).join('')}
        </div>
      </div>`;
    }

    async function openHireModal(profile) {
      let jobs;
      try {
        ({ jobs } = await API.get('/jobs/mine?status=open'));
      } catch (err) {
        Toast.error(err.message);
        return;
      }

      if (jobs.length === 0) {
        Modal.open({
          title: 'Post a job first',
          bodyHtml: `
            <p class="text-secondary">You don’t have any open jobs to invite ${esc(profile.full_name)} to yet.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <a href="my-jobs.html" class="btn btn-primary">Post a job</a>
            </div>`,
        });
        return;
      }

      Modal.open({
        title: `Invite ${esc(profile.full_name)} to a job`,
        bodyHtml: `
          <form id="hire-form" novalidate>
            <div class="field" id="job-field">
              <label for="jobSelect">Choose an open job</label>
              <select id="jobSelect" name="jobSelect">
                ${jobs.map((j) => `<option value="${j.id}">${esc(j.title)}</option>`).join('')}
              </select>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="hire-submit">Send invitation</button>
            </div>
          </form>`,
        onMount: () => {
          document.getElementById('hire-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('hire-submit');
            FormHelpers.setLoading(submitBtn, true);
            try {
              const jobId = document.getElementById('jobSelect').value;
              await API.post(`/jobs/${jobId}/invitations`, { workerUserId: profile.user_id });
              Toast.success('Invitation sent.');
              Modal.close();
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(submitBtn, false);
            }
          });
        },
      });
    }

    function openReportModal(profile) {
      const CATEGORIES = [
        ['fake_profile', 'Fake profile'],
        ['fraud_scam', 'Fraud or scam'],
        ['inappropriate_content', 'Inappropriate content'],
        ['false_information', 'False information'],
        ['harassment', 'Harassment'],
        ['spam', 'Spam'],
        ['other', 'Other'],
      ];
      Modal.open({
        title: `Report ${esc(profile.full_name)}`,
        bodyHtml: `
          <form id="report-form" novalidate>
            <div class="field">
              <label for="report-category">Reason</label>
              <select id="report-category" name="category">
                ${CATEGORIES.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label for="report-reason">Details</label>
              <textarea id="report-reason" name="reason" rows="4" placeholder="What happened?" required></textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <button type="submit" class="btn btn-danger" id="report-submit">Submit report</button>
            </div>
          </form>`,
        onMount: () => {
          document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            if (form.reason.value.trim().length < 5) {
              Toast.error('Please provide a bit more detail.');
              return;
            }
            const submitBtn = document.getElementById('report-submit');
            FormHelpers.setLoading(submitBtn, true);
            try {
              await API.post(`/profiles/${profile.user_id}/report`, {
                category: form.category.value,
                reason: form.reason.value.trim(),
              });
              Modal.close();
              Toast.success('Report submitted. Our team will review it.');
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(submitBtn, false);
            }
          });
        },
      });
    }

    async function wireActions(profile, user) {
      const contactBtns = [document.getElementById('contact-btn'), document.getElementById('contact-btn-sticky')].filter(Boolean);
      const hireBtns = [document.getElementById('hire-btn'), document.getElementById('hire-btn-sticky')].filter(Boolean);
      const reportBtn = document.getElementById('report-profile-btn');
      if (contactBtns.length === 0) return;

      if (!user) {
        const returnTo = encodeURIComponent(window.location.pathname + window.location.search);
        contactBtns.forEach((b) => b.addEventListener('click', () => { window.location.href = `login.html?returnTo=${returnTo}`; }));
        hireBtns.forEach((b) => b.addEventListener('click', () => { window.location.href = `login.html?returnTo=${returnTo}`; }));
        if (reportBtn) reportBtn.addEventListener('click', () => { window.location.href = `login.html?returnTo=${returnTo}`; });
        return;
      }

      if (reportBtn) reportBtn.addEventListener('click', () => openReportModal(profile));

      contactBtns.forEach((btn) => btn.addEventListener('click', async () => {
        FormHelpers.setLoading(btn, true);
        try {
          const { conversation } = await API.post('/messaging/conversations', { otherUserId: profile.user_id });
          window.location.href = `messages.html?conversation=${conversation.id}`;
        } catch (err) {
          Toast.error(err.message);
        } finally {
          FormHelpers.setLoading(btn, false);
        }
      }));

      if (user.role === 'hirer') {
        hireBtns.forEach((btn) => btn.addEventListener('click', () => openHireModal(profile)));
      } else {
        hireBtns.forEach((btn) => { btn.style.display = 'none'; });
      }
    }

    function wireCoverUpload(profile) {
      const btn = document.getElementById('edit-cover-btn');
      if (!btn) return;
      const cover = document.querySelector('.wp-hero-cover');
      btn.addEventListener('click', async () => {
        const file = await Upload.pickFile({ accept: 'image/jpeg,image/png,image/webp,image/gif' });
        if (!file) return;
        const originalLabel = btn.innerHTML;
        btn.disabled = true;
        try {
          const formData = new FormData();
          formData.append('file', file);
          const uploaded = await API.upload('/storage/profile-cover', formData);
          await API.patch('/profiles/worker/me', { coverPhotoUrl: uploaded.publicUrl });
          cover.style.backgroundImage = `url('${uploaded.publicUrl}')`;
          Toast.success('Cover photo updated.');
        } catch (err) {
          Toast.error(err.message);
        } finally {
          btn.innerHTML = originalLabel;
          btn.disabled = false;
        }
      });
    }

    (async function init() {
      document.getElementById('page-back-btn').addEventListener('click', () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'search.html';
      });

      const params = new URLSearchParams(window.location.search);
      const workerId = params.get('id');
      const user = await Auth.getCurrentUser();
      Chrome.renderHeader(document.getElementById('header-mount'), { activeLink: 'find-talent', user });
      Chrome.renderFooter(document.getElementById('footer-mount'));

      const content = document.getElementById('profile-content');

      if (!workerId) {
        content.innerHTML = '<p class="text-secondary">No profile specified.</p>';
        return;
      }

      try {
        const [{ profile }, portfolioResult, reviewsResult, experienceResult, educationResult, cvResult, servicesResult, businessResult, socialLinksResult] = await Promise.all([
          API.get(`/profiles/worker/${workerId}`),
          API.get(`/portfolio/worker/${workerId}`).catch(() => ({ portfolios: [] })),
          API.get(`/reviews/worker/${workerId}`).catch(() => ({ reviews: [] })),
          API.get(`/profiles/worker/${workerId}/experience`).catch(() => ({ entries: [] })),
          API.get(`/profiles/worker/${workerId}/education`).catch(() => ({ entries: [] })),
          API.get(`/profiles/worker/${workerId}/cv`).catch(() => ({ cv: null })),
          API.get(`/profiles/worker/${workerId}/services`).catch(() => ({ services: [] })),
          API.get(`/profiles/worker/${workerId}/business`).catch(() => ({ profile: null })),
          API.get(`/profiles/worker/${workerId}/social-links`).catch(() => ({ links: [] })),
        ]);

        const isOwner = user?.id === workerId;

        content.innerHTML =
          heroHtml(profile, isOwner) +
          aboutHtml(profile) +
          servicesHtml(servicesResult.services || []) +
          skillsHtml(profile.skills) +
          experienceHtml(experienceResult.entries || []) +
          educationHtml(educationResult.entries || []) +
          businessHtml(businessResult.profile, isOwner) +
          portfolioHtml(portfolioResult.portfolios || []) +
          cvSectionHtml(cvResult.cv) +
          socialLinksHtml(socialLinksResult.links || []) +
          genderHtml(profile);

        content.insertAdjacentHTML('beforeend', reviewsHtml(reviewsResult.reviews || []));

        content.classList.add('fade-in');
        const gallery = document.getElementById('wp-gallery');
        if (gallery) Animate.stagger(gallery, { stepMs: 30 });
        const reviewsList = document.getElementById('wp-reviews-list');
        if (reviewsList) Animate.stagger(reviewsList, { selector: '.wp-review', stepMs: 40 });

        wireActions(profile, user);
        wireAboutToggle();
        if (isOwner) wireCoverUpload(profile);
      } catch (err) {
        content.innerHTML = `
          <div class="empty-state">
            <img src="${ASSETS.emptyState}" alt="" />
            <h3>Profile not found</h3>
            <p>${err.message}</p>
            <a href="search.html" class="btn btn-primary btn-sm">Find other professionals</a>
          </div>`;
      }
    })();
  </script>
</body>

</html>
