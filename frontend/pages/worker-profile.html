<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Profile — JOB RUSH</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/jobs.css" />
  <link rel="stylesheet" href="../css/worker-profile.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="header-mount"></div>

  <main id="main" class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-9); max-width: 900px;">
    <div id="profile-content">
      <div class="skeleton" style="height: 160px; margin-bottom: var(--space-6);"></div>
      <div class="skeleton" style="height: 120px; margin-bottom: var(--space-6);"></div>
      <div class="skeleton" style="height: 240px;"></div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="../js/config/assets.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/modules/accessibility.js"></script>
  <script src="../js/utils/sanitize.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/animate.js"></script>
  <script src="../js/utils/formHelpers.js"></script>
  <script src="../js/utils/modal.js"></script>
  <script src="../js/modules/notificationBell.js"></script>
  <script src="../js/modules/chrome.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script>
    function ratingStars(avg) {
      const n = Math.round(Number(avg) || 0);
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function formatMoney(amount, currency) {
      if (amount === null || amount === undefined) return null;
      const symbol = currency === 'USD' ? '$' : '₦';
      return `${symbol}${Number(amount).toLocaleString()}`;
    }

    function locationLine(profile) {
      const parts = [profile.area_name, profile.lga_name, profile.state_name].filter(Boolean);
      return parts.length ? parts.join(', ') : null;
    }

    function availabilityLabel(status) {
      return { available: 'Available now', busy: 'Currently busy', unavailable: 'Unavailable' }[status] || status;
    }

    function headerHtml(profile, isOwner) {
      const location = locationLine(profile);
      const price = formatMoney(profile.starting_price, profile.price_currency);
      return `
      <div class="wp-header">
        <img src="${profile.profile_picture_url || ASSETS.defaultAvatar}" alt="" class="wp-avatar" />
        <div class="wp-identity">
          <div class="wp-name-row">
            <span class="wp-name">${esc(profile.full_name)}</span>
            ${profile.verification_status === 'approved' ? '<span class="badge badge-verified badge-enter">Verified</span>' : ''}
            ${profile.is_pro ? '<span class="badge badge-pro badge-enter">PRO</span>' : ''}
          </div>
          <div class="wp-title">${esc(profile.professional_title) || 'Professional'}</div>
          <div class="wp-meta-row">
            <span class="wp-meta-item text-gold">${ratingStars(profile.rating_avg)} <span class="text-secondary">(${profile.rating_count} review${profile.rating_count === 1 ? '' : 's'})</span></span>
            ${location ? `<span class="wp-meta-item">${esc(location)}</span>` : ''}
            <span class="wp-meta-item"><span class="wp-availability-dot ${profile.availability_status}"></span> ${availabilityLabel(profile.availability_status)}</span>
            ${profile.completed_jobs_count ? `<span class="wp-meta-item">${profile.completed_jobs_count} jobs completed</span>` : ''}
          </div>
          ${price ? `<div class="wp-price" style="margin-top: var(--space-3);">${price} <span class="text-secondary text-sm" style="font-weight:400;">starting</span></div>` : ''}
          ${(profile.working_days || profile.working_hours) ? `<div class="text-secondary text-sm" style="margin-top: var(--space-1);">${[profile.working_days, profile.working_hours].filter(Boolean).join(' · ')}</div>` : ''}
          <div class="wp-actions" id="profile-actions">
            ${isOwner ? `<a href="portfolio.html" class="btn btn-secondary">Manage my profile</a>` : `
              <button class="btn btn-primary" id="contact-btn">Contact</button>
              <button class="btn btn-secondary" id="hire-btn">Hire</button>
            `}
          </div>
        </div>
      </div>
    `;
    }

    function skillsHtml(skills) {
      if (!skills || skills.length === 0) return '';
      return `
      <div class="wp-section">
        <h2>Skills</h2>
        <div class="wp-skills">${skills.map((s) => `<span class="wp-skill-chip">${esc(s.name)}</span>`).join('')}</div>
      </div>`;
    }

    function aboutHtml(profile) {
      return `
      <div class="wp-section">
        <h2>About</h2>
        <p style="white-space: pre-wrap; max-width: none;">${esc(profile.bio) || 'This professional hasn’t written a bio yet.'}</p>
      </div>`;
    }

    // One card per portfolio PROJECT (not per media item) — clicking a
    // project takes the visitor to the full Portfolio Project Details
    // page, which is where the rest of what they entered actually
    // lives (description, category, external link, full gallery).
    function projectCardHtml(p) {
      const media = p.media || [];
      const primary = media.find((m) => m.is_primary) || media[0];
      const thumb = primary
        ? primary.media_type === 'video'
          ? `<div class="wp-project-video-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>`
          : `<img src="${primary.url}" alt="" loading="lazy" />`
        : `<div class="wp-project-video-icon"><span class="text-xs text-secondary">No media</span></div>`;

      return `
      <a class="wp-project-card card-img-zoom" href="portfolio-detail.html?id=${p.id}">
        <div class="wp-project-thumb-frame card-img-zoom-frame">${thumb}</div>
        <div class="wp-project-card-body">
          <h3>${esc(p.title)}</h3>
          ${p.category_name ? `<span class="badge badge-neutral">${esc(p.category_name)}</span>` : ''}
          <div class="wp-project-media-count">${media.length} media item${media.length === 1 ? '' : 's'}</div>
        </div>
      </a>`;
    }

    function portfolioHtml(portfolios) {
      if (portfolios.length === 0) {
        return `
        <div class="wp-section">
          <h2>Portfolio</h2>
          <p class="text-secondary text-sm">No portfolio items yet.</p>
        </div>`;
      }
      return `
      <div class="wp-section">
        <h2>Portfolio</h2>
        <div class="wp-gallery" id="wp-gallery">${portfolios.map(projectCardHtml).join('')}</div>
      </div>`;
    }

    function reviewHtml(r) {
      return `
      <div class="wp-review">
        <div class="wp-review-head">
          <strong>${esc(r.reviewer_display_name) || 'Client'}</strong>
          <span class="text-gold text-sm">${ratingStars(r.rating)}</span>
        </div>
        <p class="text-secondary text-sm" style="max-width:none;">${esc(r.review_text) || ''}</p>
        <div class="text-xs text-secondary" style="margin-top: var(--space-1);">${new Date(r.created_at).toLocaleDateString()}</div>
      </div>`;
    }

    function reviewsHtml(reviews) {
      return `
      <div class="wp-section">
        <h2>Reviews</h2>
        <div id="wp-reviews-list">
          ${reviews.length === 0
            ? '<p class="text-secondary text-sm">No reviews yet.</p>'
            : reviews.map(reviewHtml).join('')}
        </div>
      </div>`;
    }

    async function openHireModal(profile) {
      let jobs;
      try {
        ({ jobs } = await API.get('/jobs/mine?status=open'));
      } catch (err) {
        Toast.error(err.message);
        return;
      }

      if (jobs.length === 0) {
        Modal.open({
          title: 'Post a job first',
          bodyHtml: `
            <p class="text-secondary">You don’t have any open jobs to invite ${esc(profile.full_name)} to yet.</p>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <a href="my-jobs.html" class="btn btn-primary">Post a job</a>
            </div>`,
        });
        return;
      }

      Modal.open({
        title: `Invite ${esc(profile.full_name)} to a job`,
        bodyHtml: `
          <form id="hire-form" novalidate>
            <div class="field" id="job-field">
              <label for="jobSelect">Choose an open job</label>
              <select id="jobSelect" name="jobSelect">
                ${jobs.map((j) => `<option value="${j.id}">${esc(j.title)}</option>`).join('')}
              </select>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="hire-submit">Send invitation</button>
            </div>
          </form>`,
        onMount: () => {
          document.getElementById('hire-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('hire-submit');
            FormHelpers.setLoading(submitBtn, true);
            try {
              const jobId = document.getElementById('jobSelect').value;
              await API.post(`/jobs/${jobId}/invitations`, { workerUserId: profile.user_id });
              Toast.success('Invitation sent.');
              Modal.close();
            } catch (err) {
              Toast.error(err.message);
            } finally {
              FormHelpers.setLoading(submitBtn, false);
            }
          });
        },
      });
    }

    async function wireActions(profile, user) {
      const contactBtn = document.getElementById('contact-btn');
      const hireBtn = document.getElementById('hire-btn');
      if (!contactBtn) return;

      if (!user) {
        const returnTo = encodeURIComponent(window.location.pathname + window.location.search);
        contactBtn.addEventListener('click', () => { window.location.href = `login.html?returnTo=${returnTo}`; });
        hireBtn.addEventListener('click', () => { window.location.href = `login.html?returnTo=${returnTo}`; });
        return;
      }

      contactBtn.addEventListener('click', async () => {
        FormHelpers.setLoading(contactBtn, true);
        try {
          const { conversation } = await API.post('/messaging/conversations', { otherUserId: profile.user_id });
          window.location.href = `messages.html?conversation=${conversation.id}`;
        } catch (err) {
          Toast.error(err.message);
        } finally {
          FormHelpers.setLoading(contactBtn, false);
        }
      });

      if (user.role === 'hirer') {
        hireBtn.addEventListener('click', () => openHireModal(profile));
      } else {
        hireBtn.style.display = 'none';
      }
    }

    (async function init() {
      const params = new URLSearchParams(window.location.search);
      const workerId = params.get('id');
      const user = await Auth.getCurrentUser();
      Chrome.renderHeader(document.getElementById('header-mount'), { activeLink: 'find-talent', user });
      Chrome.renderFooter(document.getElementById('footer-mount'));

      const content = document.getElementById('profile-content');

      if (!workerId) {
        content.innerHTML = '<p class="text-secondary">No profile specified.</p>';
        return;
      }

      try {
        const [{ profile }, portfolioResult, reviewsResult] = await Promise.all([
          API.get(`/profiles/worker/${workerId}`),
          API.get(`/portfolio/worker/${workerId}`).catch(() => ({ portfolios: [] })),
          API.get(`/reviews/worker/${workerId}`).catch(() => ({ reviews: [] })),
        ]);

        const isOwner = user?.id === workerId;

        content.innerHTML =
          headerHtml(profile, isOwner) +
          aboutHtml(profile) +
          skillsHtml(profile.skills) +
          portfolioHtml(portfolioResult.portfolios || []);

        content.insertAdjacentHTML('beforeend', reviewsHtml(reviewsResult.reviews || []));

        content.classList.add('fade-in');
        const gallery = document.getElementById('wp-gallery');
        if (gallery) Animate.stagger(gallery, { stepMs: 30 });
        const reviewsList = document.getElementById('wp-reviews-list');
        if (reviewsList) Animate.stagger(reviewsList, { selector: '.wp-review', stepMs: 40 });

        wireActions(profile, user);
      } catch (err) {
        content.innerHTML = `
          <div class="empty-state">
            <img src="${ASSETS.emptyState}" alt="" />
            <h3>Profile not found</h3>
            <p>${err.message}</p>
            <a href="search.html" class="btn btn-primary btn-sm">Find other professionals</a>
          </div>`;
      }
    })();
  </script>
</body>

</html>
