# Render Blueprint for JOB RUSH.
#
# ONE combined web service: the Express backend (backend/src/server.js)
# now also serves the frontend's static files directly (see the
# express.static block in server.js) — this matches what's actually
# deployed and working on Render today (confirmed by directly probing
# the live service: /health returns 200, and the response headers are
# unmistakably this app's own Helmet/error-handling middleware). No
# separate frontend static site exists, and none is required — the
# frontend has no build step, so there's nothing a second service
# would add beyond CORS complexity between two different .onrender.com
# hostnames instead of one same-origin app.
#
# If you'd rather split them into two Render services later (e.g. to
# scale or redeploy them independently), that's still possible: create
# a second `runtime: static` service with rootDir: frontend and
# staticPublishPath: ., then set frontend/js/config/env.js's
# PRODUCTION_API_BASE_URL back to that backend's absolute URL instead
# of the current relative '/api'.
#
# None of the field names here are guessed blind — rootDir,
# buildCommand, and startCommand all come directly from what's
# actually in this repo and from the service that's actually running.
# That said, Render's Blueprint schema does evolve; verify the
# top-level keys below against Render's current Blueprint reference
# before relying on this, since this file was written without live
# access to Render's docs.
#
# No secret values live in this file. Every sensitive var is marked
# `sync: false`, which tells Render to prompt for the value in the
# dashboard instead of reading one from here.

services:
  - type: web
    name: job-rush
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render provides PORT automatically; the app already reads
      # process.env.PORT (see backend/src/config/env.js) and binds to
      # all interfaces by default (Node's server.listen(port) with no
      # host argument), which is what Render's containers require.
      - key: APP_BASE_URL
        sync: false # this service's own deployed origin — frontend and backend are the same origin now, e.g. https://job-rush.onrender.com
      - key: API_BASE_URL
        sync: false # same origin as above, e.g. https://job-rush.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_PRO_PLAN_CODE
        sync: false
      - key: PRO_MONTHLY_PRICE_NGN
        value: "4000"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # must exactly match this service's deployed URL + /api/auth/google/callback
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        sync: false # must exactly match this service's deployed URL + /api/auth/facebook/callback
      - key: APPLE_CLIENT_ID
        sync: false # the Services ID, not the App ID
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false # the .p8 key's contents, with real newlines as literal \n
      - key: APPLE_REDIRECT_URI
        sync: false # must exactly match this service's deployed URL + /api/auth/apple/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false # self-generated with `npx web-push generate-vapid-keys` — not a third-party account
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false # Android app push (FCM) — Firebase Console > Project Settings > Service Accounts > Generate new private key; paste the whole JSON file as one line
      - key: VAPID_SUBJECT
        value: mailto:support@jobrush.ng
      # See backend/.env.example for the full variable list (email
      # branding, rate limiting, OTP, video-processing tunables, etc.)
      # — only the ones with no safe default are required here;
      # everything else falls back to the same defaults env.js uses locally.
